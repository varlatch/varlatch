  /organizations/{org}/grants/{grant}:
    delete:
      tags: [grants]
      operationId: deleteGrant
      parameters:
        - $ref: "#/components/parameters/org"
        - name: grant
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/grants/{grant}/replace:
    post:
      tags: [grants]
      operationId: replaceGrant
      summary: >
        Atomically revoke a Grant and create its replacement (capability
        grants.replace, ADR-0029). Grant declarations are immutable — this
        is the only edit path. The new declaration is validated, the active
        original revoked, and the replacement created in one transaction
        with linked audit events; failure rolls back everything. Replacing
        an already-revoked Grant fails with VERSION_CONFLICT, so concurrent
        replacements cannot create multiple successors.
      parameters:
        - $ref: "#/components/parameters/org"
        - name: grant
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              description: >
                Complete replacement declaration, same shape as grant
                creation: subject is exactly one of subjectIdentityId or
                subjectGroupId; permission is exactly one of actions or
                roleId.
              properties:
                subjectIdentityId: { type: string }
                subjectGroupId: { type: string }
                scope: { $ref: "#/components/schemas/GrantScope" }
                actions:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/Action" }
                roleId: { type: string }
      responses:
        "201":
          description: Replacement created; original revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantReplacement" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/requirements:
    get:
      tags: [grants]
      operationId: listRequirements
      summary: List the organization's active Requirements
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Requirements
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Requirement" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [grants]
      operationId: createRequirement
      summary: >
        Create a Requirement (capability tailnet.constraints). Requirements
        are restrictive: evaluated after Grants, they may only reduce the
        set of successful operations, never create permission. The selector
        must name at least one tag, user, or node.
      parameters: [{ $ref: "#/components/parameters/org" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, target, selector]
              properties:
                kind: { type: string, enum: [tailnet] }
                target: { $ref: "#/components/schemas/RequirementTarget" }
                selector: { $ref: "#/components/schemas/TailnetSelector" }
      responses:
        "201":
          description: Created requirement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Requirement" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/requirements/{requirement}:
    patch:
      tags: [grants]
      operationId: updateRequirement
      summary: >
        Update a Requirement's target or selector in place (capability
        access.update, ADR-0029). Kind is immutable. Loosening and
        tightening are equally audited with the old/new diff. While the
        Organization enforces requirement-protection (capability
        security.enforce.requirement-protection, ADR-0054), an edit that
        changes anything needs the requester's step-up approval (operation
        requirement.update, bound to the Requirement, its resulting target
        and selector and expectedVersion): without the Varlatch-Approval
        header the answer is STEP_UP_REQUIRED, and a machine credential is
        refused with PERMISSION_DENIED. An edit that changes nothing needs
        none.
      parameters:
        - $ref: "#/components/parameters/org"
        - { name: requirement, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/idempotencyKey"
        - $ref: "#/components/parameters/approvalHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { $ref: "#/components/schemas/EntityVersion" }
                target: { $ref: "#/components/schemas/RequirementTarget" }
                selector: { $ref: "#/components/schemas/TailnetSelector" }
      responses:
        "200":
          description: Updated requirement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Requirement" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [grants]
      operationId: deleteRequirement
      summary: >
        Revoke a Requirement. While the Organization enforces
        requirement-protection (capability
        security.enforce.requirement-protection, ADR-0054), it needs the
        requester's step-up approval (operation requirement.revoke, bound to
        the Requirement and the version the server read): without the
        Varlatch-Approval header the answer is STEP_UP_REQUIRED, and a
        machine credential is refused with PERMISSION_DENIED. STATE_CHANGED
        when the Requirement was edited while the revocation ran; nothing is
        revoked.
      parameters:
        - $ref: "#/components/parameters/org"
        - { name: requirement, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/approvalHeader"
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/audit-events:
    get:
      tags: [audit]
      operationId: listAuditEvents
      summary: >
        List the organization's Security Audit Events, newest first. Optional
        filters (capability audit.filters) are ANDed; each only narrows what
        audit.read already shows, and the order, and so every cursor, is the
        same with or without them. Pass the same filters with each cursor.
        A filter that is malformed, empty, or given twice is refused with
        VALIDATION_FAILED. Requires audit.read; existence-hiding.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/auditDecision"
        - $ref: "#/components/parameters/auditEventType"
        - $ref: "#/components/parameters/auditActorIdentityId"
        - $ref: "#/components/parameters/auditActor"
        - $ref: "#/components/parameters/auditProjectId"
        - $ref: "#/components/parameters/auditEnvironmentId"
        - $ref: "#/components/parameters/auditItem"
        - $ref: "#/components/parameters/auditSince"
        - $ref: "#/components/parameters/auditUntil"
      responses:
        "200":
          description: Security Audit Events, newest first (deterministic occurredAt+eventId ordering)
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
                  credentials:
                    type: object
                    additionalProperties: { $ref: "#/components/schemas/AuditCredential" }
                    description: >
                      The credentials this page's events name in credentialId,
                      by ID (capability audit.attribution): a sidecar of the
                      listing, not part of the event schema, so the export and
                      webhook deliveries do not carry it. Absent from older
                      servers.
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/audit-events/export:
    get:
      tags: [audit]
      operationId: exportAuditEvents
      summary: >
        Stream the organization's Security Audit Events as NDJSON, oldest
        first. Takes the same optional filters as the listing (capability
        audit.filters), validated before the stream starts. Requires
        audit.read; existence-hiding.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/auditDecision"
        - $ref: "#/components/parameters/auditEventType"
        - $ref: "#/components/parameters/auditActorIdentityId"
        - $ref: "#/components/parameters/auditActor"
        - $ref: "#/components/parameters/auditProjectId"
        - $ref: "#/components/parameters/auditEnvironmentId"
        - $ref: "#/components/parameters/auditItem"
        - $ref: "#/components/parameters/auditSince"
        - $ref: "#/components/parameters/auditUntil"
      responses:
        "200":
          description: One versioned AuditEvent JSON document per line
          content:
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/AuditEvent" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/webhooks:
    get:
      tags: [audit]
      operationId: listWebhooks
      summary: List the organization's active audit webhooks
      parameters: [{ $ref: "#/components/parameters/org" }]
      responses:
        "200":
          description: Active webhooks
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Webhook" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [audit]
      operationId: createWebhook
      summary: >
        Register an audit webhook (capability webhooks.audit). The endpoint
        receives POSTed batches of the organization's audit events, ordered,
        at-least-once, starting from registration (never history). Each
        delivery is signed: the X-Varlatch-Signature header carries
        "t=<unix-seconds>,v1=<hex>" where v1 is HMAC-SHA256(secret,
        "<t>.<raw-body>"); receivers should verify the signature and reject
        stale timestamps. The signing secret is returned exactly once.
      parameters: [{ $ref: "#/components/parameters/org" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, minLength: 1, maxLength: 2000 }
                eventTypes:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, minLength: 1, maxLength: 200 }
                  description: Optional event-type filter; absent means all events.
      responses:
        "201":
          description: Created webhook with its one-time signing secret (Cache-Control no-store)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedWebhook" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/webhooks/{webhook}:
    patch:
      tags: [audit]
      operationId: updateWebhook
      summary: >
        Update a webhook's URL or event-type filter in place (capability
        access.update, ADR-0029). Delivery identity and progress are
        preserved: the signing secret and delivery cursor are unchanged
        (secret rotation is not part of this operation), and undelivered
        events — including backlog — go to the new URL/filter on subsequent
        attempts; an already-started attempt may finish against the previous
        configuration. URLs containing userinfo are rejected. A supplied
        eventTypes array replaces the whole filter; null clears it (all
        events).
      parameters:
        - $ref: "#/components/parameters/org"
        - { name: webhook, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { $ref: "#/components/schemas/EntityVersion" }
                url: { type: string, minLength: 1, maxLength: 2000 }
                eventTypes:
                  type: [array, "null"]
                  minItems: 1
                  maxItems: 100
                  items: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Updated webhook (never includes the signing secret)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [audit]
      operationId: revokeWebhook
      summary: Revoke an audit webhook; delivery stops immediately
      parameters:
        - $ref: "#/components/parameters/org"
        - name: webhook
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/platform-connections:
    get:
      tags: [sync]
      operationId: listPlatformConnections
      summary: List the organization's Platform Connections (ADR-0031)
      parameters: [{ $ref: "#/components/parameters/org" }]
      responses:
        "200":
          description: Active Platform Connections with referencing-target counts
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PlatformConnection" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [sync]
      operationId: createPlatformConnection
      summary: >
        Create a Platform Connection (capability sync.targets): platform
        type, immutable base identity (GitHub owner, Coolify instance
        origin), and the Platform Credential — encrypted under the
        Organization KEK, never displayed again after entry. A Connection
        alone discloses nothing; disclosure authority lives on the Sync
        Targets that use it.
      parameters: [{ $ref: "#/components/parameters/org" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [platform, baseIdentity, name, credential]
                  properties:
                    platform: { $ref: "#/components/schemas/SyncPlatform" }
                    baseIdentity: { type: string, minLength: 1, maxLength: 500 }
                    name: { type: string, minLength: 1, maxLength: 200 }
                    credential: { type: string, minLength: 1, maxLength: 10000 }
                    credentialKind: { type: string, enum: [token] }
                - type: object
                  description: >
                    A Connection on an installation of the Organization's
                    GitHub App (ADR-0047 Decision 2): no credential, only the
                    installation. Varlatch reads it as the App (it must be
                    this App's, and not suspended), and its account becomes
                    the base identity. Every push, check, and listing then
                    mints a one-hour token narrowed to the use.
                  required: [credentialKind, installationId, name]
                  properties:
                    credentialKind: { type: string, enum: [github-app] }
                    installationId: { type: integer, minimum: 1 }
                    name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: Created Connection (the credential is never returned; Cache-Control no-store)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformConnection" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/platform-connections/check:
    post:
      tags: [sync]
      operationId: checkPlatformAccess
      summary: >
        Read-only access check (ADR-0031, amendment 2026-10-09): does a
        credential reach the base identity, and the destination when one
        is named? Either a new credential (platform, baseIdentity,
        credential) or a Connection's stored one (connectionId), optionally
        replaced by a candidate credential. Nothing is stored or pushed;
        the outcome is audited. A completed check answers 200 whatever the
        platform said.
      parameters: [{ $ref: "#/components/parameters/org" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                connectionId: { type: string, minLength: 1 }
                platform: { $ref: "#/components/schemas/SyncPlatform" }
                baseIdentity: { type: string, minLength: 1, maxLength: 500 }
                credential: { type: string, minLength: 1, maxLength: 10000 }
                destination:
                  type: object
                  additionalProperties: true
                  description: The adapter-specific destination, as for a Sync Target; omitted or empty checks the base identity only.
      responses:
        "200":
          description: The check's outcome (Cache-Control no-store)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessCheck" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/platform-connections/destinations:
    post:
      tags: [sync]
      operationId: listPlatformDestinations
      summary: >
        The destinations a credential can see on its base identity, for the
        dashboard's pickers (ADR-0031, amendment 2026-10-09): GitHub
        repositories in the owner, or the applications and services of a
        Coolify token's team. Read-only, under the access check's rules: a new credential
        (platform, baseIdentity, credential) or a Connection's stored one
        (connectionId), optionally replaced by a candidate. Seeing a
        destination is not permission to write it. Convex, whose base
        identity is the destination, has nothing to list (422). A listing
        that could not run still answers 200, with the reason in check.
      parameters: [{ $ref: "#/components/parameters/org" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                connectionId: { type: string, minLength: 1 }
                platform: { $ref: "#/components/schemas/SyncPlatform" }
                baseIdentity: { type: string, minLength: 1, maxLength: 500 }
                credential: { type: string, minLength: 1, maxLength: 10000 }
      responses:
        "200":
          description: The listing (Cache-Control no-store)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DestinationListing" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/platform-connections/{connection}:
    get:
      tags: [sync]
      operationId: getPlatformConnection
      summary: >
        One Connection with every referencing Sync Target — the dependency
        list an actor reviews before credential replacement, which must
        re-authorize all of them atomically.
      parameters:
        - $ref: "#/components/parameters/org"
        - { name: connection, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Connection detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PlatformConnection"
                  - type: object
                    required: [targets]
                    properties:
                      targets:
                        type: array
                        items: { $ref: "#/components/schemas/SyncTarget" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [sync]
      operationId: revokePlatformConnection
      summary: Revoke a Connection; every referencing Sync Target is disabled
      parameters:
        - $ref: "#/components/parameters/org"
        - { name: connection, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/platform-connections/{connection}/credential:
    post:
      tags: [sync]
      operationId: replacePlatformCredential
      summary: >
        Replace the Platform Credential (ADR-0031): a new disclosure grant
        for every non-revoked referencing Sync Target at once. The actor
        must pass each Target's write-time disclosure gate at this moment;
        otherwise the whole replacement is refused — never a partial split
        across old and new credentials.
      parameters:
        - $ref: "#/components/parameters/org"
        - { name: connection, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential, expectedVersion]
              properties:
                credential: { type: string, minLength: 1, maxLength: 10000 }
                expectedVersion: { $ref: "#/components/schemas/EntityVersion" }
      responses:
        "200":
          description: Updated Connection (Cache-Control no-store)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformConnection" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/github-app:
    delete:
      tags: [sync]
      operationId: removeGitHubApp
      summary: >
        Remove the Organization's GitHub App from Varlatch (ADR-0047
        Decision 5): every Connection on it is revoked in one transaction,
        their Sync Targets are disabled and keep their destination claims,
        and the stored private key is deleted. Removal narrows disclosure,
        so it needs config.sync.manage only. GitHub is not touched: the App
        stays registered and installed there until its owner deletes it.
        appId names the App the caller confirmed: if the Organization's live
        App is another one (it was replaced meanwhile), nothing changes and
        the answer is 409 STATE_CHANGED.
      parameters:
        - { $ref: "#/components/parameters/org" }
        - name: appId
          in: query
          required: true
          description: The id of the App being removed (GitHubApp.id), as the caller saw it
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [sync]
      operationId: getGitHubApp
      summary: >
        The Organization's GitHub App (ADR-0047), if it has one. Its private
        key rests under the Organization KEK and is never returned.
      parameters: [{ $ref: "#/components/parameters/org" }]
      responses:
        "200":
          description: The live GitHub App
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubApp" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/github-app/registrations:
    post:
      tags: [sync]
      operationId: startGitHubAppRegistration
      summary: >
        Start registering the Organization's GitHub App through GitHub's
        manifest flow (ADR-0047 Decision 1). Returns the manifest and where
        the browser posts it (a form field named `manifest`, holding its
        JSON), with a single-use state bound to the caller, the
        Organization, and the GitHub account named here. GitHub sends the
        browser back to the dashboard with a code, within the hour. Needs
        the Installation's public URL over HTTPS (or loopback), and no live
        App in the Organization.
      parameters: [{ $ref: "#/components/parameters/org" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account]
              properties:
                account: { $ref: "#/components/schemas/GitHubAccount" }
      responses:
        "201":
          description: The registration started (Cache-Control no-store; the state is returned only here)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubAppRegistrationStart" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/github-app/registrations/complete:
    post:
      tags: [sync]
      operationId: completeGitHubAppRegistration
      summary: >
        Complete a registration with the state and GitHub's code. The state
        is consumed once, by the caller who started it (CONSUMED and EXPIRED
        answer 410). The App is stored only when GitHub created it on the
        intended account: GitHub creates it on the person's own account when
        they may not register Apps on the intended one, and then the App is
        refused, nothing is kept, and the answer says where to delete it
        (ADR-0047, amendment 2026-10-09). If GitHub cannot be reached, the
        state is released for another attempt.

        Registration is staged (ADR-0054 amendment D): GitHub's answer is
        stored as a pending conversion on the registration, then attached
        in the same request when no approval is needed. When the
        Organization's admin-step-up control asks for one, the answer is
        STEP_UP_REQUIRED for the registration (github_app.register), its
        details naming `registrationId`; the client repeats the attachment
        (`…/registrations/{registration}/attach`) with the approval, never
        this callback. A repeat of the callback answers CONSUMED with
        `registrationId` and `pending` in its details.
      parameters: [{ $ref: "#/components/parameters/org" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, code]
              properties:
                state: { type: string, minLength: 1, maxLength: 200 }
                code: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: Registered (Cache-Control no-store)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubAppRegistrationRegistered" }
        "200":
          description: Refused, or failed (Cache-Control no-store); nothing was stored
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/GitHubAppRegistrationRefused" }
                  - { $ref: "#/components/schemas/GitHubAppRegistrationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/github-app/registrations/{registration}/attach:
    post:
      tags: [sync]
      operationId: attachGitHubAppRegistration
      summary: >
        Attach a pending registration (ADR-0054 amendment D): the App GitHub
        handed over is stored for the Organization and the pending key is
        deleted. A protected operation, github_app.register: under
        admin-step-up's enforce it needs the caller's approval, bound to the
        registration and the App's id, slug, client id and owner. Only the
        person who started the registration may attach it; for anyone else
        it is not found. A pending conversion that expired, was discarded or
        already ended, an Organization that got another App, or an App
        another Organization uses end the registration: its key is deleted
        and the answer is the refusal. Calls nothing outside Varlatch.
      parameters:
        - { $ref: "#/components/parameters/org" }
        - { name: registration, in: path, required: true, schema: { type: string } }
      responses:
        "201":
          description: Attached (Cache-Control no-store)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubAppRegistrationRegistered" }
        "200":
          description: Refused (Cache-Control no-store); the pending key was deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubAppRegistrationRefused" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/github-app/registrations/{registration}:
    delete:
      tags: [sync]
      operationId: discardGitHubAppRegistration
      summary: >
        Discard a pending registration: its key is deleted and
        sync.github_app_registration_abandoned recorded. The App stays on
        GitHub; `deleteUrl` is where its owner deletes it. One that is no
        longer pending changes nothing (`discarded: false`). Only the person
        who started it may discard it.
      parameters:
        - { $ref: "#/components/parameters/org" }
        - { name: registration, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Discarded, or nothing to discard
          content:
            application/json:
              schema:
                type: object
                required: [discarded, deleteUrl]
                properties:
                  discarded: { type: boolean }
                  deleteUrl: { type: [string, "null"] }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/github-app/import:
    post:
      tags: [sync]
      operationId: importGitHubApp
      summary: >
        Import a GitHub App someone registered on GitHub (ADR-0047 Decision
        1): its App id and private key. Varlatch verifies the pair first,
        with a JWT signed by the key and GET /app answering that id, and
        takes the client id, slug, and owner from GitHub. The App needs
        secrets and environments (write) and metadata (read); it may have
        more, which the audit event names with their levels. The stored key
        keeps everything the App holds: the tokens Varlatch mints are
        narrowed to each use, but the key itself could mint broader ones,
        so grant the App no more than it needs. A refused JWT is read by its own
        time claims against GitHub's Date header: the key, or this server's
        clock. Refused (409) when the Organization already has a live App,
        or another Organization has this one.
      parameters: [{ $ref: "#/components/parameters/org" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appId, privateKey]
              properties:
                appId: { type: integer, minimum: 1 }
                privateKey: { type: string, minLength: 1, maxLength: 10000, description: The App's RSA private key in PEM, as GitHub issues it }
      responses:
        "201":
          description: Imported (Cache-Control no-store; the key is never returned)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubAppRegistrationRegistered" }
        "200":
          description: Not imported, and why (Cache-Control no-store); nothing was stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubAppImportFailed" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/github-app/key:
    post:
      tags: [sync]
      operationId: rotateGitHubAppKey
      summary: >
        Rotate the GitHub App's private key (ADR-0047 Decision 5): generate a
        new key on GitHub, send it here, then delete the old one on GitHub.
        Varlatch verifies the new key first (GET /app as the App, before any
        lock). The rotation is a new disclosure grant for every non-revoked
        Sync Target of every non-revoked Connection on the App, paused and
        auto-disabled ones included: the caller must pass each Target's
        write-time disclosure gate, or the whole rotation is refused (403).
        expectedVersion must be the App's current version (409 otherwise).
        Every Target is then queued to converge with the new key, and the
        audit event records each Target's gate decisions (Grants, applied
        Roles and Groups, Requirements).
      parameters: [{ $ref: "#/components/parameters/org" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [privateKey, expectedVersion]
              properties:
                privateKey: { type: string, minLength: 1, maxLength: 10000, description: The App's new RSA private key in PEM }
                expectedVersion: { $ref: "#/components/schemas/EntityVersion" }
      responses:
        "200":
          description: Rotated, or not, and why (Cache-Control no-store; the key is never returned)
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [outcome, app]
                    properties:
                      outcome: { type: string, enum: [rotated] }
                      app: { $ref: "#/components/schemas/GitHubApp" }
                  - { $ref: "#/components/schemas/GitHubAppImportFailed" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/github-app/installations:
    get:
      tags: [sync]
      operationId: listGitHubAppInstallations
      summary: >
        Where the Organization's GitHub App is installed (ADR-0047 Decision
        2), signed as the App: the installations a Connection can be created
        on. Every installation must be this App's (its app_id); one that is
        not fails the listing. check says why not when the listing did not run (the key, this
        server's clock, GitHub unreachable, or an answer that is not
        GitHub's), and items is then empty. Audited as a use of the key.
      parameters: [{ $ref: "#/components/parameters/org" }]
      responses:
        "200":
          description: The installations, or why they could not be listed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubAppInstallationListing" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/sync-targets:
    get:
      tags: [sync]
      operationId: listOrgSyncTargets
      summary: Organization-wide Sync Target list (Connections view, rotation status)
      parameters: [{ $ref: "#/components/parameters/org" }]
      responses:
        "200":
          description: Non-revoked Sync Targets
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SyncTarget" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/sync-targets:
    get:
      tags: [sync]
      operationId: listSyncTargets
      summary: List the Environment's Sync Targets
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
      responses:
        "200":
          description: Non-revoked Sync Targets of this Environment
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SyncTarget" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [sync]
      operationId: createSyncTarget
      summary: >
        Create a Sync Target (capability sync.targets): standing disclosure
        authority binding this Environment to one destination on a Platform
        Connection. Requires config.sync.manage plus the write-time
        disclosure gate — secret.reveal for mapped Secrets and
        config.value.read for mapped non-sensitive items; a wildcard mapping
        (every current and future item) requires both on the Environment's
        scope. Decision-time provenance is recorded. A destination has
        exactly one writer per Installation.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connectionId, destination, mapping]
              properties:
                connectionId: { type: string }
                destination:
                  type: object
                  additionalProperties: true
                  description: >
                    Adapter-specific canonical destination. github-actions:
                    repo [+ environment]. coolify: exactly one of
                    applicationUuid or serviceUuid (a service: a Compose
                    stack whose variables reach all of its containers; it
                    takes no options, refuses the names Coolify sets itself,
                    and its redeploy restarts the whole stack). An
                    application takes per-target options that never enter
                    the destination identity — buildTime ("true"|"false":
                    mark the keys Varlatch manages as available at build
                    time; absent keeps Coolify's default for new keys and
                    each existing key's own flag) and deployAction ("deploy"
                    (default): forced rebuild, the only action that re-bakes
                    build-time values; "restart": recreate the container
                    with the current runtime env only), and platformExpands
                    (a list, or a comma-separated string, of env keys whose
                    values Coolify resolves as one of its own variables:
                    stored neither literal nor multiline, so {{team.X}} and
                    $VAR are Coolify's to interpret; every other name is
                    stored literal; at most 100; ADR-0031 amendment
                    2026-10-22). convex: no fields — the Connection's
                    deployment URL is the destination.
                mapping: { $ref: "#/components/schemas/SyncMappingInput" }
                removeOrphans:
                  type: boolean
                  description: >
                    Per-target removal opt-in — only then does a name leaving
                    the effective output get deleted at the destination
                    (bounded by the ledger; tombstones re-apply deletions).
                redeploy:
                  type: boolean
                  description: Best-effort platform redeploy after changed pushes, where supported.
      responses:
        "201":
          description: Created Sync Target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncTarget" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/sync-targets/{target}:
    get:
      tags: [sync]
      operationId: getSyncTarget
      summary: Sync Target detail with per-destination-name delivery state
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
        - { name: target, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Target detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SyncTarget"
                  - type: object
                    required: [names]
                    properties:
                      names:
                        type: array
                        items: { $ref: "#/components/schemas/SyncLedgerName" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [sync]
      operationId: updateSyncTarget
      summary: >
        Mutate a Sync Target. Widening the mapping, changing the destination,
        or re-pointing to a different Connection is a NEW disclosure grant:
        it re-runs the full write-time gate and is audited as such. A
        destination-identity change atomically swaps the exclusivity claim
        and resets the ledger; the old destination's copy is deliberately
        abandoned. Re-pointing across platform types is rejected.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
        - { name: target, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { $ref: "#/components/schemas/EntityVersion" }
                connectionId: { type: string }
                destination:
                  type: object
                  additionalProperties: true
                mapping: { $ref: "#/components/schemas/SyncMappingInput" }
                removeOrphans: { type: boolean }
                redeploy: { type: boolean }
      responses:
        "200":
          description: Updated Sync Target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncTarget" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [sync]
      operationId: revokeSyncTarget
      summary: >
        Revoke a Sync Target — the only lifecycle event (besides a
        destination change) that releases its destination claim. The
        destination's copy is not cleaned up.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
        - { name: target, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/sync-targets/{target}/push:
    post:
      tags: [sync]
      operationId: pushSyncTarget
      summary: >
        Schedule an immediate converge ("push now"). Idempotent: pushes
        converge the destination to current state, never replay deltas.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
        - { name: target, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Converge scheduled
          content:
            application/json:
              schema:
                type: object
                required: [scheduled]
                properties:
                  scheduled: { type: boolean }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/sync-targets/{target}/pause:
    post:
      tags: [sync]
      operationId: pauseSyncTarget
      summary: Pause delivery; the Target keeps its destination claim
      description: >
        Pausing stops a run in progress: it starts no further request and
        records nothing more (ADR-0050). Pausing a paused Target changes
        nothing; a disabled Target cannot be paused (VALIDATION_FAILED).
        With wait=true (capability `sync.pause-wait`) the answer waits until
        the Target is drained, for at most 30 seconds; `drained` says
        whether it is, and the pause has taken effect either way.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
        - { name: target, in: path, required: true, schema: { type: string } }
        - { name: wait, in: query, required: false, schema: { type: string, enum: ["true", "false"] } }
      responses:
        "200":
          description: Paused Target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncTarget" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/sync-targets/{target}/resume:
    post:
      tags: [sync]
      operationId: resumeSyncTarget
      summary: >
        Resume a paused or auto-disabled Target (audited); triggers an
        immediate converge. A Target disabled by Connection revocation must
        be re-pointed first.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
        - { name: target, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Resumed Target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncTarget" }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Opaque Varlatch credential (session-derived browser bearer, CLI
        credential, or service credential). Cookies never authenticate /v1.
        Every response to a request authenticated by a service credential
        of a machine that expires within 7 days, errors included, carries
        the Varlatch-Credential-Expires header (components/headers).

  parameters:
    approval:
      name: approval
      in: path
      required: true
      description: Approval (Approval Intent) ID
      schema: { type: string }
    approvalHeader:
      name: Varlatch-Approval
      in: header
      required: false
      description: >
        The id of an approved step-up approval for exactly this request
        (ADR-0054 Decision 3). Consumed with the operation, in its
        transaction: a failed operation leaves it usable until it expires,
        a successful one uses it up. APPROVAL_INVALID with details.reason
        when it does not fit (not found, pending, expired, used, closed,
        approved for another operation, target, body, version or requester,
        or, for an approval the dashboard asked for, its sign-in session has
        ended: signed out or expired). A CLI approval is bound to the CLI
        credential that asked; a dashboard approval to the browser session
        that asked, through any live bearer of that session.
      schema: { type: string }
    org:
      name: org
      in: path
      required: true
      description: Organization slug or ID
      schema: { type: string }
    project:
      name: project
      in: path
      required: true
      description: Project slug or ID
      schema: { type: string }
    environment:
      name: environment
      in: path
      required: true
      description: Environment name or ID (names may contain one slash for derived environments)
      schema: { type: string }
    item:
      name: item
      in: path
      required: true
      description: Config Item name
      schema: { type: string, pattern: "^[A-Z][A-Z0-9_]*$" }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous response; never parse.
      schema: { type: string }
    auditDecision:
      name: decision
      in: query
      description: Only events with this decision (capability audit.filters).
      schema: { type: string, enum: [allow, deny, info] }
    auditEventType:
      name: eventType
      in: query
      description: >
        Only events of this type, such as value.written; a value ending in
        .* is a prefix, so value.* matches value.written and
        value.rotation_started but not values.x (capability audit.filters).
      schema: { type: string, maxLength: 202, pattern: "^[a-z][a-z0-9_-]*(\\.[a-z][a-z0-9_-]*)*(\\.\\*)?$" }
    auditActorIdentityId:
      name: actorIdentityId
      in: query
      description: Only events whose actor is this identity ID (capability audit.filters).
      schema: { type: string, maxLength: 200 }
    auditActor:
      name: actor
      in: query
      description: >
        varlatch: only Varlatch's own events, those with no actor identity
        (sync delivery, webhooks, operator commands), except
        authentication.* events, whose missing actor is an unknown caller
        (capability audit.attribution). Given with actorIdentityId it is
        refused with VALIDATION_FAILED.
      schema: { type: string, enum: [varlatch] }
    auditProjectId:
      name: projectId
      in: query
      description: Only events whose resource names this project ID (capability audit.filters).
      schema: { type: string, maxLength: 200 }
    auditEnvironmentId:
      name: environmentId
      in: query
      description: Only events whose resource names this environment ID (capability audit.filters).
      schema: { type: string, maxLength: 200 }
    auditItem:
      name: item
      in: query
      description: >
        Only events about this Config Item: its name is the resource's
        itemName (value writes, deletions, rotations) or listed in the
        metadata's items (disclosures, validations, Capabilities)
        (capability audit.filters).
      schema: { type: string, maxLength: 200, pattern: "^[A-Z][A-Z0-9_]*$" }
    auditSince:
      name: since
      in: query
      description: >
        Only events at or after this RFC 3339 timestamp, with a time zone
        (capability audit.filters).
      schema: { type: string, format: date-time }
    auditUntil:
      name: until
      in: query
      description: >
        Only events before this RFC 3339 timestamp, with a time zone; must
        not be before since (capability audit.filters).
      schema: { type: string, format: date-time }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      description: >
        Optional. Retrying with the same key and identical body returns the
        original result; the same key with a materially different body fails
        with IDEMPOTENCY_CONFLICT.
      schema: { type: string, maxLength: 255 }

  headers:
    VarlatchCredentialExpires:
      description: >
        Sent on every response to a request authenticated by a machine's
        service credential that expires within 7 days, whatever its total
        lifetime, errors included: when that credential expires. Absent for
        credentials without an expiry or expiring later, for credentials
        renewed by design (a person's browser and CLI credentials, OIDC
        exchanges, agent runs), and on unauthenticated responses. Clients
        holding a credential they cannot renew by signing in
        (VARLATCH_TOKEN) use it to warn ahead.
      schema: { type: string, format: date-time, examples: ["2026-11-17T12:00:00.000Z"] }

  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

  schemas:
    BackupVerification:
      type: object
      required: [integrity, compatibility, keyMatch, targetRelease, checkedAt]
      properties:
        integrity: { type: boolean }
        compatibility: { type: boolean }
        keyMatch: { type: boolean }
        targetRelease: { type: string }
        checkedAt: { type: string, format: date-time }
    BackupArchiveStatus:
      type: object
      required: [archiveId, installationId, createdAt, release, requiredKeyVersions]
      properties:
        archiveId: { type: string, format: uuid }
        installationId: { type: string }
        createdAt: { type: string, format: date-time }
        release: { type: string }
        requiredKeyVersions:
          type: array
          items: { type: integer }
        verification: { $ref: "#/components/schemas/BackupVerification" }
        delivery:
          type: object
          required: [destination, uploadedAt]
          properties:
            destination: { type: string }
            uploadedAt: { type: string, format: date-time }
            remoteVerification: { $ref: "#/components/schemas/BackupVerification" }
    InstallationBackups:
      type: object
      required: [archives, warnings]
      properties:
        archives:
          type: array
          items: { $ref: "#/components/schemas/BackupArchiveStatus" }
        warnings:
          type: array
          items: { type: string }
    ReleaseCheckFailure:
      type: string
      description: Why the host's last check found no answer; never GitHub's own text.
      enum: [unreachable, rate-limited, not-found, invalid-answer]
    InstallationRelease:
      type: object
      required: [running, newer, latest, lastAttempt, unreadable]
      properties:
        running:
          type: string
          description: This server's version.
        newer:
          type: [boolean, "null"]
          description: >
            Whether the last successful check found a release newer than
            `running`; null without one. A check's age does not expire true.
        latest:
          description: The last successful check, or null.
          oneOf:
            - type: "null"
            - type: object
              required: [version, publishedAt, url, repo, releaseSet, checkedAt]
              properties:
                version: { type: string }
                publishedAt: { type: [string, "null"], format: date-time }
                url:
                  type: string
                  description: The release's GitHub page, built by the server from repo and version.
                repo:
                  type: string
                  description: The repository checked, owner/name.
                releaseSet:
                  type: boolean
                  description: Whether the checked directory holds varlatch-release.json, so `varlatch upgrade` applies there.
                checkedAt: { type: string, format: date-time }
        lastAttempt:
          description: The last check, successful or not, or null.
          oneOf:
            - type: "null"
            - type: object
              required: [checkedAt, repo, failed]
              properties:
                checkedAt: { type: string, format: date-time }
                repo: { type: string }
                failed:
                  oneOf:
                    - type: "null"
                    - $ref: "#/components/schemas/ReleaseCheckFailure"
        unreadable:
          type: boolean
          description: True when a record exists on the host but cannot be read.
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            requestId: { type: string }
            details: { type: object }

    ErrorCode:
      type: string
      enum:
        - AUTHENTICATION_REQUIRED
        - INVALID_CREDENTIAL
        - PERMISSION_DENIED
        - RESOURCE_NOT_FOUND
        - VALIDATION_FAILED
        - VERSION_CONFLICT
        - ROTATION_IN_PROGRESS
        - IDEMPOTENCY_CONFLICT
        - CONTRACT_INVALID
        - CONTRACT_DRIFT
        - CONTRACT_MAPPING_UNRESOLVED
        - ENVIRONMENT_EXPIRED
        - TAILNET_CONTEXT_REQUIRED
        - TAILNET_CONTEXT_UNAVAILABLE
        - RATE_LIMITED
        - MAINTENANCE
        - INTERNAL
        - STATE_CHANGED
        - AUTHORIZATION_PENDING
        - SLOW_DOWN
        - ACCESS_DENIED
        - EXPIRED
        - CONSUMED
        - ORGANIZATION_DELETING
        - ORGANIZATION_DELETED
        - STEP_UP_REQUIRED
        - APPROVAL_INVALID
        - CONTROL_MODE_UNAVAILABLE
        - CREDENTIAL_LIFETIME_EXCEEDED
        - ORGANIZATION_FROZEN
        - PASSKEY_VERIFICATION_REQUIRED

    NextCursor:
      type: [string, "null"]
      description: Opaque; null when no further pages exist.

    Slug:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"

    EnvironmentName:
      type: string
      description: Free-form; derived environments use parent/suffix form (e.g. development/jeremy).
      pattern: "^[a-z0-9][a-z0-9._-]{0,62}(/[a-z0-9][a-z0-9._-]{0,62})?$"

    Tier:
      type: string
      enum: [development, staging, production]

    EnvironmentKind:
      type: string
      enum: [shared, personal, preview]

    ContractAuthority:
      type: string
      enum: [git, managed]

    Meta:
      type: object
      required: [apiMajor, serverVersion, capabilities]
      properties:
        apiMajor: { type: integer }
        serverVersion: { type: string }
        minSupportedCliVersion: { type: string }
        capabilities:
          type: array
          items: { type: string }
        installationId: { type: string }
        syncAdapters:
          type: array
          items: { $ref: "#/components/schemas/SyncPlatform" }
          description: >
            Platform adapters this Installation allows for outbound sync
            (ADR-0031); absent when the installation switch is off.
        semanticsVersions:
          type: array
          items: { type: integer }
          description: >
            Contract Semantics versions this server evaluates. Absent on
            servers older than 0.11.0, which evaluate only version 1.
            Version 3 (from 0.13.0) adds the `integer` item type.

    InstallationListeners:
      type: object
      required: [tailnet]
      properties:
        tailnet:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/TailnetListenerReport"

    TailnetListenerReport:
      type: object
      required: [configured, observed]
      properties:
        configured:
          type: object
          required: [tailnet, listenerPort, browserEndpoint]
          description: From configuration only.
          properties:
            tailnet: { type: string }
            listenerPort: { type: integer }
            browserEndpoint: { type: [string, "null"] }
        observed:
          type: object
          required: [checkedAt, checks]
          properties:
            checkedAt:
              type: [string, "null"]
              format: date-time
              description: Null before the first check.
            checks:
              type: object
              required: [listener, localApi, node]
              properties:
                listener: { $ref: "#/components/schemas/ObservedCheck" }
                browserTls:
                  $ref: "#/components/schemas/ObservedCheck"
                  description: Present only when the browser endpoint is configured.
                localApi: { $ref: "#/components/schemas/ObservedCheck" }
                node: { $ref: "#/components/schemas/ObservedCheck" }
            node:
              $ref: "#/components/schemas/ObservedNode"
              description: >
                The node as varlatchd last read it, at checkedAt. Absent
                before the first successful LocalAPI read and after a failed
                one, and from older servers.

    ObservedNode:
      type: object
      description: >
        The node's own details from its LocalAPI status. Each field is
        validated: one that is absent or malformed is omitted. Nothing here
        says who can reach the node.
      properties:
        name: { type: string, description: "The node's actual machine name, the first label of its DNS name." }
        dnsName: { type: string, description: "Its MagicDNS name, without the trailing dot." }
        tailnet: { type: string, description: "The tailnet it is on, its MagicDNS suffix." }
        tags:
          type: array
          items: { type: string }
          description: Its ACL tags; absent for an untagged node.
        addresses:
          type: array
          items: { type: string }
          description: Its Tailscale addresses, IPv4 first.
        nodeId: { type: string, description: "Its Tailscale StableID." }

    ObservedCheck:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pass, fail, unknown] }
        reason:
          type: string
          enum: [NOT_CHECKED, NOT_LISTENING, NO_CERTIFICATE, LOCALAPI_UNAVAILABLE, NOT_RUNNING, OTHER_TAILNET, NAME_CHANGED]
        certificateNotAfter:
          type: string
          format: date-time
          description: browserTls only, when the certificate in use expires.

    TailnetEndpoint:
      type: object
      required: [browserEndpoint]
      properties:
        browserEndpoint:
          type: [string, "null"]
          description: >
            The HTTPS URL of the tailnet browser endpoint, such as
            https://varlatch.example.ts.net:8688; null when it is off.

    TailnetDevice:
      type: object
      required: [recognized]
      properties:
        recognized: { type: boolean }
        reason:
          type: string
          enum: [resolver-unavailable, unrecognized, other-tailnet, shared, self]
          description: >
            Why the connection has no verified device; present only when
            recognized is false. Every reason fails closed.
        tailnet: { type: string }
        nodeId: { type: string, description: "The device's Tailscale StableID." }
        nodeName: { type: string, description: "The device's machine name." }
        tags:
          type: array
          items: { type: string }
        userLogin:
          type: string
          description: The device's Tailscale user; only for untagged devices.

    Organization:
      type: object
      required: [id, slug, name, createdAt]
      properties:
        id: { type: string }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        createdAt: { type: string, format: date-time }

    Project:
      type: object
      required: [id, organizationId, slug, name, contractAuthority, createdAt]
      properties:
        id: { type: string }
        organizationId: { type: string }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        contractAuthority: { $ref: "#/components/schemas/ContractAuthority" }
        activeContractRevisionId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    Environment:
      type: object
      required: [id, projectId, name, kind, tier, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { $ref: "#/components/schemas/EnvironmentName" }
        kind: { $ref: "#/components/schemas/EnvironmentKind" }
        tier: { $ref: "#/components/schemas/Tier" }
        parentEnvironmentId: { type: [string, "null"] }
        ownerIdentityId: { type: [string, "null"] }
        expiresAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        tailnetRequired:
          type: boolean
          description: >-
            True when an active Tailnet Requirement covers this Environment
            (capability environments.tailnet-required): reading its values,
            non-sensitive ones included, needs verified Tailnet Context, which
            only the tailnet listener establishes. Names and other metadata
            stay readable as before. Derived per response from the active
            Requirements with the same targeting authorization uses (a tier,
            this Environment, or the root it derives from); never stored.
        tailnetRequirementIds:
          type: array
          items: { type: string }
          description: >-
            The Requirements that cover this Environment. Present only when
            tailnetRequired is true and the caller holds policy.read in the
            organization.

    ValueVersion:
      type: object
      required: [versionId, itemName, environmentId, sensitive, createdAt]
      description: Value metadata only — plaintext is never echoed by mutations.
      properties:
        versionId: { type: string }
        itemName: { type: string }
        environmentId: { type: string }
        sensitive: { type: boolean }
        previousVersionId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    EffectiveConfigurationItem:
      type: object
      required: [name, sensitive, source]
      properties:
        name: { type: string }
        sensitive: { type: boolean }
        source:
          type: string
          enum: [self, parent]
        versionId: { type: string }
        value:
          type: [string, "null"]
          description: >
            Present only when include=values and the caller is authorized;
            null for items the caller may know exist but not read.
        rawValue:
          type: string
          description: >
            Present only when the stored value contains ${NAME} references
            that were expanded in `value` (capability values.references):
            the literal stored text. Editors must write this back — writing
            the expanded `value` would destroy the reference.
        rotating:
          type: boolean
          description: >
            True while a dual-phase rotation (ADR-0027) is active for this
            item. Metadata only — the retiring plaintext is exposed solely
            through explicit disclosure and capability exercise.

    ValueRotation:
      type: object
      required: [itemName, environmentId, primaryVersionId, sensitive]
      description: Rotation state after a begin/complete operation (no plaintext).
      properties:
        itemName: { type: string }
        environmentId: { type: string }
        primaryVersionId: { type: string }
        retiringVersionId: { type: [string, "null"] }
        rotationDeadline: { type: [string, "null"], format: date-time }
        sensitive: { type: boolean }

    EffectiveConfiguration:
      type: object
      required: [environmentId, items]
      properties:
        environmentId: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/EffectiveConfigurationItem" }
        manifest: { $ref: "#/components/schemas/StateManifest" }
        stateDigest: { $ref: "#/components/schemas/StateDigest" }
        callerView: { $ref: "#/components/schemas/CallerView" }

    DisclosurePurpose:
      type: string
      enum: [scan, export]
      description: >
        Why the caller asks for a disclosure, recorded as `purpose` in the
        disclosure's `secret.disclosed` audit event and in any
        reference-expansion `value.disclosed` events it causes. `scan`: a
        local secret scan (`varlatch scan`). `export`: read for an env file
        (capability `disclosure.purpose.export`, ADR-0053); it proves
        neither that a file was saved nor which values went into it. Any
        other value is refused with VALIDATION_FAILED.

    StateDigest:
      type: string
      pattern: "^sha256:[0-9a-f]{64}$"
      description: >
        SHA-256 over the canonical JSON encoding of the state manifest: a
        digest of identifiers, never of values. Equal digests mean the same
        captured state, whoever retrieved it.

    StateManifest:
      type: object
      description: >
        What the retrieval's database snapshot captured, independent of the
        caller: identifiers and names only, never plaintext or anything
        derived from it. Versions are immutable, so the listed versions also
        determine every reference and what it resolves to.
      required: [manifestVersion, projectId, environment, contract, items]
      properties:
        manifestVersion: { type: integer, enum: [1] }
        projectId: { type: string }
        environment:
          type: object
          required: [id, rootId, parentId, tier, expiresAt]
          properties:
            id: { type: string }
            rootId: { type: string }
            parentId: { type: [string, "null"] }
            tier: { type: string, enum: [development, staging, production] }
            expiresAt: { type: [string, "null"], format: date-time }
        contract:
          type: [object, "null"]
          required: [revisionId, contentHash, semanticsVersion]
          properties:
            revisionId: { type: string }
            contentHash: { type: string }
            semanticsVersion: { type: integer }
        items:
          type: array
          description: Every resolved item, sorted by name.
          items:
            type: object
            required: [name, source, valueRowId, versionId]
            properties:
              name: { type: string }
              source: { type: string, enum: [self, parent] }
              valueRowId: { type: string }
              versionId: { type: string }
              retiringVersionId:
                type: string
                description: Present only while the rotation window is open at the snapshot's time.

    CallerView:
      type: object
      description: >
        What this caller was not given, and which references stayed literal
        for it. A client cannot infer unexpanded references from values,
        because $${NAME} legitimately delivers a literal ${NAME}.
      required: [withheld, unexpanded]
      properties:
        withheld:
          type: array
          items:
            type: object
            required: [name, reason, requires]
            properties:
              name: { type: string }
              reason: { type: string, enum: [permission, requirement] }
              requires: { type: string, enum: [config.value.read, secret.reveal] }
        unexpanded:
          type: array
          items:
            type: object
            required: [name, references]
            properties:
              name: { type: string }
              references:
                type: array
                items: { type: string }
        contractWithheld:
          type: boolean
          description: Strict retrieval only. True when the Contract exists but the caller lacks contract.read.

    StateDigests:
      type: object
      description: >
        One digest per category of the state manifest, so a precondition
        mismatch can name the category that changed without naming any
        identifier.
      required: [environment, contract, items, rotation]
      properties:
        environment: { $ref: "#/components/schemas/StateDigest" }
        contract: { $ref: "#/components/schemas/StateDigest" }
        items: { $ref: "#/components/schemas/StateDigest" }
        rotation: { $ref: "#/components/schemas/StateDigest" }

    StrictRetrieval:
      type: object
      required: [mode, environmentId, manifest, stateDigest, stateDigests, contract, items, callerView, validation]
      properties:
        mode:
          type: string
          enum: [strict, preflight]
          description: >
            preflight returns no Secret values: Secrets are validated in-process
            only for an operator holding secret.reveal, and their verdicts are in
            validation.
        environmentId: { type: string }
        manifest: { $ref: "#/components/schemas/StateManifest" }
        stateDigest: { $ref: "#/components/schemas/StateDigest" }
        stateDigests: { $ref: "#/components/schemas/StateDigests" }
        contract:
          type: [object, "null"]
          description: >
            The snapshot's active Contract (canonical form), when one is
            active and the caller holds contract.read.
        items:
          type: array
          items:
            type: object
            required: [name, sensitive, source, versionId, value]
            properties:
              name: { type: string }
              sensitive: { type: boolean }
              source: { type: string, enum: [self, parent] }
              versionId: { type: string }
              value:
                type: [string, "null"]
                description: The delivered value, references expanded; null when withheld.
              rawValue:
                type: string
                description: The stored text, present only when expansion changed `value`.
              retiring:
                type: object
                description: A Secret's previous version while its rotation window is open, unexpanded.
                required: [versionId, value]
                properties:
                  versionId: { type: string }
                  value: { type: string }
              rotating: { type: boolean }
        callerView: { $ref: "#/components/schemas/CallerView" }
        validation: { $ref: "#/components/schemas/ValidationReport" }

    ValidationReport:
      type: object
      required: [environmentId, valid, complete, missing, invalid, notEvaluated, unresolved]
      properties:
        environmentId: { type: string }
        contractRevisionId: { type: [string, "null"] }
        valid:
          type: boolean
          description: >
            True only when every Contract item was evaluated (complete) and
            none is missing or invalid. A partial evaluation is never valid.
        complete:
          type: boolean
          description: >
            False when any item is in notEvaluated, or is unresolved because
            of this caller's access (reason authority).
        missing:
          type: array
          items: { type: string }
        invalid:
          type: array
          description: Evaluated items only; reasons never contain the value.
          items:
            type: object
            required: [name, reason]
            properties:
              name: { type: string }
              reason: { type: string }
        notEvaluated:
          type: array
          description: >
            Items this caller may not evaluate. The reason is derived from
            authorization only, never from the value.
          items:
            type: object
            required: [name, reason, requires]
            properties:
              name: { type: string }
              reason:
                type: string
                enum: [permission, requirement]
              requires:
                type: string
                enum: [config.metadata.read, config.value.read, secret.reveal]
        unresolved:
          type: array
          description: >
            Evaluated items whose delivered value would keep a reference
            literal, so no type verdict is given. authority: a Secret
            references non-sensitive values this caller may not read, and a
            caller who may read them gets it expanded. reference: anything
            else, such as a reference to an item with no value, a
            non-sensitive value referencing a Secret (never expanded), or a
            cycle. Absent on servers older than 0.11.0.
          items:
            type: object
            required: [name, reason]
            properties:
              name: { type: string }
              reason:
                type: string
                enum: [authority, reference]

    ContractRevision:
      type: object
      required: [id, projectId, contentHash, semanticsVersion, active, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        contentHash: { type: string }
        semanticsVersion:
          type: integer
          description: >
            The Contract Semantics version this revision is evaluated with.
            Fixed when the revision is created, and part of its content hash
            unless it is 1.
        active: { type: boolean }
        contract: { type: object }
        provenance: { type: object }
        createdAt: { type: string, format: date-time }

    Identity:
      type: object
      required: [id, name, kind, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [human, service, workload, ci, broker, agent]
        disabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastSeenAt:
          type: [string, "null"]
          format: date-time
          description: >
            Most recent successful authentication by any of the identity's
            credentials, throttled to ~60s granularity (ADR-0034 §5). An
            operational signal, not an audit record. Null when never seen.
        email:
          type: [string, "null"]
          description: Better Auth account email for human identities; null for machines.
        image:
          type: [string, "null"]
          description: Avatar image (data or https URL) for human identities; null for machines.
        orgRole:
          type: [string, "null"]
          enum: [admin, member, null]
          description: >
            In an Organization's identity listing, a live member's built-in
            role; null for machines and former members.
        removedAt:
          type: [string, "null"]
          format: date-time
          description: >
            In an Organization's identity listing, when a former member was
            removed or left (capability members.lifecycle); null otherwise.

    MemberReview:
      type: object
      description: >
        What a person created or changed in the Organization that may keep
        working without them (ADR-0052 Decision 4). Names, IDs and states
        only. Removal changes none of it. It ends this identity's authority,
        not a credential, token or platform account held outside Varlatch.
      required: [syncTargets, connections, webhooks, oidcBindings, credentials, personalEnvironments]
      properties:
        syncTargets:
          type: array
          items:
            type: object
            required: [id, projectId, environmentId, platform, state, changes]
            properties:
              id: { type: string }
              projectId: { type: string }
              environmentId: { type: string }
              platform: { type: string }
              state: { type: string, enum: [active, paused, disabled, revoked] }
              changes:
                type: array
                items: { type: string, enum: [created, repointed, destination_changed] }
        connections:
          type: array
          items:
            type: object
            required: [id, name, platform, credentialKind, revoked, changes]
            properties:
              id: { type: string }
              name: { type: string }
              platform: { type: string }
              credentialKind: { type: string, enum: [token, github-app] }
              revoked: { type: boolean }
              changes:
                type: array
                items: { type: string, enum: [created, credential_replaced] }
        webhooks:
          type: array
          description: Each signing secret was shown to its creator once.
          items:
            type: object
            required: [id, host, revoked]
            properties:
              id: { type: string }
              host: { type: string, description: The URL's host only }
              revoked: { type: boolean }
        oidcBindings:
          type: array
          items:
            type: object
            required: [id, identityId, identityName, issuer, revoked]
            properties:
              id: { type: string }
              identityId: { type: string }
              identityName: { type: string }
              issuer: { type: string }
              revoked: { type: boolean }
        credentials:
          type: array
          description: Credentials of this Organization's machine identities whose token was shown to the person at issuance.
          items:
            type: object
            required: [id, name, identityId, identityName, state]
            properties:
              id: { type: string }
              name: { type: [string, "null"] }
              identityId: { type: string }
              identityName: { type: string }
              state: { type: string, enum: [valid, expired, exhausted, revoked, retired] }
        personalEnvironments:
          type: array
          items:
            type: object
            required: [id, name, projectId]
            properties:
              id: { type: string }
              name: { type: string }
              projectId: { type: string }

    ExposureConfirmation:
      type: object
      required: [versionId, confirmedAt, actorIdentityId]
      properties:
        versionId: { type: string }
        confirmedAt: { type: string, format: date-time }
        actorIdentityId: { type: string }

    ExposureReport:
      type: object
      required: [member, coverage, received, authorityAtRemoval, indirect]
      properties:
        member:
          type: object
          required: [identityId, name, role, removedAt]
          properties:
            identityId: { type: string }
            name: { type: string }
            role: { type: [string, "null"], enum: [admin, member, null] }
            removedAt: { type: [string, "null"], format: date-time }
        coverage:
          type: object
          required: [complete]
          description: >
            complete is false while audit events recorded before this
            release are still being indexed; from and to bound that period.
          properties:
            complete: { type: boolean }
            from: { type: [string, "null"], format: date-time }
            to: { type: [string, "null"], format: date-time }
        received:
          type: array
          items:
            type: object
            required: [itemName, versionId, owningEnvironmentId, projectId, state, servedAs, retiringUntil, notServedBecause, served, confirmation, rotationHint, receipts]
            properties:
              itemName: { type: string }
              versionId: { type: string }
              owningEnvironmentId:
                type: [string, "null"]
                description: The environment whose value owns the version, which may be a parent of where it was received.
              projectId: { type: [string, "null"] }
              state: { type: string, enum: [served, not-served, revocation-confirmed] }
              servedAs: { type: [string, "null"], enum: [current, retiring, null] }
              retiringUntil: { type: [string, "null"], format: date-time }
              notServedBecause: { type: [string, "null"], enum: [replaced, value-deleted, environment-deleted, unknown, null] }
              served: { type: boolean, description: Whether Varlatch still serves it, whatever was confirmed }
              confirmation:
                type: [object, "null"]
                required: [confirmedAt, actorIdentityId]
                properties:
                  confirmedAt: { type: string, format: date-time }
                  actorIdentityId: { type: string }
              rotationHint: { type: [string, "null"] }
              receipts:
                type: array
                items:
                  type: object
                  required: [environmentId, way, firstAt, lastAt]
                  properties:
                    environmentId: { type: string }
                    way: { type: string, enum: [revealed, delivered, export, written] }
                    firstAt: { type: string, format: date-time }
                    lastAt: { type: string, format: date-time }
        authorityAtRemoval:
          type: [object, "null"]
          required: [removalId, removedAt, role, left, environments, requirements]
          properties:
            removalId: { type: string }
            removedAt: { type: string, format: date-time }
            role: { type: string, enum: [admin, member] }
            left: { type: boolean }
            environments:
              type: array
              items:
                type: object
                required: [environmentId, actions, conditionalOn]
                properties:
                  environmentId: { type: string }
                  actions:
                    type: array
                    items:
                      type: object
                      required: [action, sources]
                      properties:
                        action: { type: string }
                        sources:
                          type: array
                          items:
                            type: object
                            required: [source, role, grantId, viaGroupId, roleId]
                            properties:
                              source: { type: string }
                              role: { type: [string, "null"] }
                              grantId: { type: [string, "null"] }
                              viaGroupId: { type: [string, "null"] }
                              roleId: { type: [string, "null"] }
                  conditionalOn:
                    type: array
                    items: { type: string }
                    description: Requirements reading values here was conditional on; empty means unconditional.
            requirements:
              type: array
              items:
                type: object
                required: [requirementId, requirementVersion, target, selector]
                properties:
                  requirementId: { type: string }
                  requirementVersion: { type: [integer, "null"] }
                  target: {}
                  selector: {}
        indirect: { $ref: "#/components/schemas/MemberReview" }

    OrganizationDeletion:
      type: object
      required: [id, requestedBy, scheduledAt, runAfter, approvalRequired, approvedBy, approvedAt, cancelledAt, completedAt]
      properties:
        id: { type: string }
        requestedBy: { type: string }
        scheduledAt: { type: string, format: date-time }
        runAfter: { type: string, format: date-time, description: The earliest time the deletion may run }
        approvalRequired: { type: boolean }
        approvedBy: { type: [string, "null"] }
        approvedAt: { type: [string, "null"], format: date-time }
        cancelledAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }

    IncidentFreeze:
      type: object
      required: [id, frozenAt, frozenBy, reason, liftedAt, liftedBy, liftMethod]
      description: An incident freeze of the Organization (ADR-0055).
      properties:
        id: { type: string }
        frozenAt: { type: string, format: date-time }
        frozenBy:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: [string, "null"] }
        reason: { type: string, description: Shown to members; never recorded in audit. }
        liftedAt: { type: [string, "null"], format: date-time }
        liftedBy:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: [string, "null"] }
            - type: "null"
        liftMethod:
          type: [string, "null"]
          enum: [approval, operator, null]

    ResumingTarget:
      type: object
      required: [id, projectSlug, environmentName, platform, destination]
      description: A Sync Target that resumes pushing when the freeze is lifted.
      properties:
        id: { type: string }
        projectSlug: { type: string }
        environmentName: { type: string }
        platform: { type: string }
        destination: { type: string }

    MemberRemoval:
      type: object
      required: [removalId, identityId, role, left, removedAt, grantsRevoked, groupsLeft, invitationsRevoked, review]
      properties:
        removalId: { type: string }
        identityId: { type: string }
        role: { type: string, enum: [admin, member], description: Their role when removed }
        left: { type: boolean, description: True when the person removed themselves }
        removedAt: { type: string, format: date-time }
        grantsRevoked: { type: integer }
        groupsLeft: { type: integer, description: Groups and teams }
        invitationsRevoked: { type: integer }
        review: { $ref: "#/components/schemas/MemberReview" }

    Profile:
      type: object
      required: [identityId, name, email, image]
      properties:
        identityId: { type: string }
        name: { type: string }
        email: { type: [string, "null"] }
        image: { type: [string, "null"] }

    ReachAction:
      type: object
      required: [action, grants, conditions]
      properties:
        action: { $ref: "#/components/schemas/Action" }
        grants:
          type: array
          description: The Grants that allow it, and the Group or Role each came through.
          items:
            type: object
            required: [grantId, viaGroupId, roleId]
            properties:
              grantId: { type: string }
              viaGroupId: { type: [string, "null"] }
              roleId: { type: [string, "null"] }
        conditions:
          type: array
          description: >
            IDs of the Requirements (in MachineReach.requirements) that would
            constrain this action; empty means none. Only value reads
            (config.value.read, secret.reveal, secret.use) are constrained.
          items: { type: string }

    MachineReach:
      type: object
      required: [identity, organizationActions, projects, requirements, notes]
      properties:
        identity:
          type: object
          required: [id, name, kind, state, disabledReason, liveCredentials]
          properties:
            id: { type: string }
            name: { type: string }
            kind: { type: string, enum: [service, workload, ci, broker, agent] }
            state:
              type: string
              enum: [live, disabled, retired]
              description: >
                retired: retired by an operator, every credential revoked;
                disabled: suspended for another reason (disabledReason).
                Neither can sign in, whatever its Grants allow.
            disabledReason: { type: [string, "null"], enum: [organization-deletion, null] }
            liveCredentials:
              type: integer
              description: Credentials that are unrevoked, unexpired and not used up.
        organizationActions:
          type: array
          description: Actions allowed for the Organization as a whole.
          items: { $ref: "#/components/schemas/ReachAction" }
        projects:
          type: array
          description: Projects where something is allowed; others are left out.
          items:
            type: object
            required: [id, slug, name, actions, environments]
            properties:
              id: { type: string }
              slug: { type: string }
              name: { type: string }
              actions: { type: array, items: { $ref: "#/components/schemas/ReachAction" } }
              environments:
                type: array
                description: Live Environments where something is allowed; others are left out.
                items:
                  type: object
                  required: [id, name, tier, kind, parentEnvironmentId, actions]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    tier: { $ref: "#/components/schemas/Tier" }
                    kind: { $ref: "#/components/schemas/EnvironmentKind" }
                    parentEnvironmentId: { type: [string, "null"] }
                    actions: { type: array, items: { $ref: "#/components/schemas/ReachAction" } }
        requirements:
          type: array
          description: The Requirements named in conditions, as they are defined now.
          items:
            type: object
            required: [id, version, target, selector, condition]
            properties:
              id: { type: string }
              version: { type: [integer, "null"] }
              target: { $ref: "#/components/schemas/RequirementTarget" }
              selector: { $ref: "#/components/schemas/TailnetSelector" }
              condition:
                type: string
                description: >
                  The condition in words, such as
                  "needs tailnet example.ts.net: tag:prod".
        notes:
          type: array
          description: >
            What else to know about this reach, in words (a retired
            identity, a Broker's Capabilities).
          items: { type: string }

    WhoAmI:
      type: object
      required: [identity, organization, credential, listener]
      description: >
        The caller as this request authenticated it (GET /v1/me). Never
        contains token material, another identity, or another credential.
      properties:
        identity:
          type: object
          required: [id, name, kind, email]
          properties:
            id: { type: string }
            name: { type: string }
            kind:
              type: string
              enum: [human, service, workload, ci, broker, agent]
            email:
              type: [string, "null"]
              description: >
                The Better Auth account email of a human identity, as in its
                profile; null for machines and for humans without one. The
                profile's avatar image is left to GET /v1/me/profile.
        organization:
          description: >
            The organization a machine identity belongs to. Null for humans,
            who belong to the Installation and join organizations as
            members: GET /v1/organizations lists those.
          oneOf:
            - $ref: "#/components/schemas/Organization"
            - type: "null"
        credential:
          type: object
          required: [id, name, kind, expiresAt]
          description: >
            The credential this request presented, and only that one; its
            token is never returned.
          properties:
            id: { type: string }
            name: { type: [string, "null"] }
            kind:
              type: string
              description: service, cli, browser (a dashboard session), agent-run, or oidc.
            expiresAt: { type: [string, "null"], format: date-time }
        listener:
          type: string
          enum: [ordinary, tailnet]
          description: The listener this request came in on (ADR-0014 §7).
        tailnet:
          $ref: "#/components/schemas/TailnetDevice"
          description: >
            Only on the tailnet listeners: the device this request's own
            connection resolved to through Tailscale WhoIs, or why there is
            none, as GET /v1/tailnet/context reports it (nodeName included
            when Tailscale gives one). No Requirement is evaluated: a
            recognized device is no promise that a constrained read will be
            allowed.

    CreatedIdentity:
      allOf:
        - $ref: "#/components/schemas/Identity"
        - type: object
          properties:
            credential:
              type: [string, "null"]
              description: Shown exactly once at creation; stored hashed; never retrievable.
            credentialExpiresAt:
              type: [string, "null"]
              format: date-time
              description: >
                Expiry of the issued credential: from credentialTtlSeconds,
                or from the Organization's default lifetime while it
                enforces credential-lifetime; null for no expiry.

    InvitationStatus:
      type: string
      enum: [pending, consumed, expired, revoked]
      description: >
        pending: can still be accepted. consumed: accepted, the invitee
        enrolled. expired: not accepted before expiresAt. revoked: revoked
        while pending. Every state but pending is final.

    Invitation:
      type: object
      required: [id, name, orgRole, status, createdAt, expiresAt, createdByIdentityId, consumedAt, revokedAt]
      description: >
        An organization invitation (capability invitations.manage). Never
        contains the invitation's token or anything derived from it: the
        token is returned once, at creation, and stored only hashed.
      properties:
        id: { type: string }
        name:
          type: string
          description: The invitee's display name, as given at creation.
        orgRole:
          type: string
          enum: [admin, member]
          description: The Organization Role the invitee receives on enrolling.
        status: { $ref: "#/components/schemas/InvitationStatus" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        createdByIdentityId:
          type: [string, "null"]
          description: The identity that created it; null for invitations created before 0.14.0.
        consumedAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }

    Capability:
      type: object
      required:
        [id, brokerIdentityId, agentIdentityId, environmentId, items, destinations, runId, expiresAt, revokedAt, createdAt]
      properties:
        id: { type: string }
        brokerIdentityId: { type: string }
        agentIdentityId: { type: string }
        environmentId: { type: string }
        items:
          type: array
          items: { type: string }
        destinations:
          type: array
          items: { type: string }
        runId: { type: [string, "null"] }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    CredentialMetadata:
      type: object
      required: [id, kind, name, createdAt, expiresAt, revokedAt, lastUsedAt]
      description: >
        Credential metadata (ADR-0034 §2). Never includes token material —
        tokens are stored hashed and unrecoverable (ADR-0007).
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [service, cli, browser, agent-run, oidc]
        name: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
        lastUsedAt:
          type: [string, "null"]
          format: date-time
          description: >
            Last successful authentication, throttled to ~60s granularity.
            An operational signal, never evidence of what was accessed.
        client:
          type: [string, "null"]
          maxLength: 64
          description: >
            A short, readable summary of the client that requested a browser
            session or CLI login credential, such as "Firefox on Linux" or
            "varlatch CLI 0.14.0 on Linux". Only this summary is stored,
            never the User-Agent itself. Null when the client was not
            recognized, for every other kind, and for credentials issued
            before 0.14.0; absent from older servers.
    CredentialReviewReason:
      type: string
      enum: [never-used, idle, no-expiry]
      description: >
        never-used: no successful authentication yet. idle: last used more
        than idleDays days ago. no-expiry: it never expires.
    CredentialReview:
      type: object
      required: [generatedAt, idleDays, summary, items, expiry]
      description: >
        Credential review (ADR-0054 Decision 8). Items are ordered by
        identity name, then creation.
      properties:
        generatedAt: { type: string, format: date-time }
        idleDays:
          type: integer
          description: Days without use after which a used credential is idle (30).
        summary:
          type: object
          required: [reviewed, listed, neverUsed, idle, noExpiry]
          description: >
            reviewed counts every machine credential checked, listed those
            with at least one reason; a credential can count under several
            reasons.
          properties:
            reviewed: { type: integer }
            listed: { type: integer }
            neverUsed: { type: integer }
            idle: { type: integer }
            noExpiry: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/ReviewedCredential" }
        expiry: { $ref: "#/components/schemas/CredentialExpiryReview" }
    CredentialExpiryReview:
      type: object
      required: [warningDays, summary, items]
      description: >
        Expiry warnings (ADR-0054 Decision 8), by the rule of the
        Varlatch-Credential-Expires header: service credentials of the
        Organization's machine identities, not revoked, that expire within
        warningDays (7) days or have expired. Nothing renews them but a
        person. OIDC-exchanged and agent-run credentials renew by design and
        are left out. Soonest expiry first. Absent from servers before
        0.21.0.
      properties:
        warningDays: { type: integer }
        summary:
          type: object
          required: [soon, expired]
          properties:
            soon: { type: integer }
            expired: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/ExpiringCredential" }
    ExpiringCredential:
      type: object
      required: [id, name, kind, createdAt, expiresAt, lastUsedAt, issuedBy, identity, state]
      description: A credential as in ReviewedCredential, with state instead of reasons.
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        kind: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        issuedBy:
          oneOf:
            - type: "null"
            - type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
        identity:
          type: object
          required: [id, name, kind, state, disabledReason]
          properties:
            id: { type: string }
            name: { type: string }
            kind:
              type: string
              enum: [service, workload, ci, broker, agent]
            state:
              type: string
              enum: [live, disabled, retired]
            disabledReason:
              type: [string, "null"]
              enum: [organization-deletion, null]
        state:
          type: string
          enum: [soon, expired]
          description: soon expires within warningDays days; expired is past its expiry.
    ReviewedCredential:
      type: object
      required: [id, name, kind, createdAt, expiresAt, lastUsedAt, issuedBy, identity, reasons]
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        kind:
          type: string
          description: The credential kind; every long-lived machine credential is service today.
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        lastUsedAt:
          type: [string, "null"]
          format: date-time
          description: >
            Last successful authentication, about a minute granular; null
            when never used.
        issuedBy:
          description: Who was shown the token at issuance; null when unknown.
          oneOf:
            - type: "null"
            - type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
        identity:
          type: object
          required: [id, name, kind, state, disabledReason]
          properties:
            id: { type: string }
            name: { type: string }
            kind:
              type: string
              enum: [service, workload, ci, broker, agent]
            state:
              type: string
              enum: [live, disabled, retired]
              description: >
                live: can authenticate. disabled: suspended while the
                Organization is being deleted (disabledReason); its
                credentials work again if the deletion is cancelled.
                retired: disabled by an operator; a credential still listed
                here was not revoked and would work again on reactivation.
            disabledReason:
              type: [string, "null"]
              enum: [organization-deletion, null]
        reasons:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CredentialReviewReason" }
    IssuedAgentCredential:
      type: object
      required: [id, token, expiresAt]
      properties:
        id: { type: string }
        token:
          type: string
          description: Returned exactly once; never retrievable again.
        expiresAt: { type: string, format: date-time }

    MachineCredentialRequest:
      type: object
      description: >
        Another service credential for a machine identity (capability
        identity.credentials.issue), with the limits identity creation takes.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Shown in the credential listing, such as the program that uses it.
        ttlSeconds:
          type: integer
          minimum: 1
          maximum: 315360000
          description: >
            Optional wall-clock lifetime. Absent means no expiry (revocation
            only), or the Organization's default lifetime while it enforces
            credential-lifetime; above its maximum the request is refused
            with CREDENTIAL_LIFETIME_EXCEEDED.
        maxUses:
          type: integer
          minimum: 1
          maximum: 1000000
          description: >
            Optional use budget; each authenticated request consumes one use.
            1 yields a one-shot token. Absent means unlimited.

    IssuedMachineCredential:
      type: object
      required: [id, kind, name, token, expiresAt, maxUses]
      properties:
        id: { type: string }
        kind: { type: string, enum: [service] }
        name: { type: string }
        token:
          type: string
          description: Returned exactly once; stored hashed; never retrievable again.
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: >
            Null when no ttlSeconds was given and the Organization does not
            enforce credential-lifetime.
        maxUses:
          type: [integer, "null"]
          description: Null when no use budget was given.

    IssuedCapability:
      type: object
      required:
        [id, secret, agentIdentityId, environmentId, items, destinations, targets, runId, expiresAt, preflight]
      properties:
        id: { type: string }
        secret:
          type: string
          description: Returned exactly once; stored hashed; required to exercise.
        agentIdentityId: { type: string }
        environmentId: { type: string }
        items:
          type: array
          items: { type: string }
        destinations:
          type: array
          items: { type: string }
        targets:
          type: object
          description: The substitution targets as recorded, canonical and sorted; the only ones the Broker may enforce.
          additionalProperties:
            type: array
            items: { type: string }
        runId: { type: [string, "null"] }
        expiresAt: { type: string, format: date-time }
        preflight:
          type: string
          enum: [ok, agent-lacks-secret-use]
          description: Advisory current-authority check; exercise re-evaluates regardless.
        preflightItems:
          type: array
          description: >
            Present when the request carried a precondition that matched. Per
            item: whether it is a stored Secret, and whether the Agent holds
            secret.use here with the Requirements evaluable at issuance. It
            makes no claim that exercise can resolve the item's references for
            the Agent: every exercise evaluates authorization again and
            resolves every reference or denies.
          items:
            type: object
            required: [name, present, authorized]
            properties:
              name: { type: string }
              present: { type: boolean }
              authorized: { type: boolean }
              reason: { type: string, enum: [permission, requirement] }

    CapabilityExercise:
      type: object
      required: [items, withheld, targets]
      properties:
        items:
          type: array
          items:
            type: object
            required: [name, versionId, value]
            properties:
              name: { type: string }
              versionId: { type: string }
              value: { type: string }
              retiring:
                description: >
                  The previous value during a dual-phase rotation (ADR-0027),
                  injected as-is so the consumer accepts either during the
                  window. Absent when the item is stable.
                type: object
                required: [versionId, value]
                properties:
                  versionId: { type: string }
                  value: { type: string }
        withheld:
          type: array
          items: { type: string }
        targets:
          type: object
          description: The Capability's targets as recorded; the Broker refuses to substitute if they differ from its own.
          additionalProperties:
            type: array
            items: { type: string }

    Action:
      type: string
      enum:
        - organization.read
        - organization.manage
        - project.read
        - project.manage
        - environment.read
        - environment.manage
        - config.metadata.read
        - config.value.read
        - config.value.write
        - secret.reveal
        - secret.use
        - contract.read
        - contract.submit
        - contract.activate
        - identity.read
        - identity.manage
        - policy.read
        - policy.manage
        - audit.read
        - config.sync.manage

    GrantScope:
      oneOf:
        - type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [organization] }
        - type: object
          required: [kind, projectId]
          properties:
            kind: { type: string, enum: [project] }
            projectId: { type: string }
        - type: object
          required: [kind, projectId, selector]
          properties:
            kind: { type: string, enum: [environments] }
            projectId: { type: string }
            selector:
              oneOf:
                - type: object
                  required: [kind, environmentIds]
                  properties:
                    kind: { type: string, enum: [environments] }
                    environmentIds:
                      type: array
                      minItems: 1
                      items: { type: string }
                - type: object
                  required: [kind, tier]
                  properties:
                    kind: { type: string, enum: [tier] }
                    tier: { $ref: "#/components/schemas/Tier" }
        - type: object
          required: [kind, teamId]
          description: All Projects the Team owns (ADR-0028).
          properties:
            kind: { type: string, enum: [team] }
            teamId: { type: string }

    Grant:
      type: object
      required: [id, organizationId, scope, createdAt]
      properties:
        id: { type: string }
        organizationId: { type: string }
        subjectIdentityId: { type: [string, "null"] }
        subjectGroupId: { type: [string, "null"] }
        scope: { $ref: "#/components/schemas/GrantScope" }
        actions:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/Action" }
        roleId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    EntityVersion:
      type: integer
      minimum: 1
      description: >
        Monotonic version of an editable entity's configuration (ADR-0029);
        starts at 1. Join mutations (membership, project ownership) and
        delivery progress never increment it. Supplied back as
        expectedVersion on PATCH; a stale value fails with VERSION_CONFLICT.

    Role:
      type: object
      required: [id, name, actions, version, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        actions:
          type: array
          items: { $ref: "#/components/schemas/Action" }
        version: { $ref: "#/components/schemas/EntityVersion" }
        updatedAt: { type: [string, "null"], format: date-time }

    Group:
      type: object
      required: [id, name, kind, version, updatedAt]
      description: An identity set (kind=group) or a project-owning Team (kind=team).
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [group, team] }
        version: { $ref: "#/components/schemas/EntityVersion" }
        updatedAt: { type: [string, "null"], format: date-time }

    GrantReplacement:
      type: object
      required: [replacedGrantId, grant]
      description: >
        Result of an atomic Grant replacement (ADR-0029): the revoked
        original's ID and the successor Grant, linked in the audit trail.
      properties:
        replacedGrantId: { type: string }
        grant: { $ref: "#/components/schemas/Grant" }

    RequirementTarget:
      oneOf:
        - type: object
          required: [kind, tier]
          properties:
            kind: { type: string, enum: [tier] }
            tier: { $ref: "#/components/schemas/Tier" }
        - type: object
          required: [kind, environmentIds]
          properties:
            kind: { type: string, enum: [environments] }
            environmentIds:
              type: array
              minItems: 1
              items: { type: string }

    TailnetSelector:
      type: object
      required: [tailnet]
      description: >
        Varlatch-owned predicate over trusted Tailnet Context; must name at
        least one tag, user, or node.
      properties:
        tailnet: { type: string, minLength: 1 }
        tags:
          type: array
          items: { type: string }
        users:
          type: array
          items: { type: string }
        nodes:
          type: array
          items: { type: string }

    Requirement:
      type: object
      required: [id, kind, target, selector, version, updatedAt]
      description: >
        A restrictive authorization object evaluated after Grants; may only
        reduce the set of successful operations, never create permission.
      properties:
        id: { type: string }
        kind: { type: string, enum: [tailnet] }
        target: { $ref: "#/components/schemas/RequirementTarget" }
        selector: { $ref: "#/components/schemas/TailnetSelector" }
        createdAt: { type: string, format: date-time }
        version: { $ref: "#/components/schemas/EntityVersion" }
        updatedAt: { type: [string, "null"], format: date-time }

    ConfigItemSearchResult:
      type: object
      required: [project, name, sensitive, environments]
      description: >
        One (project, item name) search hit (ADR-0030). Metadata only —
        never Values, version history, or value-derived fields. The
        environments list contains only authorized, navigable Environments
        in which the name is effectively present; it is bounded and its
        truncation flag never reveals hidden-candidate counts.
      properties:
        project:
          type: object
          required: [id, slug, name]
          properties:
            id: { type: string }
            slug: { $ref: "#/components/schemas/Slug" }
            name: { type: string }
        name: { type: string }
        sensitive:
          type: boolean
          description: >
            From the active Contract's effective metadata; items absent from
            the Contract default to sensitive.
        environments:
          type: array
          maxItems: 50
          items:
            type: object
            required: [id, name, tier]
            properties:
              id: { type: string }
              name: { $ref: "#/components/schemas/EnvironmentName" }
              tier: { $ref: "#/components/schemas/Tier" }
        environmentsTruncated:
          type: boolean
          description: True when authorized matches beyond maxItems were omitted.

    OwnCredential:
      type: object
      required: [id, kind, name, createdAt, expiresAt, revokedAt, maxUses, useCount, current]
      description: One of the caller's own credentials; never contains the token itself.
      properties:
        id: { type: string }
        kind: { type: string }
        name: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
        maxUses: { type: [integer, "null"] }
        useCount: { type: integer }
        current:
          type: boolean
          description: True for the credential authenticating this request.
        client:
          type: [string, "null"]
          maxLength: 64
          description: >
            A short, readable summary of the client that requested a browser
            session or CLI login credential, such as "Firefox on Linux" or
            "varlatch CLI 0.14.0 on Linux". Only this summary is stored,
            never the User-Agent itself. Null when the client was not
            recognized, for every other kind, and for credentials issued
            before 0.14.0; absent from older servers.

    OwnPasskey:
      type: object
      required: [id, name, deviceType, backedUp, createdAt, trust, trustedVia, trustedAt, setupGrantKind, confirmedByPasskeyId]
      description: >
        One of the caller's passkeys and its provenance (ADR-0054 Decision 4).
        Only a trusted passkey will be able to approve operations once
        Security Controls exist; sign-in works with any passkey.
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        deviceType:
          type: string
          description: WebAuthn device type, singleDevice or multiDevice.
        backedUp:
          type: boolean
          description: Synced by a password manager or platform.
        createdAt: { type: [string, "null"], format: date-time }
        trust: { type: string, enum: [trusted, unconfirmed] }
        trustedVia:
          type: [string, "null"]
          enum: [existing-at-upgrade, setup-grant, confirmed, null]
          description: How it became trusted; null while unconfirmed.
        trustedAt: { type: [string, "null"], format: date-time }
        setupGrantKind:
          type: [string, "null"]
          enum: [bootstrap, recover, invite, reenroll, null]
          description: For setup-grant, which grant enrolled it.
        confirmedByPasskeyId:
          type: [string, "null"]
          description: For confirmed, the trusted passkey that confirmed it (it may have been removed since).

    PasskeyConfirmationOptions:
      type: object
      required: [publicKey]
      properties:
        publicKey:
          type: object
          additionalProperties: true
          description: >
            WebAuthn request options (PublicKeyCredentialRequestOptionsJSON),
            userVerification required, allowing only the caller's trusted passkeys.

    OrganizationPermissions:
      type: object
      required: [organizationId, role, actions]
      properties:
        organizationId: { type: string }
        role:
          type: [string, "null"]
          enum: [admin, member, null]
          description: The caller's role; null for a machine identity.
        actions:
          type: array
          description: The organization-scoped actions the caller is allowed here.
          items:
            type: string
            enum: [organization.read, organization.manage, project.read, project.manage, identity.read, identity.manage, policy.read, policy.manage, audit.read]

    ApprovalKey:
      type: object
      required: [name, trust, trustedVia, createdAt, trustedAt]
      description: One passkey of an admin, as metadata only.
      properties:
        name: { type: [string, "null"] }
        trust: { type: string, enum: [trusted, unconfirmed] }
        trustedVia:
          type: [string, "null"]
          enum: [existing-at-upgrade, setup-grant, confirmed, null]
          description: How it became trusted; null while unconfirmed.
        createdAt: { type: [string, "null"], format: date-time }
        trustedAt: { type: [string, "null"], format: date-time }

    AdminApprovalKeys:
      type: object
      required: [identity, trusted, unconfirmed, lastConfirmedAt, passkeys]
      properties:
        identity:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        trusted: { type: integer, minimum: 0 }
        unconfirmed: { type: integer, minimum: 0 }
        lastConfirmedAt:
          type: [string, "null"]
          format: date-time
          description: When one of their passkeys was last confirmed with a trusted one; null when none ever was.
        passkeys:
          type: array
          description: Trusted first, then unconfirmed; oldest first within each.
          items: { $ref: "#/components/schemas/ApprovalKey" }

    ApprovalKeys:
      type: object
      required: [generatedAt, summary, items]
      properties:
        generatedAt: { type: string, format: date-time }
        summary:
          type: object
          required: [admins, withTrustedKey, withoutTrustedKey]
          properties:
            admins: { type: integer }
            withTrustedKey: { type: integer }
            withoutTrustedKey:
              type: integer
              description: Admins who cannot approve anything until they have a trusted passkey.
        items:
          type: array
          description: The live admins, by name.
          items: { $ref: "#/components/schemas/AdminApprovalKeys" }

    OutboundRefusalReason:
      type: string
      enum: [private_address, host_only_address, never_address, mixed_answers, scheme, port]
      description: >
        Why the outbound policy refuses a destination (ADR-0057): a private
        network address; a loopback, link-local or metadata address; an
        unspecified, multicast or reserved address; a name with several
        addresses of which one is refused; plain http without an allow list
        entry; or an allowed destination on another port.

    OutboundDestinationKind:
      type: string
      enum: [webhook, coolify, convex, oidc-issuer]

    RefusedDestination:
      type: object
      required: [kind, id, name, scheme, host, port, reason, since]
      properties:
        kind: { $ref: "#/components/schemas/OutboundDestinationKind" }
        id:
          type: string
          description: The webhook's, Connection's or OIDC binding's id.
        name:
          type: [string, "null"]
          description: The Connection's name; null for a webhook or an OIDC issuer.
        scheme: { type: string, enum: [https, http] }
        host:
          type: string
          description: The configured host name or literal address; never a resolved address.
        port: { type: integer }
        reason: { $ref: "#/components/schemas/OutboundRefusalReason" }
        since:
          type: [string, "null"]
          format: date-time
          description: >
            The earliest refusal of this destination recorded in the audit
            log (outbound.refused) within the last `sinceDays` days; not
            necessarily the start of one continuous refusal. Null when none
            is recorded there, for example a Connection no Target has used yet.

    RefusedDestinations:
      type: object
      required: [generatedAt, sinceDays, checked, unresolved, items]
      properties:
        generatedAt:
          type: string
          format: date-time
          description: When the check ran. A check is reused for up to 30 seconds.
        checked:
          type: integer
          description: How many destinations the Organization configured and the check looked at.
        unresolved:
          type: integer
          description: >
            How many of them could not be checked because their names did
            not resolve. They are not refusals; the policy decides when they
            connect. Zero refused with some unresolved is not "all allowed".
        sinceDays:
          type: integer
          description: How far back `since` looks in the audit log.
        items:
          type: array
          items: { $ref: "#/components/schemas/RefusedDestination" }

    InstallationRefusedDestination:
      type: object
      required: [organization, kind, id, name, scheme, host, port, reason]
      properties:
        organization:
          type: object
          required: [id, slug, name]
          properties:
            id: { type: string }
            slug: { type: string }
            name: { type: string }
        kind: { $ref: "#/components/schemas/OutboundDestinationKind" }
        id: { type: string }
        name: { type: [string, "null"] }
        scheme: { type: string, enum: [https, http] }
        host: { type: string }
        port: { type: integer }
        reason: { $ref: "#/components/schemas/OutboundRefusalReason" }
        notSuggested:
          type: [string, "null"]
          description: >
            Why the suggested allow list value leaves it out (a literal
            address, or a name that resolves to a loopback, link-local,
            metadata or reserved address); null when the suggestion covers it.

    InstallationOutbound:
      type: object
      required: [generatedAt, allow, warnings, checked, refused, suggested, unresolved]
      properties:
        generatedAt:
          type: string
          format: date-time
          description: When the check ran. A check is reused for up to 30 seconds.
        checked:
          type: integer
          description: How many configured destinations the check looked at, in every Organization.
        allow:
          type: array
          description: VARLATCH_OUTBOUND_ALLOW as parsed at startup, one entry each; empty when it is not set.
          items: { type: string }
        warnings:
          type: array
          description: Entries that add nothing or open host-only ranges, as `varlatchd admin doctor` words them.
          items: { type: string }
        refused:
          type: array
          description: Every refused destination, by Organization.
          items: { $ref: "#/components/schemas/InstallationRefusedDestination" }
        suggested:
          type: [string, "null"]
          description: The VARLATCH_OUTBOUND_ALLOW value that would allow the refused names (the current entries plus new ones); null when none would help.
        unresolved:
          type: integer
          description: Destinations whose names did not resolve; not refusals, checked again when they connect.

    SecurityControlName:
      type: string
      enum: [requirement-protection, admin-step-up, passkey-verification, credential-lifetime]

    SecurityControlMode:
      type: string
      enum: ["off", report, enforce]
      description: >
        off has no effect (the default). report refuses and changes nothing.
        enforce applies the control; this server does not accept it yet.

    CredentialLifetimeConfig:
      type: object
      required: [defaultTtlSeconds, maxTtlSeconds]
      additionalProperties: false
      description: credential-lifetime's configuration; 0 < defaultTtlSeconds <= maxTtlSeconds.
      properties:
        defaultTtlSeconds: { type: integer, minimum: 1, maximum: 315360000 }
        maxTtlSeconds: { type: integer, minimum: 1, maximum: 315360000 }

    SecurityControl:
      type: object
      required: [control, mode, config, version, changedAt, changedBy]
      properties:
        control: { $ref: "#/components/schemas/SecurityControlName" }
        mode: { $ref: "#/components/schemas/SecurityControlMode" }
        config:
          description: credential-lifetime's lifetimes; null for the other controls and when not set.
          oneOf:
            - $ref: "#/components/schemas/CredentialLifetimeConfig"
            - type: "null"
        version:
          type: integer
          description: 0 for a control nobody has changed; each change adds one.
        changedAt: { type: [string, "null"], format: date-time }
        changedBy:
          description: Who changed it last; the host operator's reset has no person.
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: [string, "null"] }
            - type: "null"
        availableModes:
          type: array
          description: >
            In a list of the controls: the modes this server accepts for this
            control, enforce included only where this release can enforce
            it. Absent from older servers, which accept off and report for
            every control, and from a change's result.
          items: { $ref: "#/components/schemas/SecurityControlMode" }

    SecurityControlList:
      type: object
      required: [items, availableModes]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SecurityControl" }
        availableModes:
          type: array
          description: The modes this server accepts for every control; each item's availableModes may add enforce.
          items: { $ref: "#/components/schemas/SecurityControlMode" }

    SecurityReportReason:
      type: string
      enum: [no-approval, machine-credential, no-evidence, not-user-verified, untrusted-passkey, would-default, would-refuse]
      description: >
        Why the control would have acted. admin-step-up and
        requirement-protection: no-approval (a person, without an approval)
        or machine-credential (a machine credential, which can never pass
        one). passkey-verification: no-evidence (a sign-in recorded no
        evidence, such as one from before the upgrade), not-user-verified
        (the passkey did not verify the person), untrusted-passkey (the
        passkey that signed in is not trusted). credential-lifetime:
        would-default (no TTL given: it would get the default) or
        would-refuse (a TTL above the maximum).

    SecurityReportEntry:
      type: object
      required: [configVersion, operation, reason, actor, count, firstSeen, lastSeen]
      properties:
        configVersion:
          type: integer
          description: The control's version when the attempts were decided.
        operation:
          type: string
          description: >
            The semantic operation, such as grant.create, requirement.revoke or
            credential.issue; for passkey-verification the first action the
            request was authorized for (secret.reveal, project.read, ...),
            organization.access, or convex.token.
        reason: { $ref: "#/components/schemas/SecurityReportReason" }
        actor:
          type: object
          required: [id, name, kind]
          properties:
            id: { type: string }
            name: { type: [string, "null"] }
            kind: { type: [string, "null"] }
        count: { type: integer, minimum: 1 }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }

    SecurityControlCounts:
      type: object
      required: [control, mode, version, total, currentHour, pending, entries]
      properties:
        control: { $ref: "#/components/schemas/SecurityControlName" }
        mode: { $ref: "#/components/schemas/SecurityControlMode" }
        version: { type: integer }
        total:
          type: integer
          description: Every count in the window.
        currentHour:
          type: integer
          description: Counted in the current hour, live.
        pending:
          type: integer
          description: Counted, but not yet summarized in the audit log.
        entries:
          type: array
          description: Largest count first.
          items: { $ref: "#/components/schemas/SecurityReportEntry" }

    SecurityControlReport:
      type: object
      required: [organizationId, days, since, generatedAt, summaryDelayMinutes, controls]
      properties:
        organizationId: { type: string }
        days: { type: integer }
        since:
          type: string
          format: date-time
          description: The start of the window, a whole hour.
        generatedAt: { type: string, format: date-time }
        summaryDelayMinutes:
          type: integer
          description: How long after an hour ends its summaries are written to the audit log.
        controls:
          type: array
          description: All four controls, in the order of SecurityControlName.
          items: { $ref: "#/components/schemas/SecurityControlCounts" }

    SecurityControlChangeInput:
      type: object
      required: [expectedVersion]
      additionalProperties: false
      properties:
        mode: { $ref: "#/components/schemas/SecurityControlMode" }
        config:
          description: The new configuration, or null to clear it; absent keeps it.
          oneOf:
            - $ref: "#/components/schemas/CredentialLifetimeConfig"
            - type: "null"
        expectedVersion: { type: integer, minimum: 0 }

    SecurityControlChange:
      type: object
      required: [control, changed, loosened]
      properties:
        control: { $ref: "#/components/schemas/SecurityControl" }
        changed:
          type: boolean
          description: False when the request matched the current state; nothing was recorded.
        loosened:
          type: boolean
          description: The change weakened the control and used an approval.

    ApprovalChange:
      type: object
      required: [field, from, to, loosens]
      properties:
        field: { type: string, description: "What changes, such as mode or maxTtlSeconds." }
        from: { type: [string, "null"] }
        to: { type: [string, "null"] }
        loosens: { type: boolean }

    Approval:
      type: object
      required: [id, operation, organization, summary, state, closeReason, requestedBy, url, interval, createdAt, expiresAt, approvedAt, consumedAt, closedAt]
      description: >
        A step-up approval (an Approval Intent, ADR-0054 Decision 3): one
        person's approval with a trusted passkey for one exact operation.
        It never contains a secret value.
      properties:
        id: { type: string }
        operation:
          type: string
          enum: [security_control.change, passkey.remove, organization.unfreeze, requirement.update, requirement.revoke, identity.create, credential.issue, identity.reactivate, oidc_binding.create, oidc_binding.delete, grant.create, grant.replace, grant.revoke, role.create, role.update, role.delete, group.create, group.update, group.delete, group.member_add, group.member_remove, team.create, team.update, team.delete, team.member_add, team.member_remove, team.project_add, team.project_remove, member.invite_admin, member.promote, member.demote, member.remove, webhook.create, webhook.update, webhook.delete, connection.create, connection.replace_credential, connection.delete, github_app.register, github_app.import, github_app.replace_key, github_app.remove]
          description: The semantic operation, not the HTTP route.
        organization:
          description: The Organization it acts in; null for an account operation such as passkey.remove.
          oneOf:
            - type: object
              required: [id, slug, name]
              properties:
                id: { type: string }
                slug: { type: string }
                name: { type: string }
            - type: "null"
        summary:
          type: object
          required: [title, changes]
          description: Written by the server from the parsed request, for the approver.
          properties:
            title: { type: string }
            changes:
              type: array
              items: { $ref: "#/components/schemas/ApprovalChange" }
        state:
          type: string
          enum: [pending, approved, consumed, expired, closed]
        closeReason:
          type: [string, "null"]
          enum: [cancelled, reset, organization-deleted, frozen, null]
        requestedBy:
          type: object
          required: [credentialKind, client]
          properties:
            credentialKind: { type: string, enum: [browser, cli] }
            client: { type: [string, "null"], description: "The asking client's summary, such as varlatch CLI 0.21.0 on Linux." }
        url:
          type: [string, "null"]
          description: The dashboard page that approves it; null when the server has no public URL.
        interval:
          type: integer
          description: Seconds between polls.
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: 2 minutes after creation from the dashboard, 10 from the CLI; approval never extends it.
        approvedAt: { type: [string, "null"], format: date-time }
        consumedAt: { type: [string, "null"], format: date-time }
        closedAt: { type: [string, "null"], format: date-time }

    ApprovalOptions:
      type: object
      required: [publicKey]
      properties:
        publicKey:
          type: object
          additionalProperties: true
          description: >
            WebAuthn request options (PublicKeyCredentialRequestOptionsJSON),
            userVerification required, allowing only the caller's trusted passkeys.

    IssuedCliCredential:
      type: object
      required: [id, token, expiresAt]
      properties:
        id: { type: string }
        token:
          type: string
          description: Returned exactly once; never retrievable again.
        expiresAt: { type: string, format: date-time }

    DeviceSignInStarted:
      type: object
      required: [deviceCode, userCode, verificationUri, expiresIn, interval]
      properties:
        deviceCode:
          type: string
          description: The collecting bearer; returned once, never shown to anyone.
        userCode: { type: string, description: "Eight letters shown as XXXX-XXXX" }
        verificationUri: { type: string, description: Where the person types the code }
        expiresIn: { type: integer, description: Seconds until the pending sign-in expires }
        interval: { type: integer, description: Minimum seconds between polls }

    DeviceSignInLookup:
      type: object
      required: [signIn, approval]
      properties:
        signIn:
          type: object
          required: [userCode, ttlSeconds, name, requesterIp, requesterUserAgent, requestedAt, expiresAt]
          properties:
            userCode: { type: string }
            ttlSeconds: { type: integer, description: Lifetime of the credential approval issues }
            name: { type: [string, "null"] }
            requesterIp: { type: [string, "null"], description: The peer address the server saw }
            requesterUserAgent: { type: [string, "null"] }
            requestedAt: { type: string, format: date-time }
            expiresAt: { type: string, format: date-time }
        approval:
          type: [object, "null"]
          description: Null when the person has no passkey to approve with.
          required: [publicKey]
          properties:
            publicKey:
              type: object
              additionalProperties: true
              description: WebAuthn request options (PublicKeyCredentialRequestOptionsJSON).

    OidcBinding:
      type: object
      required: [id, identityId, issuer, audience, subject, claims, createdAt]
      properties:
        id: { type: string }
        identityId: { type: string }
        issuer: { type: string }
        audience: { type: string }
        subject: { type: string }
        claims:
          type: [object, "null"]
          additionalProperties: { type: string }
        createdAt: { type: string, format: date-time }

    IssuedOidcCredential:
      type: object
      required: [id, token, expiresAt, identityId]
      properties:
        id: { type: string }
        token:
          type: string
          description: Returned exactly once; never retrievable again.
        expiresAt: { type: string, format: date-time }
        identityId: { type: string }

    Webhook:
      type: object
      required: [id, url, eventTypes, createdAt, failureCount, version, updatedAt]
      properties:
        id: { type: string }
        url: { type: string }
        eventTypes:
          type: [array, "null"]
          items: { type: string }
        createdAt: { type: string, format: date-time }
        failureCount: { type: integer }
        lastAttemptAt: { type: [string, "null"], format: date-time }
        lastStatus: { type: [string, "null"] }
        version: { $ref: "#/components/schemas/EntityVersion" }
        updatedAt: { type: [string, "null"], format: date-time }

    CreatedWebhook:
      allOf:
        - $ref: "#/components/schemas/Webhook"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: >
                HMAC-SHA256 signing secret, returned exactly once; stored
                encrypted server-side and never retrievable.

    SyncPlatform:
      type: string
      enum: [github-actions, coolify, convex]
      description: >
        Platform Adapters are a closed allowlist bundled with releases
        (ADR-0031); there is deliberately no generic push-to-URL adapter.

    PlatformConnection:
      type: object
      required: [id, organizationId, platform, baseIdentity, name, createdAt, version, updatedAt, credentialExpiresAt, credentialExpirySeenAt, credentialKind, githubAppId, installationId]
      properties:
        id: { type: string }
        organizationId: { type: string }
        platform: { $ref: "#/components/schemas/SyncPlatform" }
        baseIdentity:
          type: string
          description: Immutable; a different instance or account is a new Connection.
        name: { type: string }
        targetCount: { type: integer }
        createdAt: { type: string, format: date-time }
        version: { $ref: "#/components/schemas/EntityVersion" }
        updatedAt: { type: [string, "null"], format: date-time }
        credentialExpiresAt:
          type: [string, "null"]
          format: date-time
          description: >
            When the platform last said the stored credential expires (GitHub
            personal access tokens), recorded when Varlatch uses it to push,
            check, or list. Null is unknown, not "never": GitHub says nothing
            for tokens without an expiry, other platforms say nothing at all,
            and replacing the credential clears it.
        credentialExpirySeenAt:
          type: [string, "null"]
          format: date-time
          description: When the platform said so; null with credentialExpiresAt.
        credentialKind:
          type: string
          enum: [token, github-app]
          description: >
            token: a stored Platform Credential. github-app: none; tokens are
            minted from the Organization's GitHub App for each use, so the
            Connection has no expiry (always null) and no credential to
            replace (the App's key is rotated instead).
        githubAppId: { type: [string, "null"], description: "The GitHub App (github-app Connections)" }
        installationId: { type: [integer, "null"], description: "The App's installation (github-app Connections)" }

    GitHubAccount:
      type: object
      required: [login, type]
      properties:
        login: { type: string, minLength: 1, maxLength: 39 }
        type: { type: string, enum: [organization, user] }

    GitHubApp:
      type: object
      required: [id, organizationId, githubAppId, slug, clientId, owner, htmlUrl, createdAt, version, updatedAt]
      properties:
        id: { type: string }
        organizationId: { type: string }
        githubAppId: { type: integer, description: GitHub's App id }
        slug: { type: string }
        clientId: { type: string, description: The App's client id (not a secret; the JWT issuer) }
        owner:
          type: object
          required: [login, id, type]
          properties:
            login: { type: string }
            id: { type: integer }
            type: { type: string, enum: [organization, user] }
        htmlUrl: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
        version: { $ref: "#/components/schemas/EntityVersion" }
        updatedAt: { type: [string, "null"], format: date-time }

    GitHubAppRegistrationStart:
      type: object
      required: [id, state, action, manifest, account, expiresAt]
      properties:
        id: { type: string, description: "The registration's stable id: what an attachment's approval is bound to (ADR-0054 amendment D)" }
        state: { type: string, description: Single-use; only its hash is stored }
        action: { type: string, format: uri, description: Where the browser posts the manifest }
        manifest:
          type: object
          additionalProperties: true
          description: GitHub's App manifest; post its JSON as the form field `manifest`
        account: { $ref: "#/components/schemas/GitHubAccount" }
        expiresAt: { type: string, format: date-time }

    GitHubAppRegistrationRegistered:
      type: object
      required: [outcome, app]
      properties:
        outcome: { type: string, enum: [registered] }
        app: { $ref: "#/components/schemas/GitHubApp" }

    GitHubAppRegistrationRefused:
      type: object
      required: [outcome, reason, app, account, deleteUrl, message]
      properties:
        outcome: { type: string, enum: [refused] }
        reason:
          type: string
          enum: [owner-mismatch, organization-has-app, app-in-use, expired, registration-ended]
          description: >
            owner-mismatch: GitHub created the App on another account (the
            person's own, when they may not register Apps on the intended
            one). organization-has-app: the Organization got an App
            meanwhile. app-in-use: another Organization has this App.
            expired: a pending conversion was not attached within its hour
            (ADR-0054 amendment D). registration-ended: the registration was
            already attached, discarded or refused.
        app:
          type: object
          required: [githubAppId, slug, owner]
          properties:
            githubAppId: { type: integer }
            slug: { type: string }
            owner: { $ref: "#/components/schemas/GitHubAccount" }
        account: { $ref: "#/components/schemas/GitHubAccount" }
        deleteUrl:
          type: [string, "null"]
          format: uri
          description: >
            Where the App's owner deletes it on GitHub. Null for
            registration-ended: its App may be the one this Organization
            attached (an attachment repeated after a lost answer).
        message: { type: string }

    GitHubAppRegistrationFailed:
      type: object
      required: [outcome, retryable, message]
      properties:
        outcome: { type: string, enum: [failed] }
        retryable:
          type: boolean
          description: True when GitHub could not be reached; the state was released for another attempt
        httpStatus: { type: integer }
        message: { type: string }

    GitHubAppImportFailed:
      description: An import or key rotation that did not happen, and why, read as an access check is; nothing was stored.
      allOf:
        - { $ref: "#/components/schemas/AccessCheck" }
        - type: object
          required: [outcome]
          properties:
            outcome: { type: string, enum: [failed] }

    GitHubAppInstallation:
      type: object
      required: [installationId, account, repositorySelection, suspended]
      properties:
        installationId: { type: integer }
        account:
          type: object
          required: [login, id, type]
          properties:
            login: { type: string }
            id: { type: integer }
            type: { type: string, enum: [organization, user] }
        repositorySelection: { type: string, enum: [all, selected] }
        suspended: { type: boolean }

    GitHubAppInstallationListing:
      type: object
      required: [check, items, truncated]
      properties:
        check: { $ref: "#/components/schemas/AccessCheck" }
        items:
          type: array
          items: { $ref: "#/components/schemas/GitHubAppInstallation" }
        truncated: { type: boolean, description: True when Varlatch stopped at 3,000 installations }

    AccessCheck:
      type: object
      required: [status, where, message]
      properties:
        status:
          type: string
          enum: [ok, credential-rejected, permission-missing, not-found, unreachable, failed]
          description: >
            ok means reachable and readable: platforms cannot show write
            permission without a write, so the first push confirms it.
        where:
          type: string
          enum: [connection, destination]
          description: What the outcome is about, the credential and base identity or the destination, so a client can point at the field to fix.
        message:
          type: string
          description: One sentence for the person who fixes it; never platform response text.
        httpStatus: { type: integer, description: "The platform's HTTP status, when it answered." }
        credentialExpiresAt:
          type: string
          format: date-time
          description: >
            When the checked credential expires, if the platform said (GitHub
            personal access tokens). For a credential supplied with the check,
            it is reported and not stored. For a Connection's stored
            credential, the date recorded for it stands in when the platform
            does not repeat it; a supplied credential never borrows one.

    DestinationOption:
      type: object
      required: [destination, label]
      properties:
        destination:
          type: object
          additionalProperties: { type: string }
          description: The destination record, as a Sync Target takes it ({repo}, {applicationUuid} or {serviceUuid}).
        label: { type: string, description: The repository, application or service name. }
        detail: { type: string, description: "A second line: visibility, the application's address, or \"service\"." }

    DestinationListing:
      type: object
      required: [check, items, truncated]
      properties:
        check:
          $ref: "#/components/schemas/AccessCheck"
          description: ok when the listing ran; otherwise why not, and items is empty.
        items:
          type: array
          items: { $ref: "#/components/schemas/DestinationOption" }
        truncated:
          type: boolean
          description: >
            The listing is partial: Varlatch stopped reading (at 1,000
            options, or after 30 pages of GitHub repositories), so more may
            exist than it shows, possibly with none listed. Type the exact
            name.

    SyncMappingInput:
      description: >
        Item mapping: wildcard (every current AND future item of the
        Environment, optionally minus an exclusion list of exact names or
        trailing-* prefixes) or an explicit list with optional destination
        renames. A wildcard with exclusions gates exactly like a plain
        wildcard: the remainder still covers unknown future items.
      oneOf:
        - type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [wildcard] }
            exclude:
              type: array
              maxItems: 200
              items: { type: string, minLength: 1, maxLength: 200 }
        - type: object
          required: [kind, items]
          properties:
            kind: { type: string, enum: [explicit] }
            items:
              type: array
              minItems: 1
              maxItems: 500
              items:
                type: object
                required: [name]
                properties:
                  name: { type: string, minLength: 1, maxLength: 200 }
                  rename: { type: string, minLength: 1, maxLength: 200 }

    SyncMapping:
      description: >
        Stored mapping. secretAffirmed records whether disclosure of the
        item as a Secret is authorized; a mapped item that later becomes a
        Secret leaves the disclosure set until re-affirmed. A wildcard may
        carry a sorted exclusion list (exact names or trailing-* prefixes).
      oneOf:
        - type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [wildcard] }
            exclude:
              type: array
              maxItems: 200
              items: { type: string, minLength: 1, maxLength: 200 }
        - type: object
          required: [kind, items]
          properties:
            kind: { type: string, enum: [explicit] }
            items:
              type: array
              items:
                type: object
                required: [name, secretAffirmed]
                properties:
                  name: { type: string }
                  rename: { type: string }
                  secretAffirmed: { type: boolean }

    SyncTarget:
      type: object
      required:
        [id, organizationId, projectId, environmentId, connectionId,
         destination, mapping, removeOrphans, redeploy, state,
         disabledReason, failureCount, needsSync, lastAttemptAt, lastResult,
         lastNotes, createdAt, version, updatedAt]
      properties:
        id: { type: string }
        organizationId: { type: string }
        projectId: { type: string }
        environmentId: { type: string }
        connectionId: { type: string }
        destination:
          type: object
          additionalProperties: { type: string }
        mapping: { $ref: "#/components/schemas/SyncMapping" }
        removeOrphans: { type: boolean }
        redeploy: { type: boolean }
        state: { type: string, enum: [active, paused, disabled] }
        disabledReason: { type: [string, "null"] }
        failureCount: { type: integer }
        needsSync: { type: boolean }
        lastAttemptAt: { type: [string, "null"], format: date-time }
        lastResult: { type: [string, "null"] }
        lastNotes:
          type: [array, "null"]
          maxItems: 50
          items: { $ref: "#/components/schemas/SyncTargetNote" }
          description: >
            The names the last run held, first, then hints on how the
            destination itself uses the managed names (ADR-0031, amendments
            2026-10-21 and 2026-10-22). They never fail a run, and each run
            that reaches the value check replaces them. Null when no run has
            since 0.18.1.
        lastDrift:
          type: [object, "null"]
          description: >
            The last drift the Target observed (ADR-0050): destination names
            that differed from what Varlatch last wrote when a repair read
            the destination back, before it put them back. Names only;
            count is exact, names holds at most the first 50; eventId is
            the sync.drift_detected audit event (reading it needs
            audit.read). Cleared when the destination changes. Null when
            no drift was observed, and on servers before 0.20.0.
          required: [at, count, names, eventId]
          properties:
            at: { type: string, format: date-time }
            count: { type: integer }
            names: { type: array, maxItems: 50, items: { type: string } }
            eventId: { type: [string, "null"] }
        drained:
          type: boolean
          description: >
            True when no run of this Target can start another request to the
            destination (ADR-0050): every run has ended or passed its
            deadline. A request a run had already sent may still reach the
            platform. Requires capability `sync.pause-wait`; absent from
            older servers.
        runStartedAt:
          type: [string, "null"]
          format: date-time
          description: When the oldest run that can still send started; null when drained.
        createdAt: { type: string, format: date-time }
        version: { $ref: "#/components/schemas/EntityVersion" }
        updatedAt: { type: [string, "null"], format: date-time }

    SyncTargetNote:
      type: object
      required: [code]
      description: >
        A hint about one managed name, or about the inspection. held: the
        run did not write, adopt or delete the name (reason), and it is no
        failure; fix names the Target option that would let it through.
        held-more: count more held names did not fit. shadowed: the
        destination's configuration sets the name to another value in these
        containers, which wins. not-delivered: no container uses it.
        unknown-form: used in these containers in a form Varlatch does not
        read. generated-once: the platform generated it once; a database may
        read it only on first start. kept-by-platform: Varlatch removed it,
        and the platform may keep or re-create it; Varlatch does not delete
        it again. usage-unchecked: the usage could not be read (reason).
      properties:
        code:
          type: string
          enum: [held, held-more, shadowed, not-delivered, unknown-form, generated-once, kept-by-platform, usage-unchecked]
        name: { type: string, maxLength: 256, description: Destination name (renames applied) }
        containers:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 64 }
        reason: { type: string, maxLength: 200, description: "Why the name was held, or why the usage could not be read, in Varlatch's words." }
        fix:
          type: string
          enum: [platform-expands]
          description: "held: listing the name in the destination's platformExpands would let it through."
        count: { type: integer, minimum: 1, description: "held-more: how many held names did not fit." }

    AuditCredential:
      type: object
      required: [name, kind, client]
      description: >
        What the audit listing's credentials sidecar says about a credential
        its events name. Metadata only; never token material.
      properties:
        name: { type: [string, "null"] }
        kind:
          type: string
          description: service, cli, browser (a dashboard session), agent-run, or oidc.
        client:
          type: [string, "null"]
          maxLength: 64
          description: >
            The client that requested the credential, for browser and cli
            credentials ("Firefox on Linux"); null otherwise or when unknown.

    SyncLedgerName:
      type: object
      required: [name, state, updatedAt, error]
      properties:
        name: { type: string, description: Destination name (renames applied) }
        state:
          type: string
          enum: [intent-write, written, failed-write, intent-delete, tombstone, failed-delete]
        updatedAt: { type: string, format: date-time }
        error: { type: [string, "null"] }

    AuditEvent:
      type: object
      required: [schemaVersion, eventId, eventType, occurredAt, decision]
      description: >
        Versioned Security Audit Event (ADR-0016). Never contains plaintext
        Values, key/credential material, or value-derived hashes.
      properties:
        schemaVersion: { type: integer }
        eventId: { type: string }
        eventType: { type: string }
        occurredAt: { type: string, format: date-time }
        actorIdentityId: { type: [string, "null"] }
        authenticationMethodId: { type: [string, "null"] }
        credentialId:
          type: [string, "null"]
          description: >
            The credential of the request that recorded the event, when the
            actor is the identity that made it; on credential.issued,
            credential.revoked, and authentication.device_collected, the
            credential the event is about. Null when no request credential
            applies (Varlatch's own events, failed authentications). Before
            0.16.0 only authorization.denied and those three types named one.
        client:
          type: [string, "null"]
          maxLength: 64
          description: >
            A short, readable summary of the User-Agent of the request that
            recorded the event, such as "Firefox on Linux", "varlatch CLI
            0.16.0 on Linux, assisted" (the CLI in assisted mode, a coding
            agent driving it), or "varlatch MCP 0.16.0 on Linux". What the
            client says about itself, never verified. Null when the client
            was not recognized, for events no authenticated request recorded,
            and for events before 0.16.0; absent from older servers
            (capability audit.attribution).
        organizationId: { type: [string, "null"] }
        action: { type: [string, "null"] }
        resource: { type: object }
        decision:
          type: string
          enum: [allow, deny, info]
        authorization: { type: object }
        tailnetContext: { type: object }
        listener:
          type: [string, "null"]
          enum: [ordinary, tailnet, null]
        requestId: { type: [string, "null"] }
        metadata: { type: object }
