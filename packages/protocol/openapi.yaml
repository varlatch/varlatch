openapi: 3.1.0
info:
  title: Varlatch Public API
  description: >
    The sole stable Varlatch public API, served by varlatchd (ADR-0018).
    Bearer-only authentication; additive-only evolution within /v1; error codes,
    pagination, idempotency semantics and the audit NDJSON schema are part of
    the compatibility contract. Pre-product-1.0 releases may still contain
    breaking changes while the contract is being established.
  version: 0.15.2
servers:
  - url: /v1
security:
  - bearerAuth: []
tags:
  - name: meta
  - name: organizations
  - name: projects
  - name: environments
  - name: values
  - name: contracts
  - name: identities
  - name: grants
  - name: search
  - name: audit
  - name: sync

paths:
  /installation/backups:
    get:
      tags: [meta]
      operationId: getInstallationBackups
      summary: Installation Admin only, per-archive backup checks and delivery status
      responses:
        "200":
          description: Backup status, without destination credentials or key material
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallationBackups" }
        "403":
          description: Installation Admin authority required

  /meta:
    get:
      tags: [meta]
      operationId: getMeta
      summary: Discovery endpoint for version-skew handling and capability detection
      security: []
      responses:
        "200":
          description: Server/API compatibility information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meta" }

  /organizations:
    get:
      tags: [organizations]
      operationId: listOrganizations
      summary: List organizations the caller belongs to
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Organizations
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Organization" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [organizations]
      operationId: createOrganization
      summary: Create an organization (caller becomes its Organization Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                slug: { $ref: "#/components/schemas/Slug" }
      responses:
        "201":
          description: Created organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}:
    get:
      tags: [organizations]
      operationId: getOrganization
      parameters: [{ $ref: "#/components/parameters/org" }]
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [organizations]
      operationId: renameOrganization
      summary: >
        Rename an organization's display name (capability
        organizations.rename). The name is trimmed. The slug, which the CLI,
        URLs, and configuration use, does not change. The audit event
        organization.renamed records the previous and the new name.
        Requires organization.manage; existence-hiding.
      parameters: [{ $ref: "#/components/parameters/org" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: 1 to 200 characters once surrounding whitespace is trimmed.
      responses:
        "200":
          description: Renamed organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/config-items:
    get:
      tags: [search]
      operationId: searchConfigItems
      summary: >
        Search Config Item names across the organization (capability
        search.items, ADR-0030). Matches names only — Values, value-derived
        hashes, and Secret Material never participate in matching. Candidate
        Environments are established from the caller's config.metadata.read
        entitlement before matching; a hit the caller may not see is
        indistinguishable from no hit, and hidden candidates never affect
        counts, page boundaries, or cursors. Matching is case-insensitive
        literal substring; %, _, whitespace, and every other character are
        literal. Results group by (project, exact item name), ordered by
        Project slug, item name, Project ID. Pagination is a live view:
        every page re-evaluates current permissions.
      parameters:
        - $ref: "#/components/parameters/org"
        - name: q
          in: query
          required: true
          description: Literal substring to match; empty queries are rejected, never list-all.
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: limit
          in: query
          description: Counts grouped (project, item name) results.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Matching Config Items visible to the caller
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ConfigItemSearchResult" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects:
    get:
      tags: [projects]
      operationId: listProjects
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [projects]
      operationId: createProject
      parameters: [{ $ref: "#/components/parameters/org" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, contractAuthority]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                slug: { $ref: "#/components/schemas/Slug" }
                contractAuthority: { $ref: "#/components/schemas/ContractAuthority" }
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}:
    get:
      tags: [projects]
      operationId: getProject
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [projects]
      operationId: renameProject
      summary: >
        Rename a project's display name (capability projects.rename). The
        slug, which the CLI, URLs, contracts and grants use, does not change.
        The audit event project.renamed records the previous and the new
        name. Requires project.manage; existence-hiding.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Renamed project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments:
    get:
      tags: [environments]
      operationId: listEnvironments
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Environments
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Environment" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [environments]
      operationId: createEnvironment
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { $ref: "#/components/schemas/EnvironmentName" }
                tier:
                  description: Required for root environments; forbidden for derived (inherited).
                  $ref: "#/components/schemas/Tier"
                kind:
                  $ref: "#/components/schemas/EnvironmentKind"
                parentEnvironmentId:
                  description: Present for derived environments (one level only).
                  type: string
                expiresAt:
                  description: Preview environments only.
                  type: string
                  format: date-time
      responses:
        "201":
          description: Created environment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}:
    get:
      tags: [environments]
      operationId: getEnvironment
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
      responses:
        "200":
          description: Environment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [environments]
      operationId: deleteEnvironment
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/values/{item}:
    put:
      tags: [values]
      operationId: setValue
      summary: Create a new immutable Value version for a Config Item in this environment
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
        - $ref: "#/components/parameters/item"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string }
                expectedVersionId:
                  description: Optimistic concurrency; rejects stale writes with VERSION_CONFLICT.
                  type: string
      responses:
        "200":
          description: New version metadata (never echoes the value)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValueVersion" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [values]
      operationId: deleteValue
      summary: Remove the Config Item's value from this environment (versions retained per audit rules)
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
        - $ref: "#/components/parameters/item"
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/values/{item}/rotations:
    post:
      tags: [values]
      operationId: beginRotation
      summary: >
        Begin a dual-phase rotation (capability values.rotation, ADR-0027):
        write a new primary version and keep the prior value retrievable
        alongside it for a bounded grace window, so running consumers migrate
        without an outage. Reads resolve the primary; the retiring value is
        exposed only through explicit disclosure and capability exercise.
        Rejected with ROTATION_IN_PROGRESS if one is already active.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
        - $ref: "#/components/parameters/item"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string }
                expectedVersionId:
                  description: Optimistic concurrency against the current primary.
                  type: string
                graceSeconds:
                  description: >
                    Overlap window; clamped to [1, 2592000] and defaulted from
                    the contract's per-item rotationGraceSeconds, else 24h.
                  type: integer
                  minimum: 1
                  maximum: 2592000
      responses:
        "201":
          description: Rotation started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValueRotation" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/values/{item}/rotations/complete:
    post:
      tags: [values]
      operationId: completeRotation
      summary: >
        Complete a rotation early (ADR-0027): drop the retiring value so the
        old upstream credential can be revoked. Idempotent — a no-op success
        when the item is not rotating (an elapsed deadline already retired it).
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
        - $ref: "#/components/parameters/item"
      responses:
        "200":
          description: Rotation completed (or already stable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValueRotation" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/effective-configuration:
    get:
      tags: [values]
      operationId: getEffectiveConfiguration
      summary: >
        Bulk-resolve the Effective Configuration (child overrides over parent
        values). With include=values, plaintext is returned for items the caller
        is authorized for (config.value.read for non-sensitive, secret.reveal
        for Secrets) and every disclosure is audited before material is
        returned. Values may reference sibling items as ${NAME} (capability
        values.references): references are expanded server-side using only
        values the caller receives in the same response; anything else stays
        a literal ${NAME}. $${NAME} escapes to a literal ${NAME}.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
        - name: include
          in: query
          schema: { type: string, enum: [metadata, values] }
      responses:
        "200":
          description: Effective configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EffectiveConfiguration" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/retrievals:
    post:
      tags: [values]
      operationId: strictRetrieval
      summary: >
        Strict retrieval (capability retrieval.strict): the non-sensitive
        values (config.value.read) and every Secret (secret.reveal) this
        caller may receive, the state manifest and its digest, the caller
        view, the active Contract (contract.read), and the validation of
        exactly the values returned, all from one database snapshot, in one
        response. Requires config.metadata.read. Each class is authorized
        separately: a denied class is reported in callerView.withheld, not an
        error. Every decryption follows an audit commit naming its version.
        Any failure after the snapshot returns an error and no values. Never
        cacheable.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [strict, preflight]
                  description: >
                    preflight (capability retrieval.preflight) returns the
                    non-sensitive values and a verdict per Secret, never a
                    Secret value. Each Secret decryption is audited first as
                    secret.validated with purpose preflight-validation.
      responses:
        "200":
          description: The captured state and the values delivered from it (Cache-Control no-store)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrictRetrieval" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/disclosures:
    post:
      tags: [values]
      operationId: discloseSecrets
      summary: >
        Explicit Secret disclosure (capability secrets.requested-disclosure).
        The request declares its items or an intentional all-authorized scope;
        one audit event enumerates exactly what was returned. Responses are
        never cacheable. ${NAME} references inside disclosed Secrets are
        expanded server-side (capability values.references) from other
        Secrets disclosed in the same call and — only when the caller also
        holds config.value.read — from the environment's non-sensitive
        values, each such expansion audited; unauthorized or unknown
        references stay literal. An optional purpose (capability
        secrets.disclosure-purpose) is recorded in the disclosure's audit
        events and changes nothing else.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [items]
                  properties:
                    items:
                      type: array
                      minItems: 1
                      items: { type: string }
                    purpose: { $ref: "#/components/schemas/DisclosurePurpose" }
                - type: object
                  required: [scope]
                  properties:
                    scope: { type: string, enum: [all-authorized-secrets] }
                    purpose: { $ref: "#/components/schemas/DisclosurePurpose" }
      responses:
        "200":
          description: Disclosed Secret values (Cache-Control no-store)
          content:
            application/json:
              schema:
                type: object
                required: [items, withheld]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [name, versionId, value]
                      properties:
                        name: { type: string }
                        versionId: { type: string }
                        value: { type: string }
                        retiring:
                          description: >
                            The previous value during a dual-phase rotation
                            (ADR-0027), still valid — accept either during the
                            window. Absent when the item is stable.
                          type: object
                          required: [versionId, value]
                          properties:
                            versionId: { type: string }
                            value: { type: string }
                  withheld:
                    type: array
                    items: { type: string }
                  manifest:
                    $ref: "#/components/schemas/StateManifest"
                    description: Present when the caller also holds config.metadata.read.
                  stateDigest: { $ref: "#/components/schemas/StateDigest" }
                  callerView: { $ref: "#/components/schemas/CallerView" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/capabilities:
    post:
      tags: [capabilities]
      operationId: issueCapability
      summary: >
        Issue a Capability (capability capabilities.broker, ADR-0022). Broker
        identities only. Issuance narrows potential future use and never
        expands the Agent's Grants; the capability secret is returned exactly
        once. Responses are never cacheable.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentIdentityId, items, destinations, targets, ttlSeconds]
              properties:
                agentIdentityId: { type: string }
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string }
                destinations:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: string }
                targets:
                  type: object
                  description: >
                    Required (capability capabilities.targets). For every item,
                    1 to 4 substitution targets: header:<name> (never a
                    transport-owned header such as Host, Content-Length,
                    Transfer-Encoding, Content-Type, or connection and proxy
                    headers), query:<name>, json:<RFC 6901 pointer>, or
                    form:<name>. Recorded immutably on the Capability; the
                    Broker substitutes a Placeholder only at its targets.
                  additionalProperties:
                    type: array
                    minItems: 1
                    maxItems: 4
                    items: { type: string }
                ttlSeconds: { type: integer, minimum: 1 }
                runId: { type: string, maxLength: 200 }
                precondition:
                  type: object
                  description: >
                    Agent-safe strict preflight (capability retrieval.preflight):
                    the state a preflight strict retrieval saw. Issuance compares
                    it in its own snapshot, without decrypting anything, and
                    refuses with STATE_CHANGED (details.categories names only
                    what changed) when it differs. It confers no authority.
                  required: [projectId, environmentId, stateDigest, stateDigests]
                  properties:
                    projectId: { type: string }
                    environmentId: { type: string }
                    stateDigest: { $ref: "#/components/schemas/StateDigest" }
                    stateDigests: { $ref: "#/components/schemas/StateDigests" }
      responses:
        "201":
          description: Issued Capability with its one-time secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedCapability" }
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [capabilities]
      operationId: listCapabilities
      summary: >
        List Capabilities for this environment. Brokers see their own;
        callers with policy.read see all.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Capability" }
                  nextCursor: { type: [string, "null"] }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/capabilities/{capability}:
    delete:
      tags: [capabilities]
      operationId: revokeCapability
      summary: >
        Revoke a Capability. The issuing Broker may revoke its own; callers
        with policy.manage may revoke any. Takes effect on the next exercise.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
        - name: capability
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/capabilities/{capability}/exercises:
    post:
      tags: [capabilities]
      operationId: exerciseCapability
      summary: >
        Exercise a Capability (ADR-0022). Requires the issuing Broker's
        bearer plus the capability secret; the Agent's secret.use is
        evaluated against current state (including Tailnet Requirements on
        this request), current Value versions are resolved, and the exercise
        is audited before decryption. ${NAME} references inside exercised
        material are expanded strictly (ADR-0026): referenced Secrets must
        be named in the Capability, non-sensitive references require the
        Agent's config.value.read (audited), and any unresolvable reference
        denies the exercise (reason unresolved-reference) rather than
        injecting literal ${NAME} upstream — $${NAME} escapes. Responses
        are never cacheable and go to the Broker only.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
        - name: capability
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capabilitySecret, destination]
              properties:
                capabilitySecret: { type: string }
                destination:
                  type: object
                  required: [host, port]
                  properties:
                    host: { type: string }
                    port: { type: integer, minimum: 1, maximum: 65535 }
                placements:
                  type: array
                  description: >
                    Each substitution the Broker will make, as an item and one
                    of its recorded targets. Only these items are returned;
                    references inside them still resolve against the other
                    Secrets on the Capability, each dependency audited before
                    it is decrypted. A Capability without targets (issued
                    before they were required) is refused with reason
                    capability-without-targets; a placement the Capability
                    does not hold with placement-not-targeted.
                  items:
                    type: object
                    required: [item, target]
                    properties:
                      item: { type: string }
                      target: { type: string }
      responses:
        "200":
          description: Exercised secret material (Cache-Control no-store)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityExercise" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/changes:
    post:
      tags: [values]
      operationId: applyChangeSet
      summary: >
        Atomic value change set (capability values.changeset): all
        expected-version guards validate before mutation; any conflict rejects
        the entire set with VERSION_CONFLICT. Supports Idempotency-Key.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    oneOf:
                      - type: object
                        required: [op, item, value]
                        properties:
                          op: { type: string, enum: [set] }
                          item: { type: string }
                          value: { type: string }
                          expectedVersionId: { type: string }
                      - type: object
                        required: [op, item]
                        properties:
                          op: { type: string, enum: [delete] }
                          item: { type: string }
                          expectedVersionId: { type: string }
      responses:
        "200":
          description: Applied change set
          content:
            application/json:
              schema:
                type: object
                required: [changeSetId, results]
                properties:
                  changeSetId: { type: string }
                  results:
                    type: array
                    items:
                      type: object
                      required: [item, op, versionId]
                      properties:
                        item: { type: string }
                        op: { type: string, enum: [set, delete] }
                        versionId: { type: [string, "null"] }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/validate:
    post:
      tags: [environments]
      operationId: validateEnvironment
      summary: Validate the Effective Configuration against the active Contract
      description: >
        Requires environment.read. Verdicts are value-derived, so each item is
        evaluated only if the caller may read what the verdict describes:
        presence of stored values needs config.metadata.read, verdicts on
        non-sensitive values need config.value.read, and verdicts on Secrets
        need secret.reveal including its Requirements (e.g. Tailnet
        Constraints). Anything else is reported in notEvaluated with an
        authorization-derived reason and never affects valid, missing, or
        invalid. valid is true only when complete is true. Values are
        validated in the form `varlatch run` delivers them to this caller,
        with references expanded; a value that would keep a reference
        literal gets no type verdict and is reported in unresolved. Every
        decryption for validation, including values read only to expand
        references, is audited before it happens (secret.validated /
        value.validated, naming item versions); verdicts are never audited.
        Responses are never cacheable.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
      responses:
        "200":
          description: Validation report (validity is reported, never blocks retrieval by default)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationReport" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/contract:
    get:
      tags: [contracts]
      operationId: getActiveContract
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
      responses:
        "200":
          description: The active Contract revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractRevision" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/contract/revisions:
    post:
      tags: [contracts]
      operationId: pushContractRevision
      summary: Submit a candidate Contract revision (content-hash idempotent; never activates implicitly)
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contract]
              properties:
                contract:
                  description: >
                    Canonical Configuration Contract (see @varlatch/contract).
                    A `semanticsVersion` in it pins that version, which must
                    be one the server lists in `/v1/meta`. Without one, the
                    revision keeps the active revision's version, or gets the
                    newest version when the project has no active revision.
                  type: object
                provenance:
                  type: object
                  properties:
                    repository: { type: string }
                    commitSha: { type: string }
                    schemaPath: { type: string }
                    adapterVersion: { type: string }
      responses:
        "201":
          description: Stored (or deduplicated) revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractRevision" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/contract/revisions/{revision}:
    get:
      tags: [contracts]
      operationId: getContractRevision
      summary: >
        One stored Contract revision by ID, active or not (capability
        contracts.revision-by-id). Needs contract.read. Revisions are
        immutable and contain no values; the content hash identifies both the
        items and the semantics version.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - name: revision
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractRevision" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/contract/revisions/{revision}/activate:
    post:
      tags: [contracts]
      operationId: activateContractRevision
      summary: Activate a stored revision (distinct authorization from push; audited with semantic diff)
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - name: revision
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Now-active revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractRevision" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/identities:
    get:
      tags: [identities]
      operationId: listIdentities
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Identities in the organization
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Identity" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [identities]
      operationId: createServiceIdentity
      summary: Create a machine identity (starts with zero Grants)
      parameters: [{ $ref: "#/components/parameters/org" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                kind:
                  type: string
                  enum: [service, workload, ci, broker, agent]
                credentialTtlSeconds:
                  type: integer
                  minimum: 1
                  maximum: 315360000
                  description: >
                    Optional wall-clock lifetime for the issued service
                    credential. Absent means no expiry (revocation only).
                credentialMaxUses:
                  type: integer
                  minimum: 1
                  maximum: 1000000
                  description: >
                    Optional use budget for the issued service credential;
                    each authenticated request consumes one use and the
                    credential stops authenticating once spent. 1 yields a
                    one-shot token. Absent means unlimited.
      responses:
        "201":
          description: >
            Created identity. If a service credential was issued it is returned
            exactly once and never retrievable again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedIdentity" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/identities/{identity}/credentials:
    get:
      tags: [identities]
      operationId: listIdentityCredentials
      summary: >
        List a machine identity's credentials — metadata only (capability
        identity.lifecycle, ADR-0034). Token material is unrecoverable by
        construction and never returned. Requires identity.manage;
        existence-hiding.
      parameters:
        - $ref: "#/components/parameters/org"
        - name: identity
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Credential metadata for the identity
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CredentialMetadata" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [identities]
      operationId: issueIdentityCredential
      summary: >
        Issue a credential for a machine identity. Two disjoint paths, chosen
        by the caller's kind; the token is returned exactly once. An in-org
        Broker mints a short-lived read-only agent-run credential for an
        Agent Identity (capability credentials.agent, ADR-0023); requests
        authenticated with one are refused for every non-read operation at
        the HTTP layer, and a Broker reaches no other identity. Any other
        principal with identity.manage issues a service credential for an
        in-org service, workload, or broker identity that is not retired
        (capability identity.credentials.issue): another credential for a
        program sharing the identity, the first one after reactivation, or
        the new half of a rotation. Human, ci, agent, retired, and other
        organizations' identities are existence-hidden.
      parameters:
        - $ref: "#/components/parameters/org"
        - name: identity
          in: path
          required: true
          description: Machine identity ID (an Agent Identity on the Broker path)
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  description: Broker path (credentials.agent).
                  required: [ttlSeconds]
                  properties:
                    ttlSeconds: { type: integer, minimum: 1, maximum: 3600 }
                    runId: { type: string, maxLength: 200 }
                - $ref: "#/components/schemas/MachineCredentialRequest"
      responses:
        "201":
          description: Issued credential (Cache-Control no-store)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/IssuedAgentCredential"
                  - $ref: "#/components/schemas/IssuedMachineCredential"
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/identities/{identity}/credentials/{credential}:
    delete:
      tags: [identities]
      operationId: revokeIdentityCredential
      summary: >
        Revoke a machine identity's credential. Two disjoint authorization
        paths: an in-org Broker may revoke agent-run credentials of in-org
        agents (ADR-0023); a principal with identity.manage may revoke
        service/oidc credentials of in-org machine identities (ADR-0034 §1,
        capability identity.lifecycle). cli/browser credentials are managed
        under /me/credentials only. A principal may revoke the credential it
        is currently authenticated with. Existence-hiding.
      parameters:
        - $ref: "#/components/parameters/org"
        - name: identity
          in: path
          required: true
          description: Agent Identity ID
          schema: { type: string }
        - name: credential
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/identities/{identity}:
    patch:
      tags: [identities]
      operationId: renameIdentity
      summary: >
        Rename a machine identity (capability identity.lifecycle, ADR-0034
        §4). Display-plane only: grants, credentials, OIDC bindings, and
        tailnet requirements reference the identity id and are unaffected.
        The audit event records both the previous and the new name. Requires
        identity.manage; machine kinds only; existence-hiding.
      parameters:
        - $ref: "#/components/parameters/org"
        - name: identity
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Renamed identity
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                properties:
                  id: { type: string }
                  name: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/identities/{identity}/retire:
    post:
      tags: [identities]
      operationId: retireIdentity
      summary: >
        Retire a machine identity (capability identity.lifecycle, ADR-0034
        §3): sets disabled and revokes every unrevoked credential in the same
        transaction. There is deliberately no DELETE — identities are audit
        actors and remain listable forever. Requires identity.manage; machine
        kinds only; existence-hiding.
      parameters:
        - $ref: "#/components/parameters/org"
        - name: identity
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Retired identity
          content:
            application/json:
              schema:
                type: object
                required: [id, disabled]
                properties:
                  id: { type: string }
                  disabled: { type: boolean }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/identities/{identity}/reactivate:
    post:
      tags: [identities]
      operationId: reactivateIdentity
      summary: >
        Reactivate a retired machine identity (ADR-0034 §3). Clears the
        disabled flag only — a reactivated identity has zero working
        credentials until an admin deliberately issues one. Requires
        identity.manage; machine kinds only; existence-hiding.
      parameters:
        - $ref: "#/components/parameters/org"
        - name: identity
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Reactivated identity
          content:
            application/json:
              schema:
                type: object
                required: [id, disabled]
                properties:
                  id: { type: string }
                  disabled: { type: boolean }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/identities/{identity}/oidc-bindings:
    get:
      tags: [identities]
      operationId: listOidcBindings
      summary: List a machine identity's active OIDC bindings
      parameters:
        - $ref: "#/components/parameters/org"
        - name: identity
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Active bindings
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OidcBinding" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [identities]
      operationId: createOidcBinding
      summary: >
        Bind an external OIDC issuer + audience + subject (and optional
        exact-match claims) to a machine identity (capability auth.oidc).
        A binding is an Authentication Method: exchanging a matching
        verified token establishes identity only — authority remains the
        identity's Grants, evaluated per request. Subject matches exactly,
        or by prefix when it ends with '*'.
      parameters:
        - $ref: "#/components/parameters/org"
        - name: identity
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuer, audience, subject]
              properties:
                issuer: { type: string, minLength: 1, maxLength: 2000 }
                audience: { type: string, minLength: 1, maxLength: 2000 }
                subject: { type: string, minLength: 1, maxLength: 2000 }
                claims:
                  type: object
                  additionalProperties: { type: string, maxLength: 2000 }
                  description: Additional token claims that must match exactly.
      responses:
        "201":
          description: Created binding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OidcBinding" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/identities/{identity}/oidc-bindings/{binding}:
    delete:
      tags: [identities]
      operationId: revokeOidcBinding
      summary: Revoke an OIDC binding; matching tokens stop exchanging immediately
      parameters:
        - $ref: "#/components/parameters/org"
        - name: identity
          in: path
          required: true
          schema: { type: string }
        - name: binding
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Error" }

  /oidc/token:
    post:
      tags: [identities]
      operationId: exchangeOidcToken
      security: []
      summary: >
        Exchange a platform-issued OIDC token (e.g. GitHub Actions) for a
        short-lived Varlatch credential (capability auth.oidc). The token is
        verified against the issuer's published JWKS and matched to a
        registered binding; all failures collapse to INVALID_CREDENTIAL.
        The minted credential is returned exactly once; TTL defaults to 600
        and is capped at 3600 seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, organization]
              properties:
                organization: { type: string, minLength: 1, description: Target organization ID or slug }
                token: { type: string, minLength: 1 }
                ttlSeconds: { type: integer, minimum: 1, maximum: 3600 }
      responses:
        "201":
          description: Issued oidc credential (Cache-Control no-store)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedOidcCredential" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/invitations:
    get:
      tags: [identities]
      operationId: listInvitations
      summary: >
        List the organization's invitations, newest first by creation time
        and ID (capability invitations.manage). Only pending invitations
        unless status is all. Never returns an invitation's token or
        anything derived from it. Requires identity.manage, like creating
        one; existence-hiding.
      parameters:
        - $ref: "#/components/parameters/org"
        - name: status
          in: query
          description: >
            pending (the default) lists invitations that can still be
            accepted; all adds consumed, expired, and revoked ones.
          schema: { type: string, enum: [pending, all], default: pending }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Invitations, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [identities]
      operationId: createInvitation
      summary: >
        Mint a one-time human enrollment invitation. The caller composes the
        browser URL as <dashboard-origin>/enroll#<token>; the invitee enrolls
        a passkey on their own device — no shared secret ever exists.
      parameters: [{ $ref: "#/components/parameters/org" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                role: { type: string, enum: [admin, member] }
      responses:
        "201":
          description: One-time invitation token (shown exactly once)
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt]
                properties:
                  id:
                    type: string
                    description: >
                      The invitation's ID, as listed and revoked (absent on
                      servers without invitations.manage).
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/invitations/{invitation}:
    delete:
      tags: [identities]
      operationId: revokeInvitation
      summary: >
        Revoke a pending invitation (capability invitations.manage). Its
        token stops working at once, also for an enrollment already started
        with it. The audit event invitation.revoked records it. An
        invitation that is consumed, expired, or already revoked is refused
        with VERSION_CONFLICT, its status in details.status. Requires
        identity.manage; existence-hiding.
      parameters:
        - $ref: "#/components/parameters/org"
        - { name: invitation, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Error" }

  /me/profile:
    get:
      tags: [identities]
      operationId: getMyProfile
      summary: >
        The caller's own profile: display name plus the Better Auth email and
        avatar image linked to the human identity. Machine identities have no
        profile and receive RESOURCE_NOT_FOUND.
      responses:
        "200":
          description: The caller's profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [identities]
      operationId: updateMyProfile
      summary: >
        Update the caller's display name and/or avatar image. The name is
        written to both the linked Better Auth user and the Varlatch identity
        so org listings show the new name. The image must be a data:image/…
        URL or an https:// URL of at most 100KB; null clears it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                image:
                  type: [string, "null"]
                  maxLength: 102400
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        default: { $ref: "#/components/responses/Error" }

  /me/credentials:
    get:
      tags: [identities]
      operationId: listMyCredentials
      summary: >
        List the caller's own credentials (ADR-0007's individually revocable
        credentials made visible). The credential authenticating this request
        is flagged current.
      responses:
        "200":
          description: The caller's credentials, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OwnCredential" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }

  /me/credentials/{credential}:
    delete:
      tags: [identities]
      operationId: revokeMyCredential
      summary: Revoke one of the caller's own credentials; takes effect immediately
      parameters:
        - { name: credential, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Error" }

  /me/credentials/cli:
    post:
      tags: [identities]
      operationId: exchangeCliCredential
      summary: >
        Trade the short-lived browser-handoff bearer (ADR-0024) for a
        longer-lived CLI credential. Restricted to browser session bearers —
        a leaked CLI credential cannot mint successors — and one-shot: the
        presenting bearer is revoked by the exchange.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttlSeconds: { type: integer, minimum: 60, maximum: 86400, default: 43200 }
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: Issued CLI credential (token shown exactly once; Cache-Control no-store)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedCliCredential" }
        default: { $ref: "#/components/responses/Error" }

  /auth/device:
    post:
      tags: [identities]
      operationId: startDeviceSignIn
      security: []
      summary: >
        Start a device-authorization sign-in (capability auth.device; RFC
        8628 adapted): a pending sign-in a person approves in the dashboard
        at verificationUri by typing userCode. The deviceCode is the CLI's
        bearer for collecting the credential: keep it private, never show
        it. Pending sign-ins expire after expiresIn seconds and are capped
        per client and in total (RATE_LIMITED with details.cap
        pending-per-client or pending-total). Served only when the server's
        public URL is HTTPS, or a loopback address (RESOURCE_NOT_FOUND
        otherwise). Cache-Control no-store.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttlSeconds:
                  type: integer
                  minimum: 60
                  maximum: 86400
                  default: 43200
                  description: Lifetime of the CLI credential the sign-in issues.
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: Pending sign-in created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceSignInStarted" }
        default: { $ref: "#/components/responses/Error" }

  /auth/device/token:
    post:
      tags: [identities]
      operationId: collectDeviceSignIn
      security: []
      summary: >
        Poll a device-authorization sign-in, at most once per interval.
        428 AUTHORIZATION_PENDING (details.interval) while it waits; 429
        SLOW_DOWN when polled sooner, the interval growing by 5 seconds;
        403 ACCESS_DENIED once denied; 410 EXPIRED once expired (or for an
        unknown device code); 201 with a CLI credential of the approving
        person, exactly once; 410 CONSUMED (details.credentialId, never the
        token) once collected. Cache-Control no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceCode]
              properties:
                deviceCode: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: Issued CLI credential (token shown exactly once)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedCliCredential" }
        default: { $ref: "#/components/responses/Error" }

  /auth/device/lookup:
    post:
      tags: [identities]
      operationId: lookupDeviceSignIn
      summary: >
        The pending sign-in a person typed the code of, for the
        confirmation screen, with a fresh passkey challenge for approving
        it (bound to the sign-in, the person, and their dashboard session;
        single use; 5 minutes). Requires a human's dashboard session bearer.
        Wrong codes count against persistent limits per person, per peer,
        and in total (RESOURCE_NOT_FOUND per wrong code, RATE_LIMITED with
        details.retryAt once a limit is reached). Cache-Control no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userCode]
              properties:
                userCode:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: As shown by the CLI; case-insensitive, the dash optional.
      responses:
        "200":
          description: The pending sign-in and an approval challenge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceSignInLookup" }
        default: { $ref: "#/components/responses/Error" }

  /auth/device/approve:
    post:
      tags: [identities]
      operationId: decideDeviceSignIn
      summary: >
        Approve or deny a pending device-authorization sign-in. Requires a
        human's dashboard session bearer; approving also requires a passkey
        assertion over the challenge lookupDeviceSignIn issued for this
        sign-in and session (PERMISSION_DENIED otherwise). STATE_CHANGED
        when the sign-in is no longer pending. The code counts against the
        same limits as lookupDeviceSignIn. Cache-Control no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userCode, decision]
              properties:
                userCode: { type: string, minLength: 1, maxLength: 64 }
                decision: { type: string, enum: [approve, deny] }
                assertion:
                  type: object
                  additionalProperties: true
                  description: >
                    WebAuthn authentication response (AuthenticationResponseJSON);
                    required to approve.
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                required: [decision]
                properties:
                  decision: { type: string, enum: [approved, denied] }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/grants:
