openapi: 3.1.0
info:
  title: Varlatch Public API
  description: >
    The sole stable Varlatch public API, served by varlatchd (ADR-0018).
    Bearer-only authentication; additive-only evolution within /v1; error codes,
    pagination, idempotency semantics and the audit NDJSON schema are part of
    the compatibility contract. Pre-product-1.0 releases may still contain
    breaking changes while the contract is being established.
  version: 0.21.0
servers:
  - url: /v1
security:
  - bearerAuth: []
tags:
  - name: meta
  - name: organizations
  - name: projects
  - name: environments
  - name: values
  - name: contracts
  - name: identities
  - name: grants
  - name: search
  - name: audit
  - name: sync

paths:
  /installation/backups:
    get:
      tags: [meta]
      operationId: getInstallationBackups
      summary: Installation Admin only, per-archive backup checks and delivery status
      responses:
        "200":
          description: Backup status, without destination credentials or key material
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallationBackups" }
        "403":
          description: Installation Admin authority required

  /installation/listeners:
    get:
      tags: [meta]
      operationId: getInstallationListeners
      summary: Installation Admin only, the tailnet listeners as configured and as varlatchd last observed them
      description: >
        What varlatchd checks at start and every 60 seconds: listeners bound,
        the browser endpoint's certificate, the LocalAPI answering, the node
        running on the pinned tailnet under the endpoint's name. Never
        reachability from a client, which only the client can observe
        (ADR-0046, Listener metadata).
      responses:
        "200":
          description: The tailnet listeners, or null without a tailnet listener
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallationListeners" }
        "403":
          description: Installation Admin authority required

  /installation/release:
    get:
      tags: [meta]
      operationId: getInstallationRelease
      summary: Installation Admin only, the host's last look for a newer release
      description: >
        What `varlatch upgrade --check` on the host last recorded, compared
        with this server's version at read time. Read-only: upgrading stays
        on the host. Requires capability `installation.release`.
      responses:
        "200":
          description: The running version and the last recorded check, or nulls when none was recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallationRelease" }
        "403":
          description: Installation Admin authority required

  /installation/outbound:
    get:
      tags: [meta]
      operationId: getInstallationOutbound
      summary: Installation Admin only, the host's outbound allow list and the destinations it refuses
      description: >
        VARLATCH_OUTBOUND_ALLOW as varlatchd parsed it at startup, with the
        warnings `varlatchd admin doctor` gives, and every live destination
        an Organization configured that the outbound policy refuses (ADR-0057
        Decision 8), by Organization, with the allow list value that would
        allow the refused names. Read-only: the allow list is set on the
        host, never through the API. The same check as `varlatchd admin
        outbound check`, run when asked: DNS lookups only, never a request
        to a destination; shared by concurrent requests and reused for up
        to 30 seconds. Never a resolved address, a path, a query or a
        credential. Requires capability `installation.outbound`.
      responses:
        "200":
          description: The allow list and the refused destinations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallationOutbound" }
        "403":
          description: Installation Admin authority required

  /meta:
    get:
      tags: [meta]
      operationId: getMeta
      summary: Discovery endpoint for version-skew handling and capability detection
      security: []
      responses:
        "200":
          description: Server/API compatibility information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meta" }

  /tailnet/endpoint:
    get:
      tags: [meta]
      operationId: getTailnetEndpoint
      summary: Where a browser reads tailnet-protected values (capability tailnet.browser-reads)
      description: >
        Any authenticated caller, on any listener. The URL is configuration:
        it says nothing about whether this browser can reach it, which only
        the browser can find out (ADR-0046 Decision 6).
      responses:
        "200":
          description: The browser endpoint, or null when this installation serves none
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TailnetEndpoint" }
        "401":
          description: No valid bearer credential

  /tailnet/context:
    get:
      tags: [meta]
      operationId: getTailnetContext
      summary: The caller's device as the tailnet browser endpoint verified it
      description: >
        Served only on the tailnet browser endpoint (404 elsewhere). The
        device comes from this request's own connection through Tailscale
        WhoIs, never from anything the request says; no Requirement is
        evaluated. A recognized device is no promise that a read will be
        allowed: every read checks the device again against the
        Requirements that apply (ADR-0046 Decision 5).
      responses:
        "200":
          description: The verified device, or why there is none
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TailnetDevice" }
        "401":
          description: No valid bearer credential
        "404":
          description: Not the tailnet browser endpoint

  /organizations:
    get:
      tags: [organizations]
      operationId: listOrganizations
      summary: List organizations the caller belongs to
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Organizations
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Organization" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [organizations]
      operationId: createOrganization
      summary: Create an organization (caller becomes its Organization Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                slug: { $ref: "#/components/schemas/Slug" }
      responses:
        "201":
          description: Created organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}:
    get:
      tags: [organizations]
      operationId: getOrganization
      summary: >
        The Organization, with its open incident freeze (capability
        organizations.incident-freeze), or null. Readable while frozen.
      parameters: [{ $ref: "#/components/parameters/org" }]
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Organization"
                  - type: object
                    required: [incidentFreeze]
                    properties:
                      incidentFreeze:
                        oneOf:
                          - $ref: "#/components/schemas/IncidentFreeze"
                          - type: "null"
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [organizations]
      operationId: renameOrganization
      summary: >
        Rename an organization's display name (capability
        organizations.rename). The name is trimmed. The slug, which the CLI,
        URLs, and configuration use, does not change. The audit event
        organization.renamed records the previous and the new name.
        Requires organization.manage; existence-hiding.
      parameters: [{ $ref: "#/components/parameters/org" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: 1 to 200 characters once surrounding whitespace is trimmed.
      responses:
        "200":
          description: Renamed organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/config-items:
    get:
      tags: [search]
      operationId: searchConfigItems
      summary: >
        Search Config Item names across the organization (capability
        search.items, ADR-0030). Matches names only — Values, value-derived
        hashes, and Secret Material never participate in matching. Candidate
        Environments are established from the caller's config.metadata.read
        entitlement before matching; a hit the caller may not see is
        indistinguishable from no hit, and hidden candidates never affect
        counts, page boundaries, or cursors. Matching is case-insensitive
        literal substring; %, _, whitespace, and every other character are
        literal. Results group by (project, exact item name), ordered by
        Project slug, item name, Project ID. Pagination is a live view:
        every page re-evaluates current permissions.
      parameters:
        - $ref: "#/components/parameters/org"
        - name: q
          in: query
          required: true
          description: Literal substring to match; empty queries are rejected, never list-all.
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: limit
          in: query
          description: Counts grouped (project, item name) results.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Matching Config Items visible to the caller
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ConfigItemSearchResult" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects:
    get:
      tags: [projects]
      operationId: listProjects
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [projects]
      operationId: createProject
      parameters: [{ $ref: "#/components/parameters/org" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, contractAuthority]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                slug: { $ref: "#/components/schemas/Slug" }
                contractAuthority: { $ref: "#/components/schemas/ContractAuthority" }
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}:
    get:
      tags: [projects]
      operationId: getProject
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [projects]
      operationId: renameProject
      summary: >
        Rename a project's display name (capability projects.rename). The
        slug, which the CLI, URLs, contracts and grants use, does not change.
        The audit event project.renamed records the previous and the new
        name. Requires project.manage; existence-hiding.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Renamed project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: >
        Delete a project (capability projects.delete, ADR-0051). Requires
        project.manage, as deleting a root environment does; it now also
        permits erasing all of the project's history, without reveal
        authority. Existence-hiding.
      description: >
        One transaction tombstones the project and every environment, erases
        every value version of the project from the live database (payload
        and wrapped key; versions of environments and values deleted earlier
        included), clears current and retiring version pointers, revokes the
        environments' Capabilities and the project's Sync Targets (stopping
        a push in progress and releasing their destination claims), and
        removes Teams' links to it. The audit event project.deleted records
        the counts. Contract Revisions stay with the tombstone, and audit
        events keep their IDs and names. The slug can be used again; a new
        project with it inherits no Grants that named the old one.
        Afterwards the project is not found anywhere but in audit. Not
        reached by deletion: PostgreSQL's old row versions and write-ahead
        log for a while, backups taken before, values pushed to platforms,
        and copies made by people.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [projectId, slug, environments, values, versionsErased, capabilitiesRevoked, targetsRevoked, teamLinksRemoved]
                properties:
                  projectId: { type: string }
                  slug: { type: string }
                  environments: { type: integer, description: Live environments tombstoned }
                  values: { type: integer }
                  versionsErased: { type: integer }
                  capabilitiesRevoked: { type: integer }
                  targetsRevoked: { type: integer }
                  teamLinksRemoved: { type: integer }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments:
    get:
      tags: [environments]
      operationId: listEnvironments
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Environments
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Environment" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [environments]
      operationId: createEnvironment
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { $ref: "#/components/schemas/EnvironmentName" }
                tier:
                  description: Required for root environments; forbidden for derived (inherited).
                  $ref: "#/components/schemas/Tier"
                kind:
                  $ref: "#/components/schemas/EnvironmentKind"
                parentEnvironmentId:
                  description: Present for derived environments (one level only).
                  type: string
                expiresAt:
                  description: Preview environments only.
                  type: string
                  format: date-time
      responses:
        "201":
          description: Created environment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}:
    get:
      tags: [environments]
      operationId: getEnvironment
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
      responses:
        "200":
          description: Environment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [environments]
      operationId: deleteEnvironment
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/values/{item}:
    put:
      tags: [values]
      operationId: setValue
      summary: Create a new immutable Value version for a Config Item in this environment
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
        - $ref: "#/components/parameters/item"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string }
                expectedVersionId:
                  description: Optimistic concurrency; rejects stale writes with VERSION_CONFLICT.
                  type: string
      responses:
        "200":
          description: New version metadata (never echoes the value)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValueVersion" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [values]
      operationId: deleteValue
      summary: Remove the Config Item's value from this environment (versions retained per audit rules)
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
        - $ref: "#/components/parameters/item"
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/values/{item}/rotations:
    post:
      tags: [values]
      operationId: beginRotation
      summary: >
        Begin a dual-phase rotation (capability values.rotation, ADR-0027):
        write a new primary version and keep the prior value retrievable
        alongside it for a bounded grace window, so running consumers migrate
        without an outage. Reads resolve the primary; the retiring value is
        exposed only through explicit disclosure and capability exercise.
        Rejected with ROTATION_IN_PROGRESS if one is already active.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
        - $ref: "#/components/parameters/item"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string }
                expectedVersionId:
                  description: Optimistic concurrency against the current primary.
                  type: string
                graceSeconds:
                  description: >
                    Overlap window; clamped to [1, 2592000] and defaulted from
                    the contract's per-item rotationGraceSeconds, else 24h.
                  type: integer
                  minimum: 1
                  maximum: 2592000
      responses:
        "201":
          description: Rotation started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValueRotation" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/values/{item}/rotations/complete:
    post:
      tags: [values]
      operationId: completeRotation
      summary: >
        Complete a rotation early (ADR-0027): drop the retiring value so the
        old upstream credential can be revoked. Idempotent — a no-op success
        when the item is not rotating (an elapsed deadline already retired it).
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
        - $ref: "#/components/parameters/item"
      responses:
        "200":
          description: Rotation completed (or already stable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValueRotation" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/effective-configuration:
    get:
      tags: [values]
      operationId: getEffectiveConfiguration
      summary: >
        Bulk-resolve the Effective Configuration (child overrides over parent
        values). With include=values, plaintext is returned for items the caller
        is authorized for (config.value.read for non-sensitive, secret.reveal
        for Secrets) and every disclosure is audited before material is
        returned. Values may reference sibling items as ${NAME} (capability
        values.references): references are expanded server-side using only
        values the caller receives in the same response; anything else stays
        a literal ${NAME}. $${NAME} escapes to a literal ${NAME}.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
        - name: include
          in: query
          schema: { type: string, enum: [metadata, values] }
        - name: purpose
          in: query
          description: >
            Why values are read, recorded as `purpose` in the `value.disclosed`
            audit event. `export`: read for an env file (capability
            `disclosure.purpose.export`). Any other value is refused with
            VALIDATION_FAILED.
          schema: { $ref: "#/components/schemas/DisclosurePurpose" }
      responses:
        "200":
          description: Effective configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EffectiveConfiguration" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/retrievals:
    post:
      tags: [values]
      operationId: strictRetrieval
      summary: >
        Strict retrieval (capability retrieval.strict): the non-sensitive
        values (config.value.read) and every Secret (secret.reveal) this
        caller may receive, the state manifest and its digest, the caller
        view, the active Contract (contract.read), and the validation of
        exactly the values returned, all from one database snapshot, in one
        response. Requires config.metadata.read. Each class is authorized
        separately: a denied class is reported in callerView.withheld, not an
        error. Every decryption follows an audit commit naming its version.
        Any failure after the snapshot returns an error and no values. Never
        cacheable.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [strict, preflight]
                  description: >
                    preflight (capability retrieval.preflight) returns the
                    non-sensitive values and a verdict per Secret, never a
                    Secret value. Each Secret decryption is audited first as
                    secret.validated with purpose preflight-validation.
      responses:
        "200":
          description: The captured state and the values delivered from it (Cache-Control no-store)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrictRetrieval" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/disclosures:
    post:
      tags: [values]
      operationId: discloseSecrets
      summary: >
        Explicit Secret disclosure (capability secrets.requested-disclosure).
        The request declares its items or an intentional all-authorized scope;
        one audit event enumerates exactly what was returned. Responses are
        never cacheable. ${NAME} references inside disclosed Secrets are
        expanded server-side (capability values.references) from other
        Secrets disclosed in the same call and — only when the caller also
        holds config.value.read — from the environment's non-sensitive
        values, each such expansion audited; unauthorized or unknown
        references stay literal. An optional purpose (capability
        secrets.disclosure-purpose) is recorded in the disclosure's audit
        events and changes nothing else.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [items]
                  properties:
                    items:
                      type: array
                      minItems: 1
                      items: { type: string }
                    purpose: { $ref: "#/components/schemas/DisclosurePurpose" }
                - type: object
                  required: [scope]
                  properties:
                    scope: { type: string, enum: [all-authorized-secrets] }
                    purpose: { $ref: "#/components/schemas/DisclosurePurpose" }
      responses:
        "200":
          description: Disclosed Secret values (Cache-Control no-store)
          content:
            application/json:
              schema:
                type: object
                required: [items, withheld]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [name, versionId, value]
                      properties:
                        name: { type: string }
                        versionId: { type: string }
                        value: { type: string }
                        retiring:
                          description: >
                            The previous value during a dual-phase rotation
                            (ADR-0027), still valid — accept either during the
                            window. Absent when the item is stable.
                          type: object
                          required: [versionId, value]
                          properties:
                            versionId: { type: string }
                            value: { type: string }
                  withheld:
                    type: array
                    items: { type: string }
                  manifest:
                    $ref: "#/components/schemas/StateManifest"
                    description: Present when the caller also holds config.metadata.read.
                  stateDigest: { $ref: "#/components/schemas/StateDigest" }
                  callerView: { $ref: "#/components/schemas/CallerView" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/capabilities:
    post:
      tags: [capabilities]
      operationId: issueCapability
      summary: >
        Issue a Capability (capability capabilities.broker, ADR-0022). Broker
        identities only. Issuance narrows potential future use and never
        expands the Agent's Grants; the capability secret is returned exactly
        once. Responses are never cacheable.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentIdentityId, items, destinations, targets, ttlSeconds]
              properties:
                agentIdentityId: { type: string }
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string }
                destinations:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: string }
                targets:
                  type: object
                  description: >
                    Required (capability capabilities.targets). For every item,
                    1 to 4 substitution targets: header:<name> (never a
                    transport-owned header such as Host, Content-Length,
                    Transfer-Encoding, Content-Type, or connection and proxy
                    headers), query:<name>, json:<RFC 6901 pointer>, or
                    form:<name>. Recorded immutably on the Capability; the
                    Broker substitutes a Placeholder only at its targets.
                  additionalProperties:
                    type: array
                    minItems: 1
                    maxItems: 4
                    items: { type: string }
                ttlSeconds: { type: integer, minimum: 1 }
                runId: { type: string, maxLength: 200 }
                precondition:
                  type: object
                  description: >
                    Agent-safe strict preflight (capability retrieval.preflight):
                    the state a preflight strict retrieval saw. Issuance compares
                    it in its own snapshot, without decrypting anything, and
                    refuses with STATE_CHANGED (details.categories names only
                    what changed) when it differs. It confers no authority.
                  required: [projectId, environmentId, stateDigest, stateDigests]
                  properties:
                    projectId: { type: string }
                    environmentId: { type: string }
                    stateDigest: { $ref: "#/components/schemas/StateDigest" }
                    stateDigests: { $ref: "#/components/schemas/StateDigests" }
      responses:
        "201":
          description: Issued Capability with its one-time secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedCapability" }
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [capabilities]
      operationId: listCapabilities
      summary: >
        List Capabilities for this environment. Brokers see their own;
        callers with policy.read see all.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Capability" }
                  nextCursor: { type: [string, "null"] }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/capabilities/{capability}:
    delete:
      tags: [capabilities]
      operationId: revokeCapability
      summary: >
        Revoke a Capability. The issuing Broker may revoke its own; callers
        with policy.manage may revoke any. Takes effect on the next exercise.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
        - name: capability
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/capabilities/{capability}/exercises:
    post:
      tags: [capabilities]
      operationId: exerciseCapability
      summary: >
        Exercise a Capability (ADR-0022). Requires the issuing Broker's
        bearer plus the capability secret; the Agent's secret.use is
        evaluated against current state (including Tailnet Requirements on
        this request), current Value versions are resolved, and the exercise
        is audited before decryption. ${NAME} references inside exercised
        material are expanded strictly (ADR-0026): referenced Secrets must
        be named in the Capability, non-sensitive references require the
        Agent's config.value.read (audited), and any unresolvable reference
        denies the exercise (reason unresolved-reference) rather than
        injecting literal ${NAME} upstream — $${NAME} escapes. Responses
        are never cacheable and go to the Broker only.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
        - name: capability
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capabilitySecret, destination]
              properties:
                capabilitySecret: { type: string }
                destination:
                  type: object
                  required: [host, port]
                  properties:
                    host: { type: string }
                    port: { type: integer, minimum: 1, maximum: 65535 }
                placements:
                  type: array
                  description: >
                    Each substitution the Broker will make, as an item and one
                    of its recorded targets. Only these items are returned;
                    references inside them still resolve against the other
                    Secrets on the Capability, each dependency audited before
                    it is decrypted. A Capability without targets (issued
                    before they were required) is refused with reason
                    capability-without-targets; a placement the Capability
                    does not hold with placement-not-targeted.
                  items:
                    type: object
                    required: [item, target]
                    properties:
                      item: { type: string }
                      target: { type: string }
      responses:
        "200":
          description: Exercised secret material (Cache-Control no-store)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityExercise" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/changes:
    post:
      tags: [values]
      operationId: applyChangeSet
      summary: >
        Atomic value change set (capability values.changeset): all
        expected-version guards validate before mutation; any conflict rejects
        the entire set with VERSION_CONFLICT. Supports Idempotency-Key.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    oneOf:
                      - type: object
                        required: [op, item, value]
                        properties:
                          op: { type: string, enum: [set] }
                          item: { type: string }
                          value: { type: string }
                          expectedVersionId: { type: string }
                      - type: object
                        required: [op, item]
                        properties:
                          op: { type: string, enum: [delete] }
                          item: { type: string }
                          expectedVersionId: { type: string }
      responses:
        "200":
          description: Applied change set
          content:
            application/json:
              schema:
                type: object
                required: [changeSetId, results]
                properties:
                  changeSetId: { type: string }
                  results:
                    type: array
                    items:
                      type: object
                      required: [item, op, versionId]
                      properties:
                        item: { type: string }
                        op: { type: string, enum: [set, delete] }
                        versionId: { type: [string, "null"] }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/environments/{environment}/validate:
    post:
      tags: [environments]
      operationId: validateEnvironment
      summary: Validate the Effective Configuration against the active Contract
      description: >
        Requires environment.read. Verdicts are value-derived, so each item is
        evaluated only if the caller may read what the verdict describes:
        presence of stored values needs config.metadata.read, verdicts on
        non-sensitive values need config.value.read, and verdicts on Secrets
        need secret.reveal including its Requirements (e.g. Tailnet
        Constraints). Anything else is reported in notEvaluated with an
        authorization-derived reason and never affects valid, missing, or
        invalid. valid is true only when complete is true. Values are
        validated in the form `varlatch run` delivers them to this caller,
        with references expanded; a value that would keep a reference
        literal gets no type verdict and is reported in unresolved. Every
        decryption for validation, including values read only to expand
        references, is audited before it happens (secret.validated /
        value.validated, naming item versions); verdicts are never audited.
        Responses are never cacheable.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/environment"
      responses:
        "200":
          description: Validation report (validity is reported, never blocks retrieval by default)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationReport" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/contract:
    get:
      tags: [contracts]
      operationId: getActiveContract
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
      responses:
        "200":
          description: The active Contract revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractRevision" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/contract/revisions:
    post:
      tags: [contracts]
      operationId: pushContractRevision
      summary: Submit a candidate Contract revision (content-hash idempotent; never activates implicitly)
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contract]
              properties:
                contract:
                  description: >
                    Canonical Configuration Contract (see @varlatch/contract).
                    A `semanticsVersion` in it pins that version, which must
                    be one the server lists in `/v1/meta`. Without one, the
                    revision keeps the active revision's version, or gets the
                    newest version when the project has no active revision.
                  type: object
                provenance:
                  type: object
                  properties:
                    repository: { type: string }
                    commitSha: { type: string }
                    schemaPath: { type: string }
                    adapterVersion: { type: string }
      responses:
        "201":
          description: Stored (or deduplicated) revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractRevision" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/contract/revisions/{revision}:
    get:
      tags: [contracts]
      operationId: getContractRevision
      summary: >
        One stored Contract revision by ID, active or not (capability
        contracts.revision-by-id). Needs contract.read. Revisions are
        immutable and contain no values; the content hash identifies both the
        items and the semantics version.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - name: revision
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractRevision" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/projects/{project}/contract/revisions/{revision}/activate:
    post:
      tags: [contracts]
      operationId: activateContractRevision
      summary: Activate a stored revision (distinct authorization from push; audited with semantic diff)
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/project"
        - name: revision
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Now-active revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractRevision" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/identities:
    get:
      tags: [identities]
      operationId: listIdentities
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Identities in the organization
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Identity" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [identities]
      operationId: createServiceIdentity
      summary: >
        Create a machine identity (starts with zero Grants). A service,
        workload or broker identity gets its first credential. While the
        Organization enforces credential-lifetime (capability
        security.enforce.credential-lifetime, ADR-0054), that credential
        gets the Organization's defaultTtlSeconds when no
        credentialTtlSeconds is given, and a credentialTtlSeconds above its
        maxTtlSeconds is refused with CREDENTIAL_LIFETIME_EXCEEDED before
        anything is created. A ci or agent identity gets no credential and
        is never affected.
      parameters: [{ $ref: "#/components/parameters/org" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                kind:
                  type: string
                  enum: [service, workload, ci, broker, agent]
                credentialTtlSeconds:
                  type: integer
                  minimum: 1
                  maximum: 315360000
                  description: >
                    Optional wall-clock lifetime for the issued service
                    credential. Absent means no expiry (revocation only),
                    or the Organization's default lifetime while it
                    enforces credential-lifetime.
                credentialMaxUses:
                  type: integer
                  minimum: 1
                  maximum: 1000000
                  description: >
                    Optional use budget for the issued service credential;
                    each authenticated request consumes one use and the
                    credential stops authenticating once spent. 1 yields a
                    one-shot token. Absent means unlimited.
      responses:
        "201":
          description: >
            Created identity. If a service credential was issued it is returned
            exactly once and never retrievable again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedIdentity" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/identities/{identity}/credentials:
    get:
      tags: [identities]
      operationId: listIdentityCredentials
      summary: >
        List a machine identity's credentials — metadata only (capability
        identity.lifecycle, ADR-0034). Token material is unrecoverable by
        construction and never returned. Requires identity.manage;
        existence-hiding.
      parameters:
        - $ref: "#/components/parameters/org"
        - name: identity
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Credential metadata for the identity
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CredentialMetadata" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [identities]
      operationId: issueIdentityCredential
      summary: >
        Issue a credential for a machine identity. Two disjoint paths, chosen
        by the caller's kind; the token is returned exactly once. An in-org
        Broker mints a short-lived read-only agent-run credential for an
        Agent Identity (capability credentials.agent, ADR-0023); requests
        authenticated with one are refused for every non-read operation at
        the HTTP layer, and a Broker reaches no other identity. Any other
        principal with identity.manage issues a service credential for an
        in-org service, workload, or broker identity that is not retired
        (capability identity.credentials.issue): another credential for a
        program sharing the identity, the first one after reactivation, or
        the new half of a rotation. Human, ci, agent, retired, and other
        organizations' identities are existence-hidden. While the
        Organization enforces credential-lifetime (capability
        security.enforce.credential-lifetime, ADR-0054), a service credential
        without ttlSeconds gets the Organization's defaultTtlSeconds, and a
        ttlSeconds above its maxTtlSeconds is refused with
        CREDENTIAL_LIFETIME_EXCEEDED; nothing is issued. Agent-run
        credentials keep their own cap and are not affected.
      parameters:
        - $ref: "#/components/parameters/org"
        - name: identity
          in: path
          required: true
          description: Machine identity ID (an Agent Identity on the Broker path)
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  description: Broker path (credentials.agent).
                  required: [ttlSeconds]
                  properties:
                    ttlSeconds: { type: integer, minimum: 1, maximum: 3600 }
                    runId: { type: string, maxLength: 200 }
                - $ref: "#/components/schemas/MachineCredentialRequest"
      responses:
        "201":
          description: Issued credential (Cache-Control no-store)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/IssuedAgentCredential"
                  - $ref: "#/components/schemas/IssuedMachineCredential"
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/security/credential-review:
    get:
      tags: [identities]
      operationId: credentialReview
      summary: >
        The Organization's machine credentials worth a look (capability
        security.credential-review, ADR-0054 Decision 8): never used, not
        used for idleDays (30) days, or without expiry, each with its
        identity and last use. Reviewed are the credentials of machine
        identities (every kind but human) that are not revoked, not expired
        and whose use budget is not spent; OIDC exchange and agent-run
        credentials are left out, since they expire within an hour by
        construction. Reporting only: it changes no authorization and
        nothing is retired automatically. Metadata only, never a token or a
        hash. Needs identity.manage, like listing an identity's credentials;
        existence-hiding. Returned whole, never paginated.
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: The review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialReview" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/security/controls:
    get:
      tags: [organizations]
      operationId: listSecurityControls
      summary: >
        The Organization's Security Controls (capability security.controls,
        ADR-0054 Decision 1): each of requirement-protection, admin-step-up,
        passkey-verification and credential-lifetime with its mode, its
        configuration, its version and who changed it last. A control
        nobody has changed is off at version 0. availableModes lists the
        modes this server accepts for every control; each item's
        availableModes, the modes it accepts for that control (enforce only
        for a control this release can enforce, also advertised as the
        capability security.enforce.<control>). Needs organization.read;
        existence-hiding.
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: The controls
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityControlList" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/security/control-report:
    get:
      tags: [organizations]
      operationId: securityControlReport
      summary: >
        What the Security Controls in report mode counted (capability
        security.report, ADR-0054 Decision 9). For each control: its mode
        and version, the counts of the last `days` days, the current hour's
        live counts, the counts not yet summarized in the audit log, and
        entries per configuration version, operation, reason and actor,
        with their counts and first and last times. Counting refuses and
        changes nothing. A write is counted only when it committed and
        changed something, an access only when it was authorized and
        succeeded; access counts are best-effort, made after the response
        and dropped when they cannot be made quickly. Summaries are
        written to the audit log as security_control.would_block once an
        hour has been over for 10 minutes; counts are kept 35 days after
        their summary. Fixed fields only: never a request body, URL, token,
        hash or value, and no target. It names who did what, so it needs
        organization.manage; existence-hiding. Never cached.
      parameters:
        - $ref: "#/components/parameters/org"
        - name: days
          in: query
          required: false
          description: The window, in days back from now (whole hours). 30 when absent.
          schema: { type: integer, minimum: 1, maximum: 30 }
      responses:
        "200":
          description: The counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityControlReport" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/me/permissions:
    get:
      tags: [organizations]
      operationId: myOrganizationPermissions
      summary: >
        The caller's own organization-level permissions in this Organization
        (capability organizations.permissions): the caller's role, and which
        of the organization-scoped actions (organization.read,
        organization.manage, project.read, project.manage, identity.read,
        identity.manage, policy.read, policy.manage, audit.read) their role
        and organization-wide Grants allow. Grants on a project or an
        environment are not counted; value and environment actions are not
        listed. The authorization outcome only: no Grant ids or other data.
        Clients use it to show only what the caller may read. Needs
        organization.read; existence-hiding. Never cached.
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: The caller's permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationPermissions" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/security/refused-destinations:
    get:
      tags: [organizations]
      operationId: refusedDestinations
      summary: >
        The Organization's configured destinations that this installation's
        outbound policy refuses (capability security.refused-destinations,
        ADR-0057 Decision 8): webhooks, Coolify and Convex Connections and
        OIDC issuers, each with its kind, name, host, port and reason, and
        since when refusals of it are recorded. Checked when asked, with
        DNS lookups only. Private destinations are allowed by the host
        operator (VARLATCH_OUTBOUND_ALLOW on the host), never through the
        API. Nothing waiting is lost: deliveries catch up once the host
        allows the destination. `unresolved` counts destinations whose
        names did not resolve, which could not be checked. A check is
        shared by concurrent requests and reused for up to 30 seconds. Never
        a resolved address, a path, a query or a credential, and never the
        host's allow list. Needs
        organization.manage; existence-hiding. Never cached.
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: The refused destinations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefusedDestinations" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/security/approval-keys:
    get:
      tags: [organizations]
      operationId: securityApprovalKeys
      summary: >
        The approval keys of the Organization's admins (capability
        security.approval-keys, ADR-0054 Decisions 4 and 11): for each live
        admin, how many of their passkeys are trusted and how many
        unconfirmed, when one was last confirmed, and each passkey's name,
        provenance and dates. Only a trusted passkey can give a step-up
        approval. Never a passkey's credential id, public key or counter,
        and no passkey ids. Read-only. Needs organization.manage;
        existence-hiding. Never cached.
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: The admins and their approval keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalKeys" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/security/controls/{control}:
    patch:
      tags: [organizations]
      operationId: changeSecurityControl
      summary: >
        Change one Security Control (capability security.controls, ADR-0054
        Decision 2). Needs organization.manage and a person's credential
        (browser or cli): machine credentials are always refused. The change
        is compared field by field with the current state: it is loosening
        when the mode moves towards off, a lifetime grows, or configuration
        is cleared, even alongside tightening. Loosening needs a step-up
        approval bound to this exact change: without the Varlatch-Approval
        header the answer is STEP_UP_REQUIRED with details.approval (its id,
        approval URL and expiry); the client repeats the identical request
        with the header once the person approved. Tightening needs none.
        expectedVersion must be the control's current version
        (VERSION_CONFLICT otherwise). enforce is accepted only for a control
        this server can enforce (capability security.enforce.<control>; the
        control's availableModes), and refused with CONTROL_MODE_UNAVAILABLE
        for the others; setting it is tightening. Setting
        passkey-verification to enforce from a sign-in it would refuse is
        refused with PASSKEY_VERIFICATION_REQUIRED (details.change "refused")
        and changes nothing. Refused while the Organization is being deleted.
        Records security_control.changed with metadata.loosened. While the
        Organization enforces passkey-verification (capability
        security.enforce.passkey-verification, ADR-0054 Decision 7), every
        /v1/organizations/{org} route answers a person's browser or cli
        credential whose sign-in was not made with a trusted passkey that
        verified them with 403 PASSKEY_VERIFICATION_REQUIRED (details:
        control, reason no-evidence, not-user-verified or untrusted-passkey),
        in place of an answer that would have allowed the request; every
        other refusal, not-found included, comes first. Machine credentials
        are never affected.
      parameters:
        - $ref: "#/components/parameters/org"
        - name: control
          in: path
          required: true
          schema: { $ref: "#/components/schemas/SecurityControlName" }
        - $ref: "#/components/parameters/approvalHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecurityControlChangeInput" }
      responses:
        "200":
          description: The control after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityControlChange" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/identities/{identity}/credentials/{credential}:
    delete:
      tags: [identities]
      operationId: revokeIdentityCredential
      summary: >
        Revoke a machine identity's credential. Two disjoint authorization
        paths: an in-org Broker may revoke agent-run credentials of in-org
        agents (ADR-0023); a principal with identity.manage may revoke
        service/oidc credentials of in-org machine identities (ADR-0034 §1,
        capability identity.lifecycle). cli/browser credentials are managed
        under /me/credentials only. A principal may revoke the credential it
        is currently authenticated with. Existence-hiding.
      parameters:
        - $ref: "#/components/parameters/org"
        - name: identity
          in: path
          required: true
          description: Agent Identity ID
          schema: { type: string }
        - name: credential
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/identities/{identity}:
    patch:
      tags: [identities]
      operationId: renameIdentity
      summary: >
        Rename a machine identity (capability identity.lifecycle, ADR-0034
        §4). Display-plane only: grants, credentials, OIDC bindings, and
        tailnet requirements reference the identity id and are unaffected.
        The audit event records both the previous and the new name. Requires
        identity.manage; machine kinds only; existence-hiding.
      parameters:
        - $ref: "#/components/parameters/org"
        - name: identity
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Renamed identity
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                properties:
                  id: { type: string }
                  name: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/identities/{identity}/retire:
    post:
      tags: [identities]
      operationId: retireIdentity
      summary: >
        Retire a machine identity (capability identity.lifecycle, ADR-0034
        §3): sets disabled and revokes every unrevoked credential in the same
        transaction. There is deliberately no DELETE — identities are audit
        actors and remain listable forever. Requires identity.manage; machine
        kinds only; existence-hiding.
      parameters:
        - $ref: "#/components/parameters/org"
        - name: identity
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Retired identity
          content:
            application/json:
              schema:
                type: object
                required: [id, disabled]
                properties:
                  id: { type: string }
                  disabled: { type: boolean }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/identities/{identity}/reactivate:
    post:
      tags: [identities]
      operationId: reactivateIdentity
      summary: >
        Reactivate a retired machine identity (ADR-0034 §3). Clears the
        disabled flag only — a reactivated identity has zero working
        credentials until an admin deliberately issues one. Requires
        identity.manage; machine kinds only; existence-hiding.
      parameters:
        - $ref: "#/components/parameters/org"
        - name: identity
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Reactivated identity
          content:
            application/json:
              schema:
                type: object
                required: [id, disabled]
                properties:
                  id: { type: string }
                  disabled: { type: boolean }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/identities/{identity}/reach:
    get:
      tags: [identities]
      operationId: machineReach
      summary: >
        What a machine identity can reach (capability identity.reach,
        ADR-0054 Decision 8): its state, and per Project and Environment the
        actions its Grants allow (direct, through Groups, Roles and Teams),
        each with the Tailnet Requirements that would constrain it as
        conditions. Requirements are never evaluated here: there is no
        request, so an action they constrain is conditional, never denied.
        A derived Environment is decided with its root, so Grants and
        Requirements on the root cover it. Computed on request, never
        stored; it changes no authorization. Needs identity.read and
        policy.read; existence-hiding. Another Organization's machine is
        RESOURCE_NOT_FOUND; a person of this Organization is
        VALIDATION_FAILED (details.reason human-identity): their view is the
        exposure report.
      parameters:
        - $ref: "#/components/parameters/org"
        - name: identity
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The machine's reach
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachineReach" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/identities/{identity}/oidc-bindings:
    get:
      tags: [identities]
      operationId: listOidcBindings
      summary: List a machine identity's active OIDC bindings
      parameters:
        - $ref: "#/components/parameters/org"
        - name: identity
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Active bindings
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OidcBinding" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [identities]
      operationId: createOidcBinding
      summary: >
        Bind an external OIDC issuer + audience + subject (and optional
        exact-match claims) to a machine identity (capability auth.oidc).
        A binding is an Authentication Method: exchanging a matching
        verified token establishes identity only — authority remains the
        identity's Grants, evaluated per request. Subject matches exactly,
        or by prefix when it ends with '*'.
      parameters:
        - $ref: "#/components/parameters/org"
        - name: identity
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuer, audience, subject]
              properties:
                issuer: { type: string, minLength: 1, maxLength: 2000 }
                audience: { type: string, minLength: 1, maxLength: 2000 }
                subject: { type: string, minLength: 1, maxLength: 2000 }
                claims:
                  type: object
                  additionalProperties: { type: string, maxLength: 2000 }
                  description: Additional token claims that must match exactly.
      responses:
        "201":
          description: Created binding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OidcBinding" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/identities/{identity}/oidc-bindings/{binding}:
    delete:
      tags: [identities]
      operationId: revokeOidcBinding
      summary: Revoke an OIDC binding; matching tokens stop exchanging immediately
      parameters:
        - $ref: "#/components/parameters/org"
        - name: identity
          in: path
          required: true
          schema: { type: string }
        - name: binding
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Error" }

  /oidc/token:
    post:
      tags: [identities]
      operationId: exchangeOidcToken
      security: []
      summary: >
        Exchange a platform-issued OIDC token (e.g. GitHub Actions) for a
        short-lived Varlatch credential (capability auth.oidc). The token is
        verified against the issuer's published JWKS and matched to a
        registered binding; all failures collapse to INVALID_CREDENTIAL.
        The minted credential is returned exactly once; TTL defaults to 600
        and is capped at 3600 seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, organization]
              properties:
                organization: { type: string, minLength: 1, description: Target organization ID or slug }
                token: { type: string, minLength: 1 }
                ttlSeconds: { type: integer, minimum: 1, maximum: 3600 }
      responses:
        "201":
          description: Issued oidc credential (Cache-Control no-store)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedOidcCredential" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/invitations:
    get:
      tags: [identities]
      operationId: listInvitations
      summary: >
        List the organization's invitations, newest first by creation time
        and ID (capability invitations.manage). Only pending invitations
        unless status is all. Never returns an invitation's token or
        anything derived from it. Requires identity.manage, like creating
        one; existence-hiding.
      parameters:
        - $ref: "#/components/parameters/org"
        - name: status
          in: query
          description: >
            pending (the default) lists invitations that can still be
            accepted; all adds consumed, expired, and revoked ones.
          schema: { type: string, enum: [pending, all], default: pending }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Invitations, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [identities]
      operationId: createInvitation
      summary: >
        Mint a one-time human enrollment invitation. The caller composes the
        browser URL as <dashboard-origin>/enroll#<token>; the invitee enrolls
        a passkey on their own device — no shared secret ever exists.
      parameters: [{ $ref: "#/components/parameters/org" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                role: { type: string, enum: [admin, member] }
      responses:
        "201":
          description: One-time invitation token (shown exactly once)
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt]
                properties:
                  id:
                    type: string
                    description: >
                      The invitation's ID, as listed and revoked (absent on
                      servers without invitations.manage).
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/invitations/{invitation}:
    delete:
      tags: [identities]
      operationId: revokeInvitation
      summary: >
        Revoke a pending invitation (capability invitations.manage). Its
        token stops working at once, also for an enrollment already started
        with it. The audit event invitation.revoked records it. An
        invitation that is consumed, expired, or already revoked is refused
        with VERSION_CONFLICT, its status in details.status. Requires
        identity.manage; existence-hiding.
      parameters:
        - $ref: "#/components/parameters/org"
        - { name: invitation, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/deletion:
    get:
      tags: [organizations]
      operationId: getOrganizationDeletion
      summary: >
        The Organization's open deletion request, or null (capability
        organizations.delete, ADR-0051). Requires organization.read.
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: The open request, or null
          content:
            application/json:
              schema:
                type: object
                required: [deletion]
                properties:
                  deletion:
                    oneOf:
                      - $ref: "#/components/schemas/OrganizationDeletion"
                      - type: "null"
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [organizations]
      operationId: scheduleOrganizationDeletion
      summary: >
        Schedule the Organization's deletion (capability
        organizations.delete, ADR-0051 Decisions 4 to 6). Needs a live
        built-in admin membership; an explicit Grant does not substitute.
      description: >
        The deletion may run afterDays (1 to 30, default 7) days after
        scheduling, at the earliest; downtime can delay it. When the
        Organization has more than one admin, a different admin must approve
        it. Scheduling freezes the Organization: every operational write is
        refused with ORGANIZATION_DELETING (details: deletionId, runAfter)
        until the request is cancelled; reads, audit, sign-in, approval and
        cancellation still work. In the same transaction it pauses Sync
        Targets, suspends webhooks and enabled machine identities (a cancel
        restores them), revokes pending invitations and invalidates
        unfinished GitHub App registrations. Audited as
        organization.deletion_scheduled. One open request at a time
        (STATE_CHANGED otherwise).
      parameters:
        - $ref: "#/components/parameters/org"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                afterDays: { type: integer, minimum: 1, maximum: 30 }
      responses:
        "201":
          description: Scheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationDeletion" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/deletion/{deletion}/approve:
    post:
      tags: [organizations]
      operationId: approveOrganizationDeletion
      summary: >
        A second admin's approval of this request (capability
        organizations.delete): a different, enabled human with a live
        built-in admin membership. It names the request, so it cannot
        approve a later one; the approver's membership is checked again when
        the deletion runs. Audited as organization.deletion_approved.
      parameters:
        - $ref: "#/components/parameters/org"
        - { name: deletion, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationDeletion" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/deletion/{deletion}/cancel:
    post:
      tags: [organizations]
      operationId: cancelOrganizationDeletion
      summary: >
        Cancel this request (capability organizations.delete): any live
        built-in admin, until the deletion completes. The machine identities
        and webhooks it suspended come back; Sync Targets stay paused and
        revoked invitations stay revoked. Audited as
        organization.deletion_cancelled.
      parameters:
        - $ref: "#/components/parameters/org"
        - { name: deletion, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationDeletion" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/incident-freeze:
    get:
      tags: [organizations]
      operationId: getIncidentFreeze
      summary: >
        The Organization's open incident freeze, or null, the Sync Targets
        that resume pushing when it is lifted, and the last freezes
        (capability organizations.incident-freeze, ADR-0055). Requires
        organization.read. Readable while frozen.
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: The open freeze, or null
          content:
            application/json:
              schema:
                type: object
                required: [freeze, resumingTargets, history]
                properties:
                  freeze:
                    oneOf:
                      - $ref: "#/components/schemas/IncidentFreeze"
                      - type: "null"
                  resumingTargets:
                    type: [array, "null"]
                    description: >
                      The Sync Targets that resume pushing when the freeze is
                      lifted; empty when not frozen; null for a caller without
                      config.sync.manage, which listing the Targets needs.
                    items: { $ref: "#/components/schemas/ResumingTarget" }
                  history:
                    type: array
                    description: The last 20 freezes, newest first, the open one included.
                    items: { $ref: "#/components/schemas/IncidentFreeze" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [organizations]
      operationId: freezeOrganization
      summary: >
        Freeze the Organization for an incident (capability
        organizations.incident-freeze, ADR-0055). Needs organization.manage
        and a person's credential; no approval. Machine credentials never can.
      description: >
        Stops all access to the Organization at once, reads included: every
        request of its members and machines answers ORGANIZATION_FROZEN
        (HTTP 409, details: freezeId, frozenAt, Retry-After: 300) except
        reading the Organization, its members, identities, credentials,
        Grants, policy, Requirements, Security page and lists of
        Capabilities, Sync Targets, Connections and webhooks; the audit log;
        operations that only take authority away (revoking credentials,
        Capabilities, Grants, OIDC bindings and invitations, retiring
        identities, removing members or demoting admins, pausing Sync
        Targets, revoking Connections, a new Tailnet Requirement, Security
        Control changes, cancelling a pending deletion); and the lift. Sync
        Targets stop pushing and resume on the lift; webhooks keep
        delivering. Every open approval of the Organization is closed. The
        reason (1 to 200 characters) is shown to members and never recorded
        in audit. Audited as organization.frozen. One open freeze at a time
        (STATE_CHANGED otherwise).
      parameters:
        - $ref: "#/components/parameters/org"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: Frozen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentFreeze" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/incident-freeze/{freeze}/lift:
    post:
      tags: [organizations]
      operationId: liftIncidentFreeze
      summary: >
        Lift this freeze (capability organizations.incident-freeze,
        ADR-0055). Needs organization.manage, a person's credential and,
        always, a step-up approval with a trusted passkey bound to this
        freeze: without the Varlatch-Approval header it answers
        STEP_UP_REQUIRED with the approval to give. Any admin may lift.
      description: >
        Lifting undoes nothing done during the freeze. Sync Targets that
        were not paused or revoked meanwhile resume pushing; the approval's
        summary and the answer list them. A pending deletion stays pending.
        Audited as organization.unfrozen (metadata.method approval). The
        host operator can also lift with varlatchd admin unfreeze.
      parameters:
        - $ref: "#/components/parameters/org"
        - { name: freeze, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/approvalHeader"
      responses:
        "200":
          description: Lifted
          content:
            application/json:
              schema:
                type: object
                required: [freeze, resumingTargets]
                properties:
                  freeze: { $ref: "#/components/schemas/IncidentFreeze" }
                  resumingTargets:
                    type: [array, "null"]
                    description: Null for a caller without config.sync.manage; the approval's summary then gives their number only.
                    items: { $ref: "#/components/schemas/ResumingTarget" }
        default: { $ref: "#/components/responses/Error" }

  /deleted-organizations/{organization}/audit-events:
    get:
      tags: [audit]
      operationId: listDeletedOrganizationAuditEvents
      summary: >
        A deleted Organization's audit log (capability organizations.delete,
        ADR-0051 Decision 8), for the people who held Organization-level
        audit.read when it was deleted, while their identity stays enabled
        and an Installation Admin has not removed them. Anyone else gets
        RESOURCE_NOT_FOUND. Newest first, cursor-paged.
      parameters:
        - { name: organization, in: path, required: true, schema: { type: string }, description: The deleted Organization's ID }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: A page of events
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
                  nextCursor: { type: [string, "null"] }
        default: { $ref: "#/components/responses/Error" }

  /deleted-organizations/{organization}/audit-events/export:
    get:
      tags: [audit]
      operationId: exportDeletedOrganizationAuditEvents
      summary: >
        Stream a deleted Organization's audit log as NDJSON, oldest first,
        for the same readers as the listing (ADR-0051 Decision 8). Anyone
        else gets RESOURCE_NOT_FOUND.
      parameters:
        - { name: organization, in: path, required: true, schema: { type: string }, description: The deleted Organization's ID }
      responses:
        "200":
          description: One versioned AuditEvent JSON document per line
          content:
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/AuditEvent" }
        default: { $ref: "#/components/responses/Error" }

  /installation/deleted-organizations:
    get:
      tags: [meta]
      operationId: listDeletedOrganizations
      summary: >
        Deleted Organizations and their audit readers, for Installation
        Admins (capability organizations.delete): IDs, slugs, names, deletion
        times and readers, never events.
      responses:
        "200":
          description: Deleted Organizations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, slug, name, deletedAt, readers]
                      properties:
                        id: { type: string }
                        slug: { type: string }
                        name: { type: string }
                        deletedAt: { type: string, format: date-time }
                        readers:
                          type: array
                          items:
                            type: object
                            required: [identityId, name, removedAt]
                            properties:
                              identityId: { type: string }
                              name: { type: string }
                              removedAt: { type: [string, "null"], format: date-time }
        default: { $ref: "#/components/responses/Error" }

  /installation/deleted-organizations/{organization}/readers/{identity}:
    delete:
      tags: [meta]
      operationId: removeDeletedOrganizationReader
      summary: >
        Remove a reader of a deleted Organization's audit log (Installation
        Admins; capability organizations.delete). Readers can only be
        removed, never added. Audited as audit_tombstone.reader_removed.
      parameters:
        - { name: organization, in: path, required: true, schema: { type: string } }
        - { name: identity, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/members/{member}:
    delete:
      tags: [identities]
      operationId: removeMember
      summary: >
        Remove a person from the Organization, or leave it when {member} is
        the caller or "me" (capability members.lifecycle, ADR-0052).
        Removing someone else needs a live built-in admin membership; an
        explicit Grant such as organization.manage does not substitute.
        Leaving needs only a live membership. The last admin can neither be
        removed nor leave (VALIDATION_FAILED, details.reason last-admin).
      description: >
        One serializable transaction records what the person could reach
        (per environment, the value actions their role and Grants granted,
        and the Tailnet Requirements those were conditional on), ends the
        membership, revokes their direct Grants, removes them from every
        group and team, and revokes the pending invitations they issued; the
        audit event membership.removed records the counts. Their sign-in and
        credentials are untouched: from the next request they reach nothing
        in this Organization. Nothing that belongs to the Organization
        changes; the response lists what to review. When concurrent changes
        keep invalidating the transaction it gives up with STATE_CHANGED
        (details.retryable true) having changed nothing; try again.
        Existence-hiding: a caller who cannot see the Organization gets
        RESOURCE_NOT_FOUND. Someone who is not a live member is
        RESOURCE_NOT_FOUND too.
      parameters:
        - $ref: "#/components/parameters/org"
        - { name: member, in: path, required: true, schema: { type: string }, description: An identity ID, or "me" }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberRemoval" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [identities]
      operationId: changeMemberRole
      summary: >
        Make a member an admin, or an admin a member (capability
        members.lifecycle, ADR-0052 Decision 3). Needs a live built-in admin
        membership; the last admin cannot be demoted, themselves included.
        Demotion removes the built-in admin bundle only: explicit and group
        Grants stay. The same role again changes and records nothing; a
        change is audited as membership.role_changed.
      parameters:
        - $ref: "#/components/parameters/org"
        - { name: member, in: path, required: true, schema: { type: string }, description: An identity ID, or "me" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { type: string, enum: [admin, member] }
      responses:
        "200":
          description: The member's role
          content:
            application/json:
              schema:
                type: object
                required: [identityId, role, previousRole]
                properties:
                  identityId: { type: string }
                  role: { type: string, enum: [admin, member] }
                  previousRole: { type: string, enum: [admin, member] }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/members/{member}/review:
    get:
      tags: [identities]
      operationId: reviewMember
      summary: >
        What a live member created or changed that may keep working without
        them (capability members.lifecycle, ADR-0052 Decision 4): the list a
        removal returns, before it happens. For a live built-in admin about
        any live member, and for a member about themselves.
      parameters:
        - $ref: "#/components/parameters/org"
        - { name: member, in: path, required: true, schema: { type: string }, description: An identity ID, or "me" }
      responses:
        "200":
          description: The review list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberReview" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/members/{member}/exposure:
    get:
      tags: [identities]
      operationId: memberExposure
      summary: >
        What a current or former member received, what they could reach at
        removal, and what they set up (capability members.lifecycle,
        ADR-0052 Decision 6). Needs audit.read; existence-hiding. Three kinds
        of facts, never mixed: received (observed in their own audit events:
        Secrets and values disclosed to them in any mode, and values they
        wrote; one entry per version, with the environments and ways they
        received it), authority at removal (the snapshot taken when they
        were removed, with the Tailnet Requirements it was conditional on;
        null for a current member), and indirect paths (what they created or
        changed; not evidence that they held any value). Each version says
        whether Varlatch still serves it (current, or retiring until its
        deadline), and whether an operator confirmed it revoked at its
        provider. No longer served is not safe: replacing a value does not
        revoke the old credential at its provider. Names, IDs and states
        only, never a value. Returned whole, never paginated. While older
        audit history is still being indexed, coverage names that period.
      parameters:
        - $ref: "#/components/parameters/org"
        - { name: member, in: path, required: true, schema: { type: string }, description: An identity ID, or "me" }
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExposureReport" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/members/{member}/exposure/confirmations:
    post:
      tags: [identities]
      operationId: confirmExposureRevocation
      summary: >
        Record that a version in this member's exposure was revoked or
        rotated at its provider (capability members.lifecycle, ADR-0052
        Decision 7), audited as exposure.revocation_confirmed. Needs
        config.value.write where the value lives; once the value or its
        environment is deleted, a live Organization Admin. A version not in
        the member's exposure is RESOURCE_NOT_FOUND. Once per version: a
        repeated confirmation returns the first with 200.
      parameters:
        - $ref: "#/components/parameters/org"
        - { name: member, in: path, required: true, schema: { type: string }, description: An identity ID, or "me" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [versionId]
              properties:
                versionId: { type: string }
      responses:
        "201":
          description: Confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExposureConfirmation" }
        "200":
          description: Already confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExposureConfirmation" }
        default: { $ref: "#/components/responses/Error" }

  /me:
    get:
      tags: [identities]
      operationId: whoami
      summary: >
        Who the caller is (capability identity.whoami): the identity this
        request authenticated as, its organization, the credential it
        presented, and the listener it came in on. Any authenticated caller,
        human or machine, with no Grant; it describes the caller only, never
        another identity or another credential.
      description: >
        No Security Audit Event records a successful call, as for the other
        /v1/me reads: describing the caller exercises no authority (ADR-0016).
        A refused credential (revoked, expired, spent, or of a retired
        identity) gets 401 INVALID_CREDENTIAL, and the refusal is audited as
        authentication.failed, as for every route. Like every authenticated
        request, it spends one use of a credential with a use budget.
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhoAmI" }
        default: { $ref: "#/components/responses/Error" }

  /me/profile:
    get:
      tags: [identities]
      operationId: getMyProfile
      summary: >
        The caller's own profile: display name plus the Better Auth email and
        avatar image linked to the human identity. Machine identities have no
        profile and receive RESOURCE_NOT_FOUND.
      responses:
        "200":
          description: The caller's profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [identities]
      operationId: updateMyProfile
      summary: >
        Update the caller's display name and/or avatar image. The name is
        written to both the linked Better Auth user and the Varlatch identity
        so org listings show the new name. The image must be a data:image/…
        URL or an https:// URL of at most 100KB; null clears it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                image:
                  type: [string, "null"]
                  maxLength: 102400
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        default: { $ref: "#/components/responses/Error" }

  /me/credentials:
    get:
      tags: [identities]
      operationId: listMyCredentials
      summary: >
        List the caller's own credentials (ADR-0007's individually revocable
        credentials made visible). The credential authenticating this request
        is flagged current.
      responses:
        "200":
          description: The caller's credentials, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OwnCredential" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }

  /me/credentials/{credential}:
    delete:
      tags: [identities]
      operationId: revokeMyCredential
      summary: Revoke one of the caller's own credentials; takes effect immediately
      parameters:
        - { name: credential, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Error" }

  /me/credentials/cli:
    post:
      tags: [identities]
      operationId: exchangeCliCredential
      summary: >
        Trade the short-lived browser-handoff bearer (ADR-0024) for a
        longer-lived CLI credential. Restricted to browser session bearers —
        a leaked CLI credential cannot mint successors — and one-shot: the
        presenting bearer is revoked by the exchange. The CLI credential
        keeps a link to the browser session the bearer came from, and so to
        that sign-in's record of which passkey was used.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttlSeconds: { type: integer, minimum: 60, maximum: 86400, default: 43200 }
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: Issued CLI credential (token shown exactly once; Cache-Control no-store)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedCliCredential" }
        default: { $ref: "#/components/responses/Error" }

  /me/passkeys:
    get:
      tags: [identities]
      operationId: listMyPasskeys
      summary: >
        The caller's own passkeys with their provenance (capability
        account.passkeys, ADR-0054 Decision 4): trusted (existing at the
        upgrade that introduced provenance, enrolled through a setup grant,
        or confirmed) or unconfirmed (added by a signed-in session and not
        confirmed yet). Empty for a machine identity. Never a public key or
        a credential id. Returned whole, never paginated.
      responses:
        "200":
          description: The caller's passkeys, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OwnPasskey" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }

  /me/passkeys/{passkey}:
    delete:
      tags: [identities]
      operationId: removeMyPasskey
      summary: >
        Remove one of the caller's own passkeys (capability
        account.passkeys). Replaces Better Auth's /auth/passkey/delete-passkey,
        which is turned off. Requires a human's dashboard session bearer.
        Another person's passkey, or an unknown id, is RESOURCE_NOT_FOUND.
        Removing a trusted passkey needs a step-up approval (operation
        passkey.remove, STEP_UP_REQUIRED, then the same request with the
        Varlatch-Approval header) while the person holds a live membership in
        an Organization with any Security Control at enforce (ADR-0054
        Decision 4); a control can be enforced from servers that offer
        security.enforce.<control> (requirement-protection,
        credential-lifetime). Removing an unconfirmed
        passkey never needs an approval.
      parameters:
        - { name: passkey, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/approvalHeader"
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Error" }

  /me/passkeys/{passkey}/confirmation/options:
    post:
      tags: [identities]
      operationId: startPasskeyConfirmation
      summary: >
        Start confirming one of the caller's unconfirmed passkeys with a
        trusted one (capability account.passkeys): WebAuthn request options
        listing the caller's trusted passkeys, user verification required,
        with a challenge bound to the person, their dashboard session and
        this passkey (single use; 5 minutes). Requires a human's dashboard
        session bearer. STATE_CHANGED when the passkey is already trusted;
        PERMISSION_DENIED with details.reason no-trusted-passkey when the
        caller has no trusted passkey (the host operator's admin reenroll or
        admin recover enrolls one); RATE_LIMITED with details.retryAt after
        10 starts in 10 minutes. Cache-Control no-store.
      parameters:
        - { name: passkey, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The confirmation challenge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyConfirmationOptions" }
        default: { $ref: "#/components/responses/Error" }

  /me/passkeys/{passkey}/confirmation:
    post:
      tags: [identities]
      operationId: confirmMyPasskey
      summary: >
        Confirm one of the caller's unconfirmed passkeys (capability
        account.passkeys): an assertion over the challenge
        startPasskeyConfirmation issued for this passkey and session, made
        with another, trusted passkey of the caller with user verification.
        The passkey becomes trusted (confirmed) and
        authentication.passkey_confirmed is recorded. A refused assertion
        (another person's or an unconfirmed passkey, no user verification, a
        used, expired or foreign challenge) is PERMISSION_DENIED with
        details.reason, uses up the challenge, and is recorded as
        authentication.failed. Requires a human's dashboard session bearer.
        Cache-Control no-store.
      parameters:
        - { name: passkey, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assertion]
              properties:
                assertion:
                  type: object
                  additionalProperties: true
                  description: WebAuthn authentication response (AuthenticationResponseJSON).
      responses:
        "200":
          description: The confirmed passkey
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnPasskey" }
        default: { $ref: "#/components/responses/Error" }

  /me/approvals/{approval}:
    get:
      tags: [identities]
      operationId: getApproval
      summary: >
        One of the caller's own step-up approvals (Approval Intents, capability
        security.controls, ADR-0054 Decision 3): the operation, its
        server-generated summary (never a secret value), its state and
        expiry. Only the person who asked sees it; anyone else, an
        administrator included, gets RESOURCE_NOT_FOUND. The CLI polls it
        while it waits: polls by the requesting credential closer together
        than `interval` seconds answer SLOW_DOWN with details.interval, as
        device sign-in does. Cache-Control no-store.
      parameters:
        - $ref: "#/components/parameters/approval"
      responses:
        "200":
          description: The approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        default: { $ref: "#/components/responses/Error" }

  /me/approvals/{approval}/options:
    post:
      tags: [identities]
      operationId: startApproval
      summary: >
        Start approving one of the caller's pending approvals: WebAuthn
        request options listing only the caller's trusted passkeys, user
        verification required, with a challenge bound to the approval, the
        person and their dashboard session. It expires with the approval at
        the latest and is single use. Requires the dashboard's session
        bearer of the person who asked. PERMISSION_DENIED with
        details.reason no-trusted-passkey when the caller has no trusted
        passkey; APPROVAL_INVALID with details.reason when the approval is
        no longer pending; RATE_LIMITED with details.retryAt after 20
        challenges in 10 minutes. Cache-Control no-store.
      parameters:
        - $ref: "#/components/parameters/approval"
      responses:
        "200":
          description: The approval challenge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalOptions" }
        default: { $ref: "#/components/responses/Error" }

  /me/approvals/{approval}/approve:
    post:
      tags: [identities]
      operationId: approveApproval
      summary: >
        Approve one of the caller's pending approvals with an assertion over
        the challenge startApproval issued for this approval and session,
        made with a trusted passkey of the caller, user verification
        required. The approval does not run the operation: the client that
        asked repeats it with the Varlatch-Approval header. Approving never
        extends the approval's expiry. A refused assertion uses up the
        challenge, is PERMISSION_DENIED with details.reason and is recorded
        as authentication.failed. Requires the dashboard's session bearer of
        the person who asked. Cache-Control no-store.
      parameters:
        - $ref: "#/components/parameters/approval"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assertion]
              properties:
                assertion:
                  type: object
                  additionalProperties: true
                  description: WebAuthn authentication response (AuthenticationResponseJSON).
      responses:
        "200":
          description: The approved approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        default: { $ref: "#/components/responses/Error" }

  /me/approvals/{approval}/cancel:
    post:
      tags: [identities]
      operationId: cancelApproval
      summary: >
        Cancel one of the caller's approvals that is pending or approved and
        not used yet (the dashboard's Deny, the CLI on Ctrl-C). Any
        credential of the person who asked may cancel; for anyone else it
        is RESOURCE_NOT_FOUND. Cancelling a used, expired or closed approval
        is APPROVAL_INVALID with details.reason.
      parameters:
        - $ref: "#/components/parameters/approval"
      responses:
        "200":
          description: The cancelled approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        default: { $ref: "#/components/responses/Error" }

  /auth/device:
    post:
      tags: [identities]
      operationId: startDeviceSignIn
      security: []
      summary: >
        Start a device-authorization sign-in (capability auth.device; RFC
        8628 adapted): a pending sign-in a person approves in the dashboard
        at verificationUri by typing userCode. The deviceCode is the CLI's
        bearer for collecting the credential: keep it private, never show
        it. Pending sign-ins expire after expiresIn seconds and are capped
        per client and in total (RATE_LIMITED with details.cap
        pending-per-client or pending-total). Served only when the server's
        public URL is HTTPS, or a loopback address (RESOURCE_NOT_FOUND
        otherwise). Cache-Control no-store.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttlSeconds:
                  type: integer
                  minimum: 60
                  maximum: 86400
                  default: 43200
                  description: Lifetime of the CLI credential the sign-in issues.
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: Pending sign-in created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceSignInStarted" }
        default: { $ref: "#/components/responses/Error" }

  /auth/device/token:
    post:
      tags: [identities]
      operationId: collectDeviceSignIn
      security: []
      summary: >
        Poll a device-authorization sign-in, at most once per interval.
        428 AUTHORIZATION_PENDING (details.interval) while it waits; 429
        SLOW_DOWN when polled sooner, the interval growing by 5 seconds;
        403 ACCESS_DENIED once denied; 410 EXPIRED once expired (or for an
        unknown device code); 201 with a CLI credential of the approving
        person, exactly once; 410 CONSUMED (details.credentialId, never the
        token) once collected. Cache-Control no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceCode]
              properties:
                deviceCode: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: Issued CLI credential (token shown exactly once)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedCliCredential" }
        default: { $ref: "#/components/responses/Error" }

  /auth/device/lookup:
    post:
      tags: [identities]
      operationId: lookupDeviceSignIn
      summary: >
        The pending sign-in a person typed the code of, for the
        confirmation screen, with a fresh passkey challenge for approving
        it (bound to the sign-in, the person, and their dashboard session;
        single use; 5 minutes). Requires a human's dashboard session bearer.
        Wrong codes count against persistent limits per person, per peer,
        and in total (RESOURCE_NOT_FOUND per wrong code, RATE_LIMITED with
        details.retryAt once a limit is reached). Cache-Control no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userCode]
              properties:
                userCode:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: As shown by the CLI; case-insensitive, the dash optional.
      responses:
        "200":
          description: The pending sign-in and an approval challenge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceSignInLookup" }
        default: { $ref: "#/components/responses/Error" }

  /auth/device/approve:
    post:
      tags: [identities]
      operationId: decideDeviceSignIn
      summary: >
        Approve or deny a pending device-authorization sign-in. Requires a
        human's dashboard session bearer; approving also requires a passkey
        assertion over the challenge lookupDeviceSignIn issued for this
        sign-in and session (PERMISSION_DENIED otherwise). The approval
        records which passkey asserted and whether it verified the user
        (user verification is not required), and the CLI credential the
        sign-in issues carries that record. STATE_CHANGED when the sign-in
        is no longer pending. The code counts against the
        same limits as lookupDeviceSignIn. Cache-Control no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userCode, decision]
              properties:
                userCode: { type: string, minLength: 1, maxLength: 64 }
                decision: { type: string, enum: [approve, deny] }
                assertion:
                  type: object
                  additionalProperties: true
                  description: >
                    WebAuthn authentication response (AuthenticationResponseJSON);
                    required to approve.
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                required: [decision]
                properties:
                  decision: { type: string, enum: [approved, denied] }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/grants:
    get:
      tags: [grants]
      operationId: listGrants
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Grants
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Grant" }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [grants]
      operationId: createGrant
      parameters: [{ $ref: "#/components/parameters/org" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              description: >
                Subject is exactly one of subjectIdentityId or subjectGroupId
                (ADR-0028); permission is exactly one of actions or roleId.
              properties:
                subjectIdentityId: { type: string }
                subjectGroupId: { type: string }
                scope: { $ref: "#/components/schemas/GrantScope" }
                actions:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/Action" }
                roleId: { type: string }
      responses:
        "201":
          description: Created grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grant" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/roles:
    get:
      tags: [grants]
      operationId: listRoles
      parameters: [{ $ref: "#/components/parameters/org" }]
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Role" } }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [grants]
      operationId: createRole
      summary: Create a reusable Role — a named Action bundle (ADR-0028).
      parameters: [{ $ref: "#/components/parameters/org" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, actions]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                actions:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/Action" }
      responses:
        "201":
          description: Created role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        default: { $ref: "#/components/responses/Error" }

  /organizations/{org}/roles/{role}:
    patch:
      tags: [grants]
      operationId: updateRole
      summary: >
        Update a Role in place (capability access.update, ADR-0029). Takes
        effect on the next authorization decision — every Grant citing the
        Role re-points with no revoke/recreate gap. Omitted fields are
        unchanged; a supplied actions array replaces the whole set.
      parameters:
        - $ref: "#/components/parameters/org"
        - { name: role, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { $ref: "#/components/schemas/EntityVersion" }
                name: { type: string, minLength: 1, maxLength: 200 }
                actions:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/Action" }
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [grants]
      operationId: deleteRole
      parameters:
