packages:
  - "packages/*"
  - "services/*"
  - "apps/*"
  # The documentation site is its own workspace (apps/docs/pnpm-workspace.yaml),
  # so its build tooling never changes what the product resolves.
  - "!apps/docs"
  - "convex"
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
minimumReleaseAgeExclude:
  - '@types/node@26.5.0'

overrides:
  # Patch the OpenAPI generator's transitive YAML parser.
  js-yaml@>=4.0.0 <4.3.2: 4.3.2
  # serveStatic decodes the path twice (GHSA-rmxm-3fg6-px4f); the MCP SDK allows 2.x.
  '@hono/node-server@>=1.19.10 <2.1.3': 2.1.5
