# GENERATED FILE — do not edit. Regenerate with `pnpm compose:generate`
# from infra/compose/docker-compose.yml,
#      infra/compose/docker-compose.tailscale.yml,
#      infra/coolify/compose.overlay.yml.

# Coolify deployment WITH the Tailscale sidecar (ADR-0014/0019): Coolify
# deploys exactly one Compose file (no overlay -f chaining), so this is the
# canonical contract with the Tailscale overlay and the Coolify-only deltas
# applied.

# Topology (ADR-0014): the tailscale sidecar owns the network namespace and
# varlatchd joins it, so connections to the tailnet listener (8687) arrive
# with their TRUE tailnet socket peer address and WhoIs runs over the shared
# LocalAPI socket. The sidecar carries the network alias `varlatchd` so the
# dashboard's same-origin nginx proxy (proxy_pass http://varlatchd:8686)
# keeps resolving after varlatchd gives up its own network identity.

# Requires in .env (Coolify env settings):
#   TS_AUTHKEY               tailnet auth key for the sidecar node
#   VARLATCH_TAILNET_NAME    the tailnet, e.g. example.ts.net

name: varlatch

services:
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    # Each password arrives either as a variable (.env) or as a per-service
    # secret file (#28; see `secrets:` below). A set variable wins; a
    # non-empty file fills an unset one. Only initdb needs them — role
    # creation fails closed in postgres-init/ if one is missing.
    entrypoint:
      - sh
      - -c
      - |
        load() { [ -z "$$(printenv "$$1")" ] && [ -s "$$2" ] && export "$$1=$$(cat "$$2")"; return 0; }
        load POSTGRES_PASSWORD /run/secrets/postgres-superuser-password
        load VARLATCH_MIGRATE_PASSWORD /run/secrets/varlatch-migrate-password
        load VARLATCH_RUNTIME_PASSWORD /run/secrets/varlatch-runtime-password
        load CONVEX_DB_PASSWORD /run/secrets/convex-db-password
        exec docker-entrypoint.sh "$$@"
      - --
    command: [ "postgres" ]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-}
      VARLATCH_MIGRATE_PASSWORD: ${VARLATCH_MIGRATE_PASSWORD:-}
      VARLATCH_RUNTIME_PASSWORD: ${VARLATCH_RUNTIME_PASSWORD:-}
      CONVEX_DB_PASSWORD: ${CONVEX_DB_PASSWORD:-}
    secrets:
      - postgres-superuser-password
      - varlatch-migrate-password
      - varlatch-runtime-password
      - convex-db-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP on purpose: during first-boot initdb the entrypoint runs a
      # temporary socket-only server, and a socket probe would report ready
      # before postgres-init/ has created the roles and databases.
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stateful upgrades use `varlatch upgrade`: encrypted full-installation
  # capture + verification precede applying this deployment contract.
  # Do not enable unattended schema-changing deployments in Coolify.
  # One-shot elevated migration job. Holds the migrate credentials and no KEK
  # (ADR-0019 §23: no container receives every installation secret).
  varlatch-migrate:
    build:
      context: ../..
      dockerfile: services/varlatchd/Dockerfile
    volumes:
      - varlatch-state:/var/lib/varlatch
    command: [ "migrate" ]
    restart: "no"
    environment:
      VARLATCH_DATABASE_URL: postgres://varlatchd_migrate:${VARLATCH_MIGRATE_PASSWORD:-}@postgres:5432/varlatch
      VARLATCH_DATABASE_PASSWORD_FILE: /run/secrets/varlatch-migrate-password
    secrets:
      - varlatch-migrate-password
    depends_on:
      postgres:
        condition: service_healthy

  # The Secret Plane daemon: runtime DB role + the root KEK, nothing more.
  varlatchd:
    build:
      context: ../..
      dockerfile: services/varlatchd/Dockerfile
    restart: unless-stopped
    environment:
      VARLATCH_STATE_DIR: /var/lib/varlatch
      VARLATCH_SYNC: ${VARLATCH_SYNC:-on}
      VARLATCH_SYNC_ADAPTERS: ${VARLATCH_SYNC_ADAPTERS:-}
      VARLATCH_DATABASE_URL: postgres://varlatchd_runtime:${VARLATCH_RUNTIME_PASSWORD:-}@postgres:5432/varlatch
      VARLATCH_DATABASE_PASSWORD_FILE: /run/secrets/varlatch-runtime-password
      VARLATCH_KEK_FILE: /run/secrets/varlatch-kek
      VARLATCH_PORT: "8686"
      # The address people open: WebAuthn origin and token issuer (#110).
      # Compose refuses to start without it rather than fall back to an
      # issuer Convex does not trust.
      VARLATCH_PUBLIC_URL: ${VARLATCH_PUBLIC_URL:?set VARLATCH_PUBLIC_URL in .env to the address people open in the browser}
      VARLATCH_CONVEX_URL: ${VARLATCH_CONVEX_URL:-http://convex-backend:3210}
      # The proxies whose X-Forwarded-For varlatchd believes, so per-client
      # limits and the device sign-in confirmation see each caller's own
      # address: the dashboard's nginx here; each ingress overlay adds its
      # TLS proxy. Your own reverse proxy in front: add its name or address.
      VARLATCH_TRUSTED_PROXIES: ${VARLATCH_TRUSTED_PROXIES:-varlatch-web,coolify-proxy}
      VARLATCH_TAILSCALE_SOCKET: /var/run/tailscale/tailscaled.sock
      VARLATCH_TAILSCALE_TAILNET: ${VARLATCH_TAILNET_NAME:?set in .env}
      VARLATCH_TAILNET_PORT: "8687"
    volumes:
      - varlatch-state:/var/lib/varlatch
      - ./backups:/backups
      - tailscale-socket:/var/run/tailscale:ro
    secrets:
      - varlatch-kek
      - varlatch-runtime-password
    depends_on:
      postgres:
        condition: service_healthy
      varlatch-migrate:
        condition: service_completed_successfully
      # Deliberately not service_healthy: a tailnet auth problem must not
      # keep the ordinary listener down. The sidecar healthcheck is for
      # visibility (docker ps / Coolify), not ordering.
      # restart: varlatchd lives in the sidecar's network namespace, which a
      # sidecar restart replaces — restart varlatchd with it. Restarts by the
      # container runtime (a crash) are caught by varlatchd's own watchdog.
      tailscale:
        condition: service_started
        restart: true
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:8686/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    network_mode: service:tailscale

  # The dashboard (ADR-0005): static app + same-origin proxy to varlatchd's
  # ordinary listener. Reverse-proxy this behind TLS as app.<your-domain>.
  varlatch-web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      # Browser-facing Convex origin — runtime config (varlatch-config.js),
      # not a build arg, so digest-pinned release images work unmodified.
      CONVEX_URL: ${CONVEX_CLOUD_ORIGIN:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${VARLATCH_WEB_PORT:-8787}:80"
    # Static probe, never /readyz through the proxy: web must stay routable
    # (and show varlatchd's own errors) while varlatchd is gated or restarting.
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/varlatch-config.js" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      varlatchd:
        condition: service_healthy
    # Explicit default-network membership: Coolify swaps the implicit default
    # network for its own on services without a networks key, which separates
    # web from the sidecar's `varlatchd` alias (nginx: host not found).
    networks:
      - default

  # Application Plane backend (ADR-0005): non-authoritative; its admin key is
  # Infrastructure Operator authority and never enters runtime varlatchd.
  convex-backend:
    # Digest-pinned (ADR-0019 §26): this is the tested Convex backend for the
    # release set. Update deliberately alongside an e2e run, never `latest`.
    image: ghcr.io/get-convex/convex-backend@sha256:1f2044e3eac463ac78973b136c0baf72d4ada602611d853d6f99f280e29e0a98
    restart: unless-stopped
    volumes:
      # Module bundles and file storage live on disk even with POSTGRES_URL
      # set; without this volume every container recreation orphans the
      # modules the database references and all functions 500.
      - convex-data:/convex/data
      - varlatch-state:/var/lib/varlatch
      - ./convex-supervisor.cjs:/convex/varlatch-supervisor.cjs:ro
    entrypoint: [ "node", "/convex/varlatch-supervisor.cjs" ]
    secrets:
      - convex-instance-secret
      - convex-db-password
    environment:
      INSTANCE_NAME: convex-self-hosted
      # Or the files below: the supervisor applies them (#28).
      INSTANCE_SECRET: ${CONVEX_INSTANCE_SECRET:-}
      POSTGRES_URL: postgres://convex:${CONVEX_DB_PASSWORD:-}@postgres:5432
      DO_NOT_REQUIRE_SSL: "1"
      CONVEX_CLOUD_ORIGIN: ${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
      CONVEX_SITE_ORIGIN: ${CONVEX_SITE_ORIGIN:-http://127.0.0.1:3211}
      DISABLE_BEACON: "1"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CONVEX_PORT:-3210}:3210"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:3210/version" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # Same reason: Convex fetches varlatchd's JWKS at its fixed name
    # (http://varlatchd:8686, the alias on the default network). Without this,
    # Convex sits only on Coolify's network and resolves just the legacy
    # `tailscale` name, so `varlatch adopt` cannot move trust to varlatchd.
    networks:
      - default

  # One-shot Application Plane reconciliation (ADR-0035 D3/D4): deploys the
  # functions and applies Convex's trust configuration only where they differ
  # from this release. Deployment authority lives only here (ADR-0019 §6):
  # it derives the admin key from the instance secret inside the job, or uses
  # CONVEX_ADMIN_KEY where an existing installation still sets one.
  # Runs on first boot, upgrade, and repair: docker compose run --rm convex-deploy
  convex-deploy:
    build:
      context: ../..
      dockerfile: infra/compose/convex-deploy.Dockerfile
    environment:
      CONVEX_SELF_HOSTED_URL: http://convex-backend:3210
      CONVEX_SELF_HOSTED_ADMIN_KEY: ${CONVEX_ADMIN_KEY:-}
      CONVEX_INSTANCE_SECRET: ${CONVEX_INSTANCE_SECRET:-}
      CONVEX_INSTANCE_SECRET_FILE: /run/secrets/convex-instance-secret
      # Must equal varlatchd's issuer, which is VARLATCH_PUBLIC_URL (#110).
      VARLATCH_ISSUER: ${VARLATCH_PUBLIC_URL:?set VARLATCH_PUBLIC_URL in .env to the address people open in the browser}
      VARLATCH_JWKS_URL: ${VARLATCH_JWKS_URL:-http://varlatchd:8686/.well-known/jwks.json}
    secrets:
      - convex-instance-secret
    depends_on:
      convex-backend:
        condition: service_healthy
    # Deliberate divergence from the canonical file: no `profiles: [deploy]`,
    # so every Coolify redeploy rebuilds and runs this one-shot and the
    # Application Plane functions can never go stale against the web bundle
    # (the v0.6.0 `mirror:listMine` incident). Nothing depends_on it: a failed
    # function push must not take the already-running stack down — it
    # surfaces in the deploy log instead.
    restart: "no"
  tailscale:
    image: tailscale/tailscale:v1.102.3
    restart: unless-stopped
    # The machine name; with the tailnet ingress the dashboard is at
    # https://<this name>.<tailnet>.ts.net.
    hostname: ${VARLATCH_TAILNET_MACHINE:-varlatch}
    # The auth key arrives as TS_AUTHKEY or as the tailscale-authkey secret
    # file (#28); a set variable wins. Only an unenrolled node needs it.
    entrypoint:
      - sh
      - -c
      - |
        load() { [ -z "$$(printenv "$$1")" ] && [ -s "$$2" ] && export "$$1=$$(cat "$$2")"; return 0; }
        load TS_AUTHKEY /run/secrets/tailscale-authkey
        exec /usr/local/bin/containerboot
    secrets:
      - tailscale-authkey
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      # /healthz is 200 only once the node holds a tailnet address.
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-socket:/var/run/tailscale
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${VARLATCHD_PORT:-8686}:8686"
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    # varlatchd gives up its own network identity (network_mode below), so the
    # sidecar answers to its name: the dashboard's same-origin proxy
    # (proxy_pass http://varlatchd:8686) and Convex's JWKS URL keep resolving.
    networks:
      default:
        aliases:
          - varlatchd

secrets:
  # Generate with: openssl rand -hex 32 > secrets/varlatch-kek
  # Back it up OFF this host and verify with: varlatchd admin kek verify
  # Recovery also requires the archive BEK and compatible release/configuration.
  #
  # secrets/ is gitignored on purpose, so deployments that clone this repo
  # (e.g. Coolify) must point VARLATCH_KEK_HOST_PATH at a persistent host
  # file OUTSIDE the checkout — never a Coolify env var (ADR-0011 §1).
  varlatch-kek:
    file: ${VARLATCH_KEK_HOST_PATH:-./secrets/varlatch-kek}

  # Per-service secret files (#28). Each is mounted only into the services
  # that need it, so a secret can stay out of every other container — which
  # environment variables cannot do on Coolify (it passes every variable to
  # every service). Point a *_HOST_PATH at a host file readable by the
  # container user; leave it unset to keep using the variable of the same
  # name: /dev/null mounts as an empty file, and an empty file is ignored.
  postgres-superuser-password:
    file: ${POSTGRES_SUPERUSER_PASSWORD_HOST_PATH:-/dev/null}
  varlatch-migrate-password:
    file: ${VARLATCH_MIGRATE_PASSWORD_HOST_PATH:-/dev/null}
  varlatch-runtime-password:
    file: ${VARLATCH_RUNTIME_PASSWORD_HOST_PATH:-/dev/null}
  convex-db-password:
    file: ${CONVEX_DB_PASSWORD_HOST_PATH:-/dev/null}
  convex-instance-secret:
    file: ${CONVEX_INSTANCE_SECRET_HOST_PATH:-/dev/null}
  tailscale-authkey:
    file: ${TS_AUTHKEY_HOST_PATH:-/dev/null}

volumes:
  postgres-data:
  convex-data:
  varlatch-state:
  tailscale-state:
  tailscale-socket:
