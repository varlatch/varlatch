<text x="906" y="798" font-size="24" letter-spacing="2.4" fill="#9a9cb0">KEPT APART</text>
<text x="906" y="846" font-size="40" font-weight="700" fill="#e6e6ec">Root KEK, backup key</text>
<text x="906" y="894" font-size="28" fill="#9a9cb0">Files. Never in the database or a backup.</text>
