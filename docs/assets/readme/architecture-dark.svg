<path d="M1266 608V724" stroke="#5d6173" stroke-width="4" fill="none"/><path d="M1252 720h28l-14 18z" fill="#5d6173"/><text x="1294" y="682.0" font-size="26" fill="#9a9cb0">reads</text>
