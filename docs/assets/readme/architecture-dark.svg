<text x="80" y="490" font-size="28" fill="#9a9cb0">The public API (/v1) and the dashboard. Everything that feeds an authorization decision lives here.</text>
<rect x="80" y="524" width="155" height="44" rx="22" fill="#1a1c27" stroke="#2a2c3a" stroke-width="2"/><text x="157.5" y="555" font-size="26" text-anchor="middle" fill="#e6e6ec">passkeys</text>
