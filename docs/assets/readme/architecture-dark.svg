<text x="78" y="798" font-size="24" letter-spacing="2.4" fill="#9a9cb0">DATA DIRECTORY</text>
<text x="78" y="846" font-size="40" font-weight="700" fill="#e6e6ec">SQLite, one file</text>
<text x="78" y="894" font-size="28" fill="#9a9cb0">Secret values and their keys: ciphertext only.</text>
