<rect x="1128" y="524" width="117" height="44" rx="22" fill="#1a1c27" stroke="#2a2c3a" stroke-width="2"/><text x="1186.5" y="555" font-size="26" text-anchor="middle" fill="#e6e6ec">crypto</text>
<rect x="1257" y="524" width="103" height="44" rx="22" fill="#1a1c27" stroke="#2a2c3a" stroke-width="2"/><text x="1308.5" y="555" font-size="26" text-anchor="middle" fill="#e6e6ec">audit</text>
