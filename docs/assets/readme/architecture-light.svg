<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1704 976" width="1704" height="976" role="img" aria-labelledby="t" font-family="-apple-system, 'Segoe UI', 'Liberation Sans', Helvetica, Arial, sans-serif">
<title id="t">Varlatch architecture</title>
<rect x="32" y="32" width="1640" height="174" rx="28" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<text x="78" y="92" font-size="24" letter-spacing="2.4" fill="#57606a">UNTRUSTED CLIENTS</text>
