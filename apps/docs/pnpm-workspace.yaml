# The documentation site's own workspace and lockfile, apart from the
# product's (see the repository's pnpm-workspace.yaml): Astro brings its own
# Vite and several hundred packages, none of which ships in a release.
packages:
  - "."
allowBuilds:
  esbuild: true
  sharp: true
overrides:
  # GHSA-rj75-hqrm-r3gf is fixed only in postcss-selector-parser 7.1.6;
  # Expressive Code (Starlight's code blocks) still asks for postcss-nested 6,
  # which uses the 6.x parser. postcss-nested 7 is the same plugin on parser 7.
  postcss-nested@^6: 7.0.2
auditConfig:
  ignoreGhsas:
    # picomatch ReDoS through single-branch repeated extglobs
    # (GHSA-fc5q-39xc-vjpf, every version up to 4.0.7, no patched release yet).
    # It reaches only the site's build tooling (Astro, Vite), which matches
    # globs written in this repository, never request input; nothing here
    # ships in a release. Remove this entry together with the one in the
    # repository's pnpm-workspace.yaml once a patched picomatch resolves.
    - GHSA-fc5q-39xc-vjpf
