map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # Same-origin auth + API surface (ordinary listener only — the tailnet
  # listener is NEVER reverse-proxied, per ADR-0014).
  location ~ ^/(auth|v1|enroll|healthz|readyz|\.well-known) {
    proxy_pass http://varlatchd:8686;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Same-origin Application Plane (ADR-0035 D5): the browser can reach Convex
  # at <public URL>/convex (CONVEX_CLOUD_ORIGIN=<public URL>/convex), so an
  # installation needs one public origin. The prefix is stripped; the sync
  # socket is a WebSocket. Resolved per request through Docker's DNS, never at
  # startup: a stopped convex-backend must not keep the dashboard itself from
  # serving (live updates degrade; /v1 keeps working). Installations that give
  # the browser a separate Convex origin simply never use this path.
  location /convex/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $convex_backend http://convex-backend:3210;
    rewrite ^/convex/(.*)$ /$1 break;
    proxy_pass $convex_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # The backend is on the same Docker network. For up to 10 s after it
    # stops, the cached address points at nothing; fail fast instead of
    # holding the request for nginx's default 60 s.
    proxy_connect_timeout 5s;
  }
}
