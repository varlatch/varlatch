name: Go

# The Go rewrite (ADR-0059). Its groundwork lived on the rewrite/go branch,
# and ADR-0059 amendment 2 routed CI by branch: pull requests into rewrite/go
# ran these checks instead of ci.yml. Since the branch merged into main
# (Order, step 1), CI is routed by path: these checks run on pull requests
# into main and rewrite/go, merge groups, pushes to rewrite/go, and nightly
# on main (which also saves the Go caches), whenever a change touches go/, this workflow, the TypeScript crypto
# code the cross-language envelope step loads, the OpenAPI document
# go/server/api is generated from (the openapi job checks a pull request's
# change to it for breaking ones), or another source of generated Go code
# (the skill files the CLI embeds). ci.yml classifies Go-only changes too
# (scripts/ci-changes.sh): they run its repository-wide checks, and no
# TypeScript tests unless they change Go test data a package's tests
# produce or read. The main ruleset requires go-ok, which every
# pull request and merge group reports: when the changes job finds no Go
# path, the Go jobs are skipped and go-ok passes. The Go CLI's platform
# runs (internal docs/design/go-cli.md, decision 14: its tests on macOS and
# Windows) are selected by the CLI's code and every file its tests read.
# The conformance cells (go-binary x source, go-binary x go) are selected by
# everything they build and read: the Go paths, the workspace they install
# and build, the dashboard, the CLI and SDK sources, and the conformance
# harness. Each in a pull request or merge group that touches them, and
# nightly. They run on
# GitHub-hosted runners only, never on the self-hosted varlatch-ci runner the
# TypeScript release uses, and with no fallback to it. When hosted minutes
# are out these jobs wait or fail; the checks then run locally, outside the
# release's test runs.
on:
  # Every pull request into main and every merge group runs this workflow,
  # so that go-ok (the required check) always reports; the changes job
  # decides from the paths below whether the Go jobs run or are skipped.
  pull_request:
    branches: [main, rewrite/go]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  # Main gets no push run: each merge commit was tested in the merge queue.
  push:
    branches: [rewrite/go]
    # The same paths as the changes job's patterns (PATTERNS, CLI_PATTERNS
    # and CONFORMANCE_PATTERNS; scripts/conformance/test/routing.test.mjs
    # checks it).
    paths:
      - "go/**"
      - ".github/workflows/go.yml"
      - "services/varlatchd/src/crypto/**"
      - "services/varlatchd/src/auth/jwt.ts"
      - "services/varlatchd/src/config.ts"
      - "packages/contract/src/canonical.ts"
      # go/lib/contract runs the package's shared vectors (step 4.1b).
      - "packages/contract/src/**"
      - "packages/contract/test/vectors/**"
      - "scripts/check-licenses.mjs"
      - "scripts/check-timing-tests.sh"
      # go's shellcheck step checks it.
      - "scripts/ci-nightly-report.sh"
      - "packages/protocol/openapi.yaml"
      - "scripts/conformance/run.mjs"
      - "scripts/conformance/inventory.json"
      - "scripts/conformance/lacks-probe.mjs"
      - "scripts/conformance/lib/operations.mjs"
      - "scripts/conformance/targets/go-binary.mjs"
      - "scripts/conformance/expect/go-binary.json"
      - "scripts/conformance/targets/capabilities.json"
      # Which suites each go-binary shard runs.
      - "scripts/conformance/shard.mjs"
      - "scripts/conformance/shard-weights.json"
      - "services/varlatchd/test/go-values-fixture.test.ts"
      - "services/varlatchd/test/go-webhooks-fixture.test.ts"
      - "services/varlatchd/test/go-fixture-kit.ts"
      - "services/varlatchd/test/go-audit-export-fixture.test.ts"
      - "services/varlatchd/test/go-audit-export-worker-fixture.test.ts"
      - "services/varlatchd/test/helpers/audit-export-fake.ts"
      - "services/varlatchd/test/go-backup-vectors.test.ts"
      - "packages/backup/src/**"
      # The Go CLI's tests read these, from outside go/: the skill files it
      # embeds (skillfiles.gen.go, go generate) and the TypeScript CLI's
      # copy of them, and the features it lacks (client-go.json).
      - "apps/cli/skill/**"
      - "apps/cli/src/agents/skillFiles.generated.ts"
      - "scripts/conformance/client-go.json"
      # Line ends on checkout (the Windows jobs).
      - ".gitattributes"
      # The Typed Accessor runtimes the Go CLI's `types` embeds
      # (go/cmd/varlatch/internal/typegen/embedded/, from these packages'
      # build scripts): "Generated code is current" fails on a stale copy.
      - "packages/accessor/src/**"
      - "packages/accessor/scripts/**"
      - "packages/accessor/package.json"
      - "packages/accessor-python/src/**"
      - "packages/accessor-python/scripts/**"
      - "packages/accessor-python/package.json"
      # The esbuild that bundles the accessor runtime is pinned in
      # pnpm-lock.yaml (below).
      # CONFORMANCE_PATTERNS: what the conformance cells build and read.
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "services/*/package.json"
      - "convex/package.json"
      - ".npmrc"
      - ".pnpmfile.cjs"
      - "tsconfig.base.json"
      - "apps/web/**"
      - "apps/cli/**"
      - "packages/**"
      - "scripts/conformance/**"
      - "scripts/ci-e2e.sh"
      - "services/varlatchd/scripts/e2e-*.mjs"
      - "services/varlatchd/src/**"
      - "services/varlatchd/test/go-*"
      - "services/varlatchd/test/helpers/**"
      - "services/varlatchd/vitest.config.ts"
      - "services/varlatchd/tsconfig.json"
      - "scripts/ci-shell.sh"
      - "scripts/redact-output.mjs"
      - "scripts/redact-tokens.mjs"
      # IMAGE_PATTERNS: what the image's build copies in.
      - "LICENSE"
      - "THIRD-PARTY-NOTICES.md"
      - "LICENSES/**"
  workflow_dispatch:
  # Nightly on main: every Go job, and the cache every pull request restores.
  schedule:
    - cron: "47 2 * * *"

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The timing tests: each judges how a run's time grows with its input
  # (growsLinearly), so a CPU shared with other test binaries reads as
  # nonlinear work. The test steps skip them (-skip), and a step of their
  # own runs them alone right after (-p 1). scripts/check-timing-tests.sh
  # (go job) fails when a test calls growsLinearly and this list misses it.
  # Keep it a flat list of test names, ^(TestA|TestB|...)$: the check reads
  # the names back from that shape and refuses any other.
  TIMING_TESTS: "^(TestTheLinearityCriterion|TestHookLinearTime|TestHookLongReaderIsLinear|TestMaskingIsLinear|TestMaskingIsLinearOnLargeMessages|TestFindIsLinear|TestMatcherIsLinear|TestScanIsLinear|TestManyKeys)$"

jobs:
  # Whether this run's change touches anything the Go jobs check. A push
  # is filtered by the trigger's paths instead, and runs every job.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      cli: ${{ steps.filter.outputs.cli }}
      conformance: ${{ steps.filter.outputs.conformance }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the Go jobs
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          # The push trigger's paths, as shell patterns (* crosses /).
          PATTERNS: |
            go/*
            .github/workflows/go.yml
            services/varlatchd/src/crypto/*
            services/varlatchd/src/auth/jwt.ts
            services/varlatchd/src/config.ts
            packages/contract/src/canonical.ts
            packages/contract/src/*
            packages/contract/test/vectors/*
            scripts/check-licenses.mjs
            scripts/check-timing-tests.sh
            scripts/ci-nightly-report.sh
            packages/protocol/openapi.yaml
            scripts/conformance/run.mjs
            scripts/conformance/inventory.json
            scripts/conformance/lacks-probe.mjs
            scripts/conformance/lib/operations.mjs
            scripts/conformance/targets/go-binary.mjs
            scripts/conformance/expect/go-binary.json
            scripts/conformance/targets/capabilities.json
            scripts/conformance/shard.mjs
            scripts/conformance/shard-weights.json
            services/varlatchd/test/go-values-fixture.test.ts
            services/varlatchd/test/go-webhooks-fixture.test.ts
            services/varlatchd/test/go-fixture-kit.ts
            services/varlatchd/test/go-audit-export-fixture.test.ts
            services/varlatchd/test/go-audit-export-worker-fixture.test.ts
            services/varlatchd/test/helpers/audit-export-fake.ts
            services/varlatchd/test/go-backup-vectors.test.ts
            packages/backup/src/*
            apps/cli/skill/*
            apps/cli/src/agents/skillFiles.generated.ts
            scripts/conformance/client-go.json
            .gitattributes
            packages/accessor/src/*
            packages/accessor/scripts/*
            packages/accessor/package.json
            packages/accessor-python/src/*
            packages/accessor-python/scripts/*
            packages/accessor-python/package.json
            pnpm-lock.yaml
          # The Go CLI (internal docs/design/go-cli.md, decision 14): its
          # code, the shared libraries it may use, every file its tests read
          # from outside go/ (the skill files and the TypeScript CLI's copy of
          # them, client-go.json), and .gitattributes, which decides the line
          # ends a Windows checkout gives them. These select the CLI's
          # platform runs (go-cli-platforms).
          CLI_PATTERNS: |
            go/cmd/varlatch/*
            go/lib/*
            go/go.mod
            go/go.sum
            .github/workflows/go.yml
            apps/cli/skill/*
            apps/cli/src/agents/skillFiles.generated.ts
            scripts/conformance/client-go.json
            .gitattributes
          # What the conformance cells (go-binary x source and go-binary x
          # go) build and read beyond PATTERNS and CLI_PATTERNS (varlatchd,
          # the Go CLI and their tests): the workspace they install and build
          # (pnpm install, pnpm build); varlatchd's dashboard, built from
          # apps/web by go generate ./server/web; the CLI from source (x
          # source) and the TypeScript process tests run against Go with the
          # CLI source they import (x go); the SDK suite's bundle of
          # packages/sdk with its workspace dependencies, from their sources;
          # the conformance harness as ci.yml's conformance tier defines it
          # (the runner, its libraries and data, clients.json included, the
          # suites and the e2e scripts they run, and the TypeScript server
          # source one of them imports); go-binary's G3 steps, which run the
          # TypeScript server's own code (vitest in services/varlatchd: its
          # go-* tests, their helpers and setup, its config and the server's
          # source); and the shell and the redaction the jobs' steps run
          # through. Only Convex's source (convex/) is read by neither: pnpm
          # build compiles it, and ci.yml's test job fails on a build that
          # breaks. The workspace's manifests are its packages' alone
          # (pnpm-workspace.yaml; apps/docs is a workspace of its own). These,
          # PATTERNS and CLI_PATTERNS select both cells (go-binary,
          # go-binary-go-cli); scripts/conformance/test/routing.test.mjs
          # checks that every file the suites and the G3 steps import or
          # load is selected.
          # The single-container image (go-image): its Dockerfile, build
          # script and check, and what its build copies in (the licenses
          # and notices); varlatchd's entrypoint, serve and admin (the
          # daemon), the configuration they parse; and the key-environment
          # refusal varlatchd and the CLI share (lib/keyenv, with the key
          # parsers it uses) and the CLI's entrypoint, which applies it in
          # the image. scripts/conformance/test/routing.test.mjs checks
          # that these select every file the image's build and check read
          # and the refusal's Go sources.
          IMAGE_PATTERNS: |
            go/image/*
            go/cmd/varlatchd/*
            go/server/daemon/*
            go/server/config/*
            go/lib/keyenv/*
            go/lib/backup/*
            go/lib/envelope/*
            go/cmd/varlatch/main.go
            LICENSE
            THIRD-PARTY-NOTICES.md
            LICENSES/*
            .github/workflows/go.yml
          CONFORMANCE_PATTERNS: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
            package.json
            services/*/package.json
            convex/package.json
            .npmrc
            .pnpmfile.cjs
            tsconfig.base.json
            apps/web/*
            apps/cli/*
            packages/*
            scripts/conformance/*
            scripts/ci-e2e.sh
            services/varlatchd/scripts/e2e-*.mjs
            services/varlatchd/src/*
            services/varlatchd/test/go-*
            services/varlatchd/test/helpers/*
            services/varlatchd/vitest.config.ts
            services/varlatchd/tsconfig.json
            scripts/ci-shell.sh
            scripts/redact-output.mjs
            scripts/redact-tokens.mjs
        run: |
          if [ "$EVENT" != pull_request ] && [ "$EVENT" != merge_group ]; then
            printf '%s\n' go=true cli=true conformance=true image=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --no-renames --name-only "$BASE" HEAD)
          # The changed paths that match one of the patterns in $1.
          matching() {
            local f pattern hits=""
            while read -r f; do
              [ -n "$f" ] || continue
              while read -r pattern; do
                [ -n "$pattern" ] || continue
                # shellcheck disable=SC2053 # the pattern is a glob on purpose
                if [[ $f == $pattern ]]; then hits+="$f"$'\n'; break; fi
              done <<< "$1"
            done <<< "$changed"
            printf '%s' "$hits"
          }
          select_jobs() {
            local output=$1 what=$2 hits=$3
            if [ -n "$hits" ]; then
              echo "$output=true" >> "$GITHUB_OUTPUT"
              printf '%s run for:\n%s' "$what" "$hits"
            else
              echo "$output=false" >> "$GITHUB_OUTPUT"
              echo "No path of theirs changed: $what are skipped."
            fi
          }
          go=$(matching "$PATTERNS")
          cli=$(matching "$CLI_PATTERNS")
          select_jobs go "The Go jobs" "$go"
          select_jobs cli "The Go CLI's platform runs" "$cli"
          select_jobs image "The image's build and check (go-image)" "$(matching "$IMAGE_PATTERNS")"
          select_jobs conformance "The conformance cells (go-binary x source, go-binary x go)" \
            "$(printf '%s\n%s\n%s\n' "$go" "$cli" "$(matching "$CONFORMANCE_PATTERNS")" | sed '/^$/d' | sort -u)"

  go:
    # Drafts run nothing, as in ci.yml.
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    # The race detector's run (go-race) and the cross-platform builds
    # (go-platforms) run beside this job. G5 alone takes over 10 minutes
    # since the tailnet matrix, hence 50.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache: false

      # Go's module and build caches, keyed per job (each job compiles
      # different targets). Pull requests and merge groups only restore; the
      # nightly run on main saves (main runs no Go push run: the merge queue
      # already tested each merge commit), so a pull request starts from at
      # most a day-old build of main. Test results are
      # never reused: every go test that a cached result could stand in for
      # runs with -count=1.
      - name: Restore Go's caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-go-${{ hashFiles('go/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-go-${{ hashFiles('go/go.sum') }}-
            go-${{ runner.os }}-go-

      - name: Formatted
        working-directory: go
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "gofmt needed:"; echo "$unformatted"; exit 1; }

      - name: go.mod and go.sum are tidy
        working-directory: go
        run: go mod tidy -diff

      # The dashboard varlatchd embeds is built by go generate ./server/web
      # with the pinned Node (26) and pnpm (package.json packageManager), and
      # this file's later steps (the TypeScript server's crypto code) use
      # Node too.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm

      # G12: generated Go code is what its sources generate, with the
      # generators pinned in go.mod (its tool directives):
      #   - the Go side of the /v1 contract (go/server/api/api.gen.go), from
      #     packages/protocol/openapi.yaml by oapi-codegen; ci.yml checks the
      #     TypeScript types generated from the same document;
      #   - the typed queries (go/server/db/query/), from
      #     go/server/db/schema.sql and queries/ by sqlc;
      #   - the Typed Accessor runtimes the CLI's `types` embeds
      #     (go/cmd/varlatch/internal/typegen/embedded/), built by
      #     packages/accessor's and packages/accessor-python's own scripts
      #     (esbuild pinned in the lockfile) through embed-runtimes.mjs, so
      #     the Go CLI's modules keep the TypeScript CLI's bytes.
      # A stale or hand-edited file fails here; `go generate ./...` in go/
      # repairs it. go generate ./server/web also builds the dashboard into
      # go/server/web/dist/, which is not committed (so not compared) and
      # which every later step embeds. Without cgo, sqlc parses with its WebAssembly build of
      # the PostgreSQL parser instead of compiling the C one (it uses neither
      # for SQLite); the output is the same.
      - name: Generated code is current
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: |
          go generate ./...
          git add -N .
          git diff --exit-code -- . || { echo "Generated files are stale: run go generate ./... in go/ and commit the result." >&2; exit 1; }

      # Every build tag too: conformance (the harness's fixtures, probes and
      # seed) is AGPL server code that ships in no release.
      - name: Vet
        working-directory: go
        run: |
          go vet ./...
          go vet -tags conformance ./...
          go vet -tags crashpoint ./...
          go vet -tags g9a ./...
          go vet -tags g5 ./server/migration/g5/
          go vet -tags headscale ./server/tailnet/...
          go vet -tags "g5 headscale" ./server/migration/g5/

      # Includes go/licensing_test.go: no Apache-2.0 package (the CLI, the
      # shared libraries) may depend on an AGPL-3.0-or-later one (G12), and
      # go/server/web's check that the embedded dashboard was built from this
      # checkout's sources and commit (required here, not skipped).
      - name: Test
        working-directory: go
        env:
          CGO_ENABLED: "0"
          VARLATCH_REQUIRE_DASHBOARD: "1"
        run: VARLATCH_DASHBOARD_COMMIT=$(git rev-parse HEAD) go test -count=1 -skip "$TIMING_TESTS" ./...

      # The timing tests the step above skipped, alone: one test binary at a
      # time (TIMING_TESTS says why).
      - name: Timing tests, alone
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -p 1 -run "$TIMING_TESTS" ./...

      - name: Every timing test runs alone
        run: scripts/check-timing-tests.sh

      # G5's damage gate (ADR-0059 G5; internal docs/design/go-step7.md
      # slice 7.3c; go/server/migration/g5): the migration's Go path through
      # the varlatchd binary on a seeded installation, every damage of the
      # bundle stream, its check sections and the imported database failing
      # at its stage and check, named, a killed import cleared by the next,
      # and nothing secret printed; its interrupted half (7.4c) and its
      # reverse half (7.6a: Go's barrier, the reverse export and checks, a
      # second forward migration reproducing the state, after each kind of
      # change on Go; varlatch migrate --rollback interrupted at every
      # phase boundary; --finish and --delete-old-data). Its own step, so the gate's evidence is its own line
      # in the run.
      - name: G5, the migration's damage gate
        working-directory: go
        env:
          CGO_ENABLED: "0"
        # -timeout: go test's default 10m is shorter than the G5 package now.
        run: go test -count=1 -tags g5 -timeout 25m -run '^TestG5' -v ./server/migration/g5/

      # G6's static half (ADR-0059 Decision 8; internal docs/design/
      # go-step6.md decision 5): go/release/release.json, the release's
      # rollback-safety declaration, matches this build's schema version,
      # and the schema's changes since the previous Go release are ones the
      # declaration allows (go/server/db/schemadiff). Before the first Go
      # release there is no previous one: the g6fixture build (a synthetic
      # rollback-safe step on this commit's schema) is checked against this
      # commit's schema instead, to prove the machinery. Either way, the
      # negative fixture (a breaking change in a release declared
      # rollback-safe) must fail the check. G6's run is go-binary's, shard 1.
      - name: G6, the release's declaration and its schema check
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: |
          go run ./server/db/releasecheck declaration
          # previous must be the last Go release reachable from HEAD (a
          # release tagged since without updating it would be skipped):
          # the history and tags fetched without trees, compared as
          # semantic versions (rc.10 after rc.9, 0.50.0 after its rcs).
          git fetch --quiet --filter=tree:0 --unshallow --tags origin 2>/dev/null || git fetch --quiet --filter=tree:0 --tags origin
          git tag --merged HEAD -l 'v*' > "$RUNNER_TEMP/release-tags"
          go run ./server/db/releasecheck previous --tags "$RUNNER_TEMP/release-tags"
          previous=$(jq -r '.previous.version // empty' release/release.json)
          if [ -n "$previous" ]; then
            git fetch --no-tags --depth=1 origin "refs/tags/v$previous:refs/tags/v$previous"
            git show "v$previous:go/server/db/schema.sql" > "$RUNNER_TEMP/previous-schema.sql"
            go run ./server/db/releasecheck schema --previous "$RUNNER_TEMP/previous-schema.sql"
          else
            go test -count=1 -tags g6fixture -run '^TestTheG6FixtureUpgradesToItsSchema$' ./server/db/
            go run -tags g6fixture ./server/db/releasecheck declaration --declaration release/testdata/g6/fixture.json
            go run -tags g6fixture ./server/db/releasecheck schema --previous server/db/schema.sql --declaration release/testdata/g6/fixture.json
            go run -tags g6fixture,g6unsafe ./server/db/releasecheck declaration --declaration release/testdata/g6/fixture-unsafe.json
          fi
          cat server/db/schema.sql release/testdata/g6/breaking.sql > "$RUNNER_TEMP/breaking-schema.sql"
          status=0
          go run ./server/db/releasecheck schema --previous server/db/schema.sql --current "$RUNNER_TEMP/breaking-schema.sql" \
            --declaration release/testdata/g6/fixture.json || status=$?
          [ "$status" -eq 1 ] || { echo "::error::G6's schema check did not fail a release declared rollback-safe that breaks the schema (exit $status)"; exit 1; }
          echo "The negative fixture failed the check, as it must."

      # The conformance build's own tests: its host override, which the
      # sync suite's fake platforms rely on, is still decided by the
      # outbound policy (a release has none of it: check-release.sh).
      - name: Test the conformance build's host override
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -tags conformance ./server/outbound

      # A self-hosted control server (ADR-0059 Decision 5 as amended for
      # step 7.5c; go/server/tailnet/headscaletest): varlatchd's node joins
      # Headscale 0.29.7 (by digest, in a container named for the run,
      # unprivileged, its embedded DERP only) on https at an IP address,
      # tagged by its pre-auth key, and is pinned to it; while Headscale is
      # unreachable, no bootstrap DNS query. Its own build tag: it needs
      # Docker.
      - name: Headscale, a self-hosted control server
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -tags headscale -run '^TestHeadscale' -v ./server/tailnet/

      # G5's tailnet half on a self-hosted control server (step 7.5c c2;
      # go/server/migration/g5/headscale_test.go): varlatch migrate moves
      # the tailnet name on Headscale 0.29.7, its authority Headscale's API
      # (a key expiring within the hour, expired by each run) or its CLI;
      # the rollback gives it back; a handoff killed mid-switch is aborted
      # (the name back) or resumed (open). No certificates.
      - name: G5 on Headscale, the tailnet handoff on a self-hosted control server
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -tags "g5 headscale" -run '^TestG5Headscale' -v ./server/migration/g5/

      # G7 against the server (ADR-0059 step 3.6): a full disk refuses
      # writes, keeps reads and recovers, and a disk-full error in a
      # group-commit batch of disclosures answers each with an error and no
      # value. The tests fill a filesystem, so they get a 32 MiB tmpfs of
      # their own (the runner is disposable); the test above that kills
      # varlatchd during disclosures needs none and runs with the others.
      - name: G7 against the server on a full disk
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: |
          dir="$RUNNER_TEMP/g7-small-fs"
          mkdir -p "$dir"
          sudo mount -t tmpfs -o size=32m,mode=1777 tmpfs "$dir"
          trap 'sudo umount "$dir"' EXIT
          VARLATCH_G7_SMALL_FS="$dir" VARLATCH_REQUIRE_G7_DISK=1 go test -count=1 -v -run '^(TestFullDiskRefusesWritesKeepsReads|TestDiskFullBatchAnswersEveryDisclosure)$' ./server/daemon
          # A backup on a full disk (step 4.14): the snapshot fails, no
          # archive or status record is left, nothing committed is lost.
          VARLATCH_G7_SMALL_FS="$dir" VARLATCH_REQUIRE_G7_DISK=1 go test -count=1 -v -run '^TestFullDiskDuringSnapshot$' ./server/backups

      # G7 at controlled crash points: varlatchd, built with the storage
      # engine's crash points (the crashpoint tag, which no release has), is
      # killed inside a commit, during a WAL write and during a checkpoint
      # while clients ask for disclosures; every answered disclosure keeps
      # its audit event and the database recovers consistent. And (step
      # 4.12b) killed before, inside, in the commit of and after an
      # Organization's deletion run, which ends it exactly once after a
      # restart.
      - name: G7 against the server at crash points
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -v -tags crashpoint -run '^(TestKillAtCrashPoints|TestKillDuringOrganizationDeletion)$' ./server/daemon

      # The g9a build (ADR-0059 varlatchd-core decision 7): its storage
      # engine's effective settings equal the production build's (a smoke
      # plan's WAL bound aside, which it reports), and a short run seeds W1
      # in the production tables, serves disclosures to the manifest's
      # credentials and runs the converge simulation's writes.
      - name: The g9a build's settings are the production build's
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -tags g9a -run '^TestBench' ./server/daemon

      # Per-stage timings (step 4 decision 7) exist in the g9a build only:
      # its recording and the storage engine's job timings are tested with
      # the tag, and a release build's request path reads no clock for them
      # (the functions holding the marks, checked in the assembly).
      - name: Stage timings only in the g9a build
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: |
          go test -count=1 -tags g9a ./server/stages ./lib/storage
          sh server/stages/check-release.sh

      # install.sh is POSIX sh; its behavior (every prefix, end to end) is in
      # go/install's tests above.
      - name: install.sh, the G9a runner, the restore drill, G6 and the setup test pass shellcheck
        run: shellcheck -s sh go/install/install.sh go/bench/g9a/run.sh go/bench/restore-drill.sh go/release/g6.sh go/install/test-setup.sh

      - name: The release's asset scripts and the nightly report pass shellcheck
        run: shellcheck -s bash go/release/build-assets.sh go/release/check-assets.sh scripts/ci-nightly-report.sh

      # G13 (ADR-0059 step 4.14), and the Go replacement of
      # scripts/test-backup-s3.mjs: the S3 client against a local S3 server
      # (the pinned MinIO image): uploads in one request and multipart,
      # into a bucket with Object Lock and one without, byte for byte; a
      # missing object; a multipart upload aborted on a refused part and
      # one completed after a part was retried; and the bucket test, which
      # reports delivery, retention and recoverability separately and
      # passes only a bucket that holds the uploaded version against
      # deletion. The root key goes through the environment by name only.
      - name: G13, the S3 client and the bucket test against a local S3 with Object Lock
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: |
          name="vlt-s3-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          secret=$(od -An -tx1 -N24 /dev/urandom | tr -d ' \n')
          echo "::add-mask::$secret"
          MINIO_ROOT_PASSWORD="$secret" docker run -d --rm --name "$name" -p 127.0.0.1::9000 \
            -e MINIO_ROOT_USER=vlts3test -e MINIO_ROOT_PASSWORD \
            cgr.dev/chainguard/minio@sha256:6a1d0b45c8669726bba580ced0bfa4cb9fdeed1ed636dfabd81d1577beb6937b server /data > /dev/null
          trap 'docker rm -fv "$name" > /dev/null 2>&1 || true' EXIT
          endpoint="http://$(docker port "$name" 9000/tcp | head -n 1)"
          for _ in $(seq 1 100); do curl -fsS "$endpoint/minio/health/ready" > /dev/null 2>&1 && break; sleep 0.2; done
          VARLATCH_TEST_S3_ENDPOINT="$endpoint" VARLATCH_TEST_S3_ACCESS_KEY=vlts3test VARLATCH_TEST_S3_SECRET_KEY="$secret" VARLATCH_REQUIRE_S3=1 \
            go test -count=1 -v -run '^(TestS3UploadDownload|TestS3MultipartAbortAndRetry|TestBucketTest)$' ./lib/backup

      # Public HTTPS (ADR-0059 step 6, slice 6.3a) against Pebble, Let's
      # Encrypt's test CA, in containers on the runner's network, pinned by
      # digest: issuance over HTTP-01 and over TLS-ALPN-01, renewal before
      # expiry (45-second certificates), a failed challenge reported and
      # retried with backoff, the store's modes, a restart serving the
      # stored certificate, and varlatchd serving HTTPS with nothing before
      # a certificate and only a redirect on its plain listener; and a move
      # to another name (slice 6.9, TestPublicHTTPSMoveAgainstPebble):
      # `varlatch move` built from this commit, the new name's certificate,
      # the old passkeys removed, a re-enrollment over HTTPS. No outside
      # network: every name resolves to 127.0.0.1. Never Let's Encrypt from
      # CI (its staging only by hand, with the owner).
      - name: Public HTTPS against Pebble
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: |
          eval "$(server/publictls/testdata/pebble.sh start "$RUNNER_TEMP/pebble")"
          trap 'server/publictls/testdata/pebble.sh stop' EXIT
          # One package at a time: both listen on Pebble's ports, 5001 and 5002.
          VARLATCH_REQUIRE_PEBBLE=1 go test -count=1 -v -run '^TestPebble' ./server/publictls
          VARLATCH_REQUIRE_PEBBLE=1 go test -count=1 -v -run '^TestPublicHTTPS' ./server/daemon

      # G9a at smoke scale (ADR-0059 step 3.6): 5 % of the profile's
      # length against varlatchd built with the g9a tag (the production
      # serve path with the W1 seed, the converge simulation and paced
      # backups), driven by the harness as a process: k6 (the pinned image)
      # from 20 loopback addresses, varlatchd under G9's memory limits in a
      # scope of its own, and the report. A smoke run is reported as smoke
      # and never counts for the gate: the bound is 512 KiB so the size
      # trigger fires in two minutes, and backups are slowed so that they
      # overlap it. The 50/s backup starts from the WAL's size (95 % of that
      # bound) and must run and hold a size-triggered TRUNCATE off: slowed to
      # 64 pages a step at the production pause (100 ms), the smoke's small
      # database (about 1,700 pages) takes about 2.7 s, longer than the
      # checkpointer's 2 s tick, while the WAL passes 512 KiB within one. Both
      # are set here: at 256 pages a step and a 100 ms pause the snapshot
      # takes 0.6 s and holds nothing off. A converge run
      # alone writes more than twice that bound, so the WAL-peak criterion
      # is the one failure allowed; the scaled plan is the only reason
      # allowed for an inconclusive verdict. The g9a build's settings must
      # be the production build's (the smoke bound aside), every one of the
      # 20 addresses must carry one identity, and none may come within 20 %
      # of the request window.
      # The smoke checks the harness's mechanics, not latency: a hosted
      # runner's disk stalls on fsync now and then (warm-up p95 3.5 ms on one
      # run, 60 to 120 ms on another, before any backup or checkpoint), and
      # G9a's latency verdict holds only on the gate's VPS. So a p95 over the
      # threshold, for a phase or for a window with no failed request, is
      # tolerated here; failed, dropped or busy requests are not, nor is any
      # other failure but the smoke bound's WAL peak.
      # The run also records where each disclosure's time goes (stages.json,
      # every stage present) and a 60 s CPU profile from the load's start
      # (POST /run/start, once k6 is initialized; step 4 decision 7: G9a's
      # slower baseline is diagnosed from them), kept with the report as an
      # artifact. The profile must have seen the load: its window (cpu-window.json,
      # set against the requests' times in the report) overlaps the load, and
      # it holds samples in the disclosure path. How much CPU went there is
      # a diagnostic (profile-disclose.txt in the artifact), not a gate.
      - name: The G9a harness runs and judges a smoke run
        env:
          CGO_ENABLED: "0"
        run: |
          out="$RUNNER_TEMP/g9a-smoke"
          (cd go && go build -o "$RUNNER_TEMP/g9a" ./bench/g9a/cmd/g9a && go build -tags g9a -o "$RUNNER_TEMP/varlatchd-g9a" ./cmd/varlatchd)
          "$RUNNER_TEMP/g9a" plan -scale 0.05 -wal-bound 524288 -backup-step-pages 64 -backup-pause-ms 100 > "$RUNNER_TEMP/smoke-plan.json"
          status=0
          G9A_BIN="$RUNNER_TEMP/g9a" G9A_VARLATCHD="$RUNNER_TEMP/varlatchd-g9a" G9A_PROFILE=60 \
            G9A_SCOPE="sudo systemd-run --scope --quiet --uid=$(id -u) --gid=$(id -g) -p MemoryMax=1G -p MemorySwapMax=0" \
            go/bench/g9a/run.sh "$out" "$RUNNER_TEMP/smoke-plan.json" || status=$?
          [ "$status" -le 2 ] || { cat "$out/server.log" "$out/k6.log" || true; exit 1; }
          jq -e '
            ([.phases[] | select(.warmup | not) | .stats.n >= .expected - 1 and .stats.failed == 0] | all)
            and .droppedIterations == 0 and .serverBusy == 0
            and .sizeTruncates > 0
            and .timedBackups == ([.plan.backups[] | select(.walTriggered | not)] | length)
            and .missedBackups == 0
            and (.walTriggeredBackups | length) > 0
            and (.walTriggeredBackups | length) == ([.plan.backups[] | select(.walTriggered)] | length)
            and ([.walTriggeredBackups[] | (.attempts | length) >= 1 and .heldOffByAttempt > 0] | all)
            and .memoryMaxMiB > 0 and .memoryMaxMiB < 300
            and .deferredTruncates > 0 and .converges == .convergesPlanned
            and .system.target == "varlatchd" and .system.settingsAreProduction
            and (.addresses | length) == 20
            and ([.addresses[] | (.identities | length) == 1 and .maxPerWindow < 480] | all)
            and ([.fails[]
                  | select(startswith("the WAL peaked") | not)
                  | select(test("^phase [a-z0-9]+: p95 [0-9.]+ ms over [0-9]+ ms$") | not)
                  | select(test("^[a-z-]+ window at [-+0-9.]+s: p95 [0-9.]+ ms, 0 failed of [0-9]+$") | not)
                 ] == [])
            and ([.inconclusive[] | select(startswith("the plan differs from G9a") | not)] == [])
            and (.stages | length) == 8 and ([.stages[] | .count > 0] | all)
            and .profile.overlapsLoad == true
          ' "$out/verdict.json" || { cat "$out/report.md"; exit 1; }
          # The plan's backups are real ones (step 4.14): each sealed an archive.
          jq -se '[.[] | select(.ev == "backup_end")] | length > 0 and all(.err == null and .archiveBytes > 0)' "$out/events.jsonl" || { echo "a backup sealed no archive"; exit 1; }
          [ -s "$out/cpu.pprof" ] || { echo "no CPU profile"; exit 1; }
          (cd go && go tool pprof -top -cum -nodecount=100000 -unit=ms -focus='values\.\(\*Service\)\.Disclose' "$out/cpu.pprof") > "$out/profile-disclose.txt"
          head -n 60 "$out/profile-disclose.txt"
          disclose=$(awk '$NF == "github.com/varlatch/varlatch/go/server/values.(*Service).Disclose" { sub(/ms$/, "", $4); print int($4) }' "$out/profile-disclose.txt")
          echo "CPU in the disclosure path: ${disclose:-0} ms (a diagnostic)"
          [ "${disclose:-0}" -gt 0 ] || { echo "the CPU profile holds no sample in the disclosure path"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: g9a-smoke-profile
          path: |
            ${{ runner.temp }}/g9a-smoke/report.md
            ${{ runner.temp }}/g9a-smoke/stages.json
            ${{ runner.temp }}/g9a-smoke/cpu.pprof
            ${{ runner.temp }}/g9a-smoke/cpu-window.json
            ${{ runner.temp }}/g9a-smoke/profile-disclose.txt
          retention-days: 30
          if-no-files-found: warn

      # The varlatchd unit: systemd accepts it, its exposure score stays at
      # or under 2.0 (1.6 when written), and the shipped sandbox lets
      # varlatchd do what it needs and refuses the rest (unitprobe, run as
      # the unit's ExecStart; the runner is disposable, so the script may
      # install a unit and a system user).
      # GitHub-hosted runners only, as the setup step below: it changes the
      # machine's systemd and users.
      - name: The varlatchd unit verifies and its sandbox holds
        if: runner.environment == 'github-hosted' && !vars.CI_RUNNER
        env:
          CGO_ENABLED: "0"
        run: |
          (cd go && go build -o "$RUNNER_TEMP/unitprobe" ./install/unitprobe)
          sudo VARLATCH_TEST_DISPOSABLE_ROOT=1 go/install/test-unit.sh "$RUNNER_TEMP/unitprobe"

      # `varlatch setup` end to end (ADR-0059 step 6, slice 6.4a; the setup
      # suite's replacement) on this disposable runner's own systemd, as
      # the unit's check above: no container (the unit's sandbox needs
      # namespaces an unprivileged container cannot give). For each ingress
      # mode (localhost, own proxy, public against Pebble) one command from
      # an empty host to a ready installation (the first administrator's
      # passkey enrolled by enrollpasskey, a test tool, the custody attested,
      # the first backup verified), a rerun changing nothing, setup stopped
      # after each step and resumed, and no key in its output, its journal,
      # the configuration, the unit's journal or a backup.
      # GitHub-hosted runners only: it changes the machine's systemd, users
      # and /etc, so it is skipped, never run, on a self-hosted varlatch-ci
      # VM (long-lived, its systemd ours), whatever runner this job lands on.
      - name: varlatch setup from an empty host, on this runner's systemd
        if: runner.environment == 'github-hosted' && !vars.CI_RUNNER
        env:
          CGO_ENABLED: "0"
        run: |
          (cd go && go build -o "$RUNNER_TEMP/setup-bin/varlatch" ./cmd/varlatch && go build -o "$RUNNER_TEMP/setup-bin/varlatchd" ./cmd/varlatchd &&
            go build -o "$RUNNER_TEMP/setup-bin/enrollpasskey" ./server/auth/authtest/enrollpasskey)
          eval "$(go/server/publictls/testdata/pebble.sh start "$RUNNER_TEMP/setup-pebble")"
          trap 'go/server/publictls/testdata/pebble.sh stop' EXIT
          sudo VARLATCH_TEST_DISPOSABLE_ROOT=1 VARLATCH_TEST_PEBBLE="$VARLATCH_TEST_PEBBLE" VARLATCH_TEST_PEBBLE_ROOT="$VARLATCH_TEST_PEBBLE_ROOT" \
            go/install/test-setup.sh "$RUNNER_TEMP/setup-bin"

      # ADR-0059 Order step 3: envelopes cross between the servers in both
      # directions. The Go tests open what TypeScript releases sealed
      # (ts-v0.21.0.json, ts-v0.22.0.json); here the TypeScript server's own
      # crypto code (this checkout's, loaded with Node's type stripping, the
      # Node set up above) opens what Go sealed, and the TypeScript fixtures
      # too.
      #
      # The Go envelopes are sealed now, by this commit's code, not taken
      # from the committed file (which only the Go tests read).
      - name: The TypeScript server opens what Go sealed
        env:
          CGO_ENABLED: "0"
        run: |
          fresh="$RUNNER_TEMP/go-sealed.json"
          (cd go && go test -count=1 -run '^TestGoFixtures$' ./lib/envelope/ -args -write-go-fixture="$fresh")
          node go/lib/envelope/testdata/tsfixtures.mjs verify "$fresh"
          node go/lib/envelope/testdata/tsfixtures.mjs verify go/lib/envelope/testdata/go-sealed.json
          node go/lib/envelope/testdata/tsfixtures.mjs verify go/lib/envelope/testdata/ts-v0.21.0.json
          node go/lib/envelope/testdata/tsfixtures.mjs verify go/lib/envelope/testdata/ts-v0.22.0.json

      # ADR-0021's split, SPDX headers and LICENSE files included, for go/
      # too. The script uses Node's standard library only.
      - name: Every file matches the license map
        run: node scripts/check-licenses.mjs

      - name: Save Go's caches
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-go-${{ hashFiles('go/go.sum') }}-${{ github.sha }}

  # The storage engine is concurrent (writer, checkpointer, snapshots):
  # every package but the installer's under the race detector, in a job of
  # its own so that it runs beside go instead of after it. The race detector
  # needs cgo, which only this job uses. It embeds the dashboard, as go's
  # tests do (go generate ./server/web builds it).
  go-race:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache: false

      # Go's module and build caches, keyed per job (each job compiles
      # different targets). Pull requests and merge groups only restore; the
      # nightly run on main saves (main runs no Go push run: the merge queue
      # already tested each merge commit), so a pull request starts from at
      # most a day-old build of main. Test results are
      # never reused: every go test that a cached result could stand in for
      # runs with -count=1.
      - name: Restore Go's caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-race-${{ hashFiles('go/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-race-${{ hashFiles('go/go.sum') }}-
            go-${{ runner.os }}-race-

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm

      - name: Build the dashboard varlatchd embeds
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: go generate ./server/web

      - name: Test with the race detector
        working-directory: go
        env:
          CGO_ENABLED: "1"
          VARLATCH_REQUIRE_DASHBOARD: "1"
        # The installer tests run shells, not Go concurrency; go runs them once.
        # -timeout is per package binary: cmd/varlatch replays every CLI
        # transcript as a race-instrumented process, and its case count grows
        # with each slice, so it gets 20 minutes rather than go's default 10,
        # inside the job's 40.
        run: |
          # shellcheck disable=SC2046 # one argument per package
          go test -count=1 -race -timeout 20m -skip "$TIMING_TESTS" $(go list ./... | grep -v '/go/install$')

      # The timing tests the step above skipped, alone, with the race
      # detector (TIMING_TESTS says why).
      - name: Timing tests, alone, with the race detector
        working-directory: go
        env:
          CGO_ENABLED: "1"
        run: |
          # shellcheck disable=SC2046 # one argument per package
          go test -count=1 -race -p 1 -timeout 20m -run "$TIMING_TESTS" $(go list ./... | grep -v '/go/install$')

      - name: Save Go's caches
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-race-${{ hashFiles('go/go.sum') }}-${{ github.sha }}

  # The cross-platform builds, in their own jobs (one per OS, each for
  # amd64 and arm64) so that they run beside the tests instead of after
  # them. They need no dashboard: go:embed takes the committed
  # dist/.gitkeep and the placeholder.
  go-platforms:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache: false

      # Go's module and build caches, keyed per job (each job compiles
      # different targets). Pull requests and merge groups only restore; the
      # nightly run on main saves (main runs no Go push run: the merge queue
      # already tested each merge commit), so a pull request starts from at
      # most a day-old build of main. Test results are
      # never reused: every go test that a cached result could stand in for
      # runs with -count=1.
      - name: Restore Go's caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-platforms-${{ matrix.goos }}-${{ hashFiles('go/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-platforms-${{ matrix.goos }}-${{ hashFiles('go/go.sum') }}-
            go-platforms-${{ matrix.goos }}-

      # ADR-0059 Decision 1: varlatchd for Linux, varlatch for Linux, macOS
      # and Windows, each on amd64 and arm64; static, no cgo. Every package
      # builds and vets on every platform, since the CLI may use any of the
      # shared ones.
      - name: Both binaries build for ${{ matrix.goos }}
        working-directory: go
        env:
          CGO_ENABLED: "0"
          GOOS_UNDER_TEST: ${{ matrix.goos }}
        run: |
          build() {
            GOOS=${2%/*} GOARCH=${2#*/} go build -trimpath -o /dev/null "./cmd/$1"
            echo "built $1 for $2"
          }
          for arch in amd64 arm64; do
            p="$GOOS_UNDER_TEST/$arch"
            [ "$GOOS_UNDER_TEST" != linux ] || build varlatchd "$p"
            build varlatch "$p"
            GOOS=$GOOS_UNDER_TEST GOARCH=$arch go vet ./...
            GOOS=$GOOS_UNDER_TEST GOARCH=$arch go build ./...
          done

      - name: Save Go's caches
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-platforms-${{ matrix.goos }}-${{ hashFiles('go/go.sum') }}-${{ github.sha }}

  # The conformance harness's go-binary target (ADR-0059 step 3,
  # varlatchd-core decision 5) against this commit's varlatchd: the adapter
  # and the stale-lacks probe against the real server (a listed operation
  # on the stub passes; one with a handler fails), then a whole run with the
  # CLI built from source, which must pass with every check that needs an
  # operation varlatchd lacks reporting target-lacks
  # (scripts/conformance/expect/go-binary.json). The weekly matrix
  # (conformance.yml) has the same row.
  #
  # The run is split into three shards (run.mjs --shard, shard.mjs), each
  # against its own restored varlatchd, so each has the server's whole
  # request window and the three run in parallel. Every suite is in exactly
  # one shard; every shard checks its own server's request budget and logs.
  # The checks that are not the conformance run (the G3 fixtures and the
  # adapter test) run once, in shard 1. go-ok fails when any shard fails.
  # Selected by everything it builds and reads (the changes job's
  # conformance output), not by the Go paths alone.
  go-binary:
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    # The nightly (and a dispatched) run's G6 takes every suite it names in
    # shard 1 (about 35 minutes more); pull requests and merge groups keep
    # the 40 minutes.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 80 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Public logs: every line of this job's steps is masked (scripts/ci-shell.sh).
    defaults:
      run:
        shell: bash scripts/ci-shell.sh {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache: false
      # The conformance binaries' module and build caches, shared by go-binary
      # and go-binary-go-cli (the same CGO_ENABLED=0 builds of varlatchd, and
      # the CLI); restored only, saved by go-binary-go-cli's first shard on
      # the nightly run, as the other Go jobs' caches are.
      - name: Restore Go's caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-conformance-${{ hashFiles('go/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-conformance-${{ hashFiles('go/go.sum') }}-
            go-${{ runner.os }}-conformance-
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @varlatch/protocol generate && pnpm build
      - name: Build varlatchd with the dashboard
        env:
          CGO_ENABLED: "0"
        run: |
          cd go
          go generate ./server/web
          go build -tags conformance -o "$RUNNER_TEMP/varlatchd" ./cmd/varlatchd
      # The Go release assets (internal docs/design/go-step6.md, slice
      # 6.1a), built from this commit exactly as release.yml builds them for
      # a tag of 0.50.0 or later: the dashboard just generated, which must
      # be clean and from this commit, every binary, the stamped installers,
      # the unit, the manifest (release.json) and SHA256SUMS; then checked
      # as release.yml checks them before signing. A version no release
      # uses; nothing is signed, uploaded or published.
      - name: The release's Go assets build and check
        if: matrix.shard == 1
        env:
          CGO_ENABLED: "0"
        run: |
          version="0.0.0-check.${GITHUB_RUN_NUMBER}"
          go/release/build-assets.sh --version "$version" --out "$RUNNER_TEMP/release-assets"
          go/release/check-assets.sh "$RUNNER_TEMP/release-assets" "$version"
      # G3 (ADR-0059 step 3.6), the direction the Go tests cannot take: the
      # TypeScript server's own read path (its effective-configuration and
      # disclosure routes, in PGlite) opens a database fixture whose
      # Organization KEKs and values this commit's Go code sealed, and must
      # give the answers the fixture records. The same run checks that the
      # committed fixtures (values-v0.22.0.json, values-v0.21.0.json, which
      # the Go tests replay) are still this server's answers.
      - name: The TypeScript server reads values Go sealed
        if: matrix.shard == 1
        env:
          CGO_ENABLED: "0"
        run: |
          (cd go && go test -count=1 -run '^TestGoSealedFixture$' ./server/values -args -write-go-sealed="$RUNNER_TEMP/go-sealed-values.json")
          VARLATCH_GO_SEALED_VALUES="$RUNNER_TEMP/go-sealed-values.json" pnpm --filter @varlatch/varlatchd exec vitest run test/go-values-fixture.test.ts
      # G3 for webhook secrets (step 4.7b), the reverse direction: the
      # TypeScript server's own delivery opens secrets this commit's Go code
      # sealed (with the canary and every Organization KEK) and must send
      # the deliveries the fixture records, signatures included, and give
      # its answers. The same run checks that the committed fixtures
      # (webhooks-v0.22.0.json, webhooks-v0.21.0.json) are still its own.
      - name: The TypeScript server delivers with webhook secrets Go sealed
        if: matrix.shard == 1
        env:
          CGO_ENABLED: "0"
        run: |
          (cd go && go test -count=1 -run '^TestGoSealedFixture$' ./server/webhooks -args -write-go-sealed="$RUNNER_TEMP/go-sealed-webhooks.json")
          VARLATCH_GO_SEALED_WEBHOOKS="$RUNNER_TEMP/go-sealed-webhooks.json" pnpm --filter @varlatch/varlatchd exec vitest run test/go-webhooks-fixture.test.ts
      # G3 for Platform Connection credentials (step 4.9b), the reverse
      # direction: the TypeScript server's own checks and listings send the
      # credentials this commit's Go code sealed (with the canary and every
      # Organization KEK) and must give the answers and the requests to the
      # platforms the fixture records. The same run checks that the
      # committed fixtures (connections-v0.22.0.json, connections-v0.21.0.json)
      # are still its own.
      - name: The TypeScript server sends Platform Connection credentials Go sealed
        if: matrix.shard == 1
        env:
          CGO_ENABLED: "0"
        run: |
          (cd go && go test -count=1 -run '^TestGoSealedFixture$' ./server/syncs -args -write-go-sealed="$RUNNER_TEMP/go-sealed-connections.json")
          VARLATCH_GO_SEALED_CONNECTIONS="$RUNNER_TEMP/go-sealed-connections.json" pnpm --filter @varlatch/varlatchd exec vitest run test/go-connections-fixture.test.ts
      # G3 for GitHub App keys (step 4.10a), the reverse direction: the
      # TypeScript server attaches pending registrations whose keys this
      # commit's Go code sealed (with the canary and every Organization KEK)
      # and must give the answers and the requests to GitHub the fixture
      # records. The same run checks that the committed fixtures
      # (github-app-v0.22.0.json, github-app-v0.21.0.json) are still its own.
      - name: The TypeScript server attaches GitHub App keys Go sealed
        if: matrix.shard == 1
        env:
          CGO_ENABLED: "0"
        run: |
          (cd go && go test -count=1 -run '^TestGoSealedFixture$' ./server/githubapps -args -write-go-sealed="$RUNNER_TEMP/go-sealed-github-app.json")
          VARLATCH_GO_SEALED_GITHUB_APP="$RUNNER_TEMP/go-sealed-github-app.json" pnpm --filter @varlatch/varlatchd exec vitest run test/go-github-app-fixture.test.ts
      # G3 for audit export credentials (step 4.11a), the reverse
      # direction: the TypeScript server's own probe sends the keys this
      # commit's Go code sealed (with every Organization KEK) and must give
      # the answers and the exchanges with the destination the fixture
      # records. The same run checks that audit-export-v0.22.0.json is still
      # its own.
      - name: The TypeScript server sends audit export keys Go sealed
        if: matrix.shard == 1
        env:
          CGO_ENABLED: "0"
        run: |
          (cd go && go test -count=1 -run '^TestGoSealedFixture$' ./server/auditexport -args -write-go-sealed="$RUNNER_TEMP/go-sealed-audit-export.json")
          VARLATCH_GO_SEALED_AUDIT_EXPORT="$RUNNER_TEMP/go-sealed-audit-export.json" pnpm --filter @varlatch/varlatchd exec vitest run test/go-audit-export-fixture.test.ts
      # G3 for audit export drain copies (step 4.11b), the reverse
      # direction: the TypeScript worker runs the worker fixture's steps on
      # rows whose export credentials and drain copy this commit's Go code
      # sealed, sends those keys and must do what the fixture records. The
      # same run checks that audit-export-worker-v0.22.0.json is still its
      # own worker's.
      - name: The TypeScript worker drains with keys Go sealed
        if: matrix.shard == 1
        env:
          CGO_ENABLED: "0"
        run: |
          (cd go && go test -count=1 -run '^TestGoSealedWorkerFixture$' ./server/auditexport -args -write-go-sealed-worker="$RUNNER_TEMP/go-sealed-audit-export-worker.json")
          VARLATCH_GO_SEALED_AUDIT_EXPORT_WORKER="$RUNNER_TEMP/go-sealed-audit-export-worker.json" pnpm --filter @varlatch/varlatchd exec vitest run test/go-audit-export-worker-fixture.test.ts
      # ADR-0059 step 4.14: the BEK seal, the passphrase escrow and the
      # Shamir split cross between the servers in both directions. The Go
      # tests open, restore and combine what the TypeScript code made
      # (testdata/ts-vectors.json); here the TypeScript code opens,
      # restores and combines what this commit's Go code made, and the
      # committed vectors are still its own.
      - name: The TypeScript server opens archives Go sealed, and escrows and splits Go made
        if: matrix.shard == 1
        env:
          CGO_ENABLED: "0"
        run: |
          (cd go && go test -count=1 -run '^TestGoVectors$' ./lib/backup -args -write-go-vectors="$RUNNER_TEMP/go-backup-vectors.json")
          (cd go && go test -count=1 -run '^TestGoVectors$' ./server/custody -args -write-go-vectors="$RUNNER_TEMP/go-custody-vectors.json")
          VARLATCH_GO_BACKUP_VECTORS="$RUNNER_TEMP/go-backup-vectors.json" VARLATCH_GO_CUSTODY_VECTORS="$RUNNER_TEMP/go-custody-vectors.json" \
            pnpm --filter @varlatch/varlatchd exec vitest run test/go-backup-vectors.test.ts
      - name: The go-binary adapter and the stale-lacks probe against varlatchd
        if: matrix.shard == 1
        env:
          VARLATCH_REQUIRE_GO_BINARY: "1"
        run: VARLATCH_GO_BINARY="$RUNNER_TEMP/varlatchd" node --test scripts/conformance/test/go-binary.test.mjs
      - name: Install Chromium
        run: scripts/ci-install-chromium.sh
      # G6's run (ADR-0059 Decision 8; go/release/g6.sh), in shard 1: the
      # previous release's varlatchd on a database the new release
      # upgraded, with the conformance suites below, then the new release on
      # what the previous one wrote. The previous release is the one
      # go/release/release.json names, built from its tag; before the first
      # Go release, this commit's varlatchd is the previous release and its
      # g6fixture build (one rollback-safe schema step) the new one. It runs
      # after Chromium is installed: every conformance run starts with the
      # passkey bootstrap, which drives a browser. Pull
      # requests and merge groups take the suites that write each kind
      # quickly (about 100 seconds a phase, shard-weights.json); the nightly
      # run and a dispatched one add sync, deletion and webhooks (about 990
      # seconds a phase).
      - name: G6, the upgrade gate
        if: matrix.shard == 1
        env:
          CGO_ENABLED: "0"
          EVENT: ${{ github.event_name }}
        run: |
          previous=$(jq -r '.previous.version // empty' go/release/release.json)
          if [ -n "$previous" ]; then
            git fetch --no-tags --depth=1 origin "refs/tags/v$previous:refs/tags/v$previous"
            git worktree add --detach "$RUNNER_TEMP/previous-release" "v$previous"
            (cd "$RUNNER_TEMP/previous-release/go" && go build -tags conformance -o "$RUNNER_TEMP/varlatchd-previous" ./cmd/varlatchd)
            old="$RUNNER_TEMP/varlatchd-previous" new="$RUNNER_TEMP/varlatchd"
            safe=$(jq -r '.rollbackSafe' go/release/release.json)
          else
            (cd go && go build -tags conformance,g6fixture -o "$RUNNER_TEMP/varlatchd-g6fixture" ./cmd/varlatchd)
            old="$RUNNER_TEMP/varlatchd" new="$RUNNER_TEMP/varlatchd-g6fixture"
            safe=$(jq -r '.rollbackSafe' go/release/testdata/g6/fixture.json)
          fi
          suites="cli-core security oidc broker client-runtime audit-export realtime-events"
          case "$EVENT" in schedule | workflow_dispatch) suites="$suites sync deletion webhooks" ;; esac
          # shellcheck disable=SC2086 # one argument per suite
          G6_ROLLBACK_SAFE=$safe sh go/release/g6.sh "$old" "$new" "$RUNNER_TEMP/g6" $suites
          if [ -z "$previous" ]; then
            # The not-rollback-safe path, cheaply (no conformance runs): the
            # same fixture step declared not rollback-safe (g6unsafe:
            # compatibleFrom 2) passes declared so, since the previous
            # release refuses its database, and fails declared rollback-safe.
            (cd go && go build -tags conformance,g6fixture,g6unsafe -o "$RUNNER_TEMP/varlatchd-g6unsafe" ./cmd/varlatchd)
            G6_ROLLBACK_SAFE=false G6_CONFORMANCE=off sh go/release/g6.sh "$old" "$RUNNER_TEMP/varlatchd-g6unsafe" "$RUNNER_TEMP/g6-unsafe"
            status=0
            G6_ROLLBACK_SAFE=true G6_CONFORMANCE=off sh go/release/g6.sh "$old" "$RUNNER_TEMP/varlatchd-g6unsafe" "$RUNNER_TEMP/g6-unsafe-declared-safe" \
              2> "$RUNNER_TEMP/g6-unsafe-declared-safe.err" || status=$?
            cat "$RUNNER_TEMP/g6-unsafe-declared-safe.err" >&2
            # Exit 1 for this reason alone: a step that fails earlier also exits 1.
            if [ "$status" -ne 1 ] || ! grep -q "declared rollback-safe, but the previous release cannot open" "$RUNNER_TEMP/g6-unsafe-declared-safe.err"; then
              echo "::error::G6 did not fail a release declared rollback-safe whose database the previous release refuses, for that reason (exit $status)"
              exit 1
            fi
            echo "G6 failed the release declared rollback-safe whose database the previous release refuses, as it must."
          fi
      # G13's restore drill (ADR-0059 step 4.14): a Go archive restored into
      # a fresh container that holds only the archive and the two keys (a
      # scratch image with varlatchd alone, no network), and the source's
      # Root KEK opening the restored canary. The conformance run below then
      # serves that restored installation, so every shard runs against a
      # restored one (the drill runs in each).
      - name: Restore a Go archive in a fresh container
        run: sh go/bench/restore-drill.sh "$RUNNER_TEMP/varlatchd" "$RUNNER_TEMP/restore-drill"
      - name: Run the conformance suites against the restored varlatchd
        env:
          VARLATCH_GO_BINARY_FROM: ${{ runner.temp }}/restore-drill/restored
          SHARD: ${{ matrix.shard }}
        run: node scripts/conformance/run.mjs --target "go-binary:$RUNNER_TEMP/varlatchd" --cli source --shard "$SHARD/3" --report conformance-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: conformance-report-go-binary-cli-source-shard-${{ matrix.shard }}
          path: conformance-report.json
          retention-days: 30
          if-no-files-found: warn

  # The single-container image (ADR-0059 Decision 8; internal
  # docs/design/go-step6.md, decision 9, slice 6.10a), on every pull
  # request that touches it (the changes job's IMAGE_PATTERNS), and kept
  # fast: go/image/Dockerfile built by go/image/build.sh for linux/amd64 and
  # linux/arm64 from this commit's Linux binaries, built as
  # go/release/build-assets.sh builds them but without the dashboard (the
  # image only copies them); nothing is pushed, signed or published. Then
  # go/image/check-image.mjs, the replacement of test-backup-compose.mjs, as
  # an operator runs the image: its user, volume and label, a key in the
  # environment refused by varlatchd and the CLI, no key in docker inspect
  # or /proc/1/environ, the recovery gate held in the volume across
  # containers, and a backup restored into a new volume. The conformance
  # suites against the image run nightly (go-container).
  go-image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Public logs: every line of this job's steps is masked (scripts/ci-shell.sh).
    defaults:
      run:
        shell: bash scripts/ci-shell.sh {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache: false
      # The conformance binaries' caches, restored only (go-binary-go-cli
      # saves them): the same CGO_ENABLED=0 builds.
      - name: Restore Go's caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-conformance-${{ hashFiles('go/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-conformance-${{ hashFiles('go/go.sum') }}-
            go-${{ runner.os }}-conformance-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      # BuildKit in a container: the docker driver here builds one platform.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build the image's Linux binaries
        env:
          CGO_ENABLED: "0"
        run: |
          version="0.0.0-check.${GITHUB_RUN_NUMBER}"
          mkdir "$RUNNER_TEMP/image-assets"
          for arch in amd64 arm64; do
            for cmd in varlatchd varlatch; do
              (cd go && GOOS=linux GOARCH=$arch go build -trimpath -buildvcs=false \
                -ldflags "-s -w -buildid= -X github.com/varlatch/varlatch/go/lib/buildinfo.Version=$version" \
                -o "$RUNNER_TEMP/image-assets/$cmd-$version-linux-$arch" "./cmd/$cmd")
            done
          done
      - name: Build the image for linux/amd64 and linux/arm64
        run: go/image/build.sh --version "0.0.0-check.${GITHUB_RUN_NUMBER}" --assets "$RUNNER_TEMP/image-assets" --tag varlatchd-image:check --platforms linux/amd64,linux/arm64 --check
      - name: Build the image for this runner
        run: go/image/build.sh --version "0.0.0-check.${GITHUB_RUN_NUMBER}" --assets "$RUNNER_TEMP/image-assets" --tag varlatchd-image:check --platforms linux/amd64 --load
      - name: The image as an operator runs it
        run: node go/image/check-image.mjs varlatchd-image:check

  # The conformance suites against the single-container image (target
  # go-container:<image>, go-binary's expectations), nightly and on a
  # manual run only: one unsharded run of about 45 minutes, too long for
  # every pull request. The image is built from this commit's release
  # assets (build-assets.sh, the dashboard generated) with varlatchd's
  # conformance build (its probes and fixtures). One of go-ok's jobs: on
  # a pull request or in the merge queue it is skipped, which go-ok takes
  # as passed; on a nightly or manual run its failure turns go-ok red.
  go-container:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Public logs: every line of this job's steps is masked (scripts/ci-shell.sh).
    defaults:
      run:
        shell: bash scripts/ci-shell.sh {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache: false
      - name: Restore Go's caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-conformance-${{ hashFiles('go/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-conformance-${{ hashFiles('go/go.sum') }}-
            go-${{ runner.os }}-conformance-
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @varlatch/protocol generate && pnpm build
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # The version is above 0.15.0, as every Go release is: serve_cli
      # refuses to serve a release of 0.15.0 or earlier as unsigned
      # (go/lib/release ErrUnsigned), so the cli-download-on checks need one
      # it would serve. No release uses it.
      - name: Build the release's Go assets
        env:
          CGO_ENABLED: "0"
        run: |
          (cd go && go generate ./server/web)
          go/release/build-assets.sh --version "0.50.0-check.${GITHUB_RUN_NUMBER}" --out "$RUNNER_TEMP/release-assets"
      # The image with varlatchd's conformance build beside the release's
      # CLI, which the conformance target needs.
      - name: Build the image with the conformance binaries
        env:
          CGO_ENABLED: "0"
        run: |
          version="0.50.0-check.${GITHUB_RUN_NUMBER}"
          mkdir "$RUNNER_TEMP/conformance-assets"
          (cd go && go build -trimpath -buildvcs=false -tags conformance \
            -ldflags "-s -w -buildid= -X github.com/varlatch/varlatch/go/lib/buildinfo.Version=$version" \
            -o "$RUNNER_TEMP/conformance-assets/varlatchd-$version-linux-amd64" ./cmd/varlatchd)
          cp "$RUNNER_TEMP/release-assets/varlatch-$version-linux-amd64" "$RUNNER_TEMP/conformance-assets/"
          go/image/build.sh --version "$version" --assets "$RUNNER_TEMP/conformance-assets" --tag varlatchd-image:conformance --platforms linux/amd64 --load
      - name: Install Chromium
        run: scripts/ci-install-chromium.sh
      - name: Run the conformance suites against the image
        run: node scripts/conformance/run.mjs --target go-container:varlatchd-image:conformance --cli source --report conformance-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: conformance-report-go-container-cli-source
          path: conformance-report.json
          retention-days: 30
          if-no-files-found: warn

  # G12: a pull request must not break the /v1 contract. oasdiff (pinned
  # image) compares packages/protocol/openapi.yaml in the pull request's
  # merge commit with its base (the merge commit's first parent) and fails on
  # an ERR-level breaking change. A pull request that does not change the
  # document stops after the comparison of the two commits.
  #
  # Before product 1.0 a breaking change may still be made on purpose
  # (ADR-0018), with a CHANGELOG.md entry. To make one: add the label
  # api-breaking to the pull request, add the CHANGELOG.md entry, and re-run
  # this job. The labels are read when the job runs (a re-run sees a label
  # added after the push), and with the label the breaking changes are
  # reported as warnings, provided the pull request changes CHANGELOG.md.
  openapi:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The merge commit and its parents: the first is the base.
          fetch-depth: 2
          persist-credentials: false

      - name: The /v1 contract has no breaking change
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          OASDIFF: tufin/oasdiff:v1.35.0@sha256:82b1840a77335562bb11ce95f77ad31745a0c6f3a770929333ed1c5ef466e400
        run: |
          spec=packages/protocol/openapi.yaml
          if git diff --quiet HEAD^1 HEAD -- "$spec"; then
            echo "$spec is unchanged."
            exit 0
          fi
          specs="$RUNNER_TEMP/openapi"
          mkdir -p "$specs"
          git show "HEAD^1:$spec" > "$specs/base.yaml"
          cp "$spec" "$specs/head.yaml"
          labels=$(gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name')
          if printf '%s\n' "$labels" | grep -qx api-breaking; then
            if git diff --quiet HEAD^1 HEAD -- CHANGELOG.md; then
              echo "::error::The pull request is labelled api-breaking but does not change CHANGELOG.md (ADR-0018)."
              exit 1
            fi
            docker run --rm -v "$specs:/specs:ro" "$OASDIFF" breaking /specs/base.yaml /specs/head.yaml --fail-on ERR \
              || echo "::warning::Breaking /v1 changes accepted by the api-breaking label; see the log above."
          else
            docker run --rm -v "$specs:/specs:ro" "$OASDIFF" breaking /specs/base.yaml /specs/head.yaml --fail-on ERR \
              || { echo "::error::Breaking /v1 change. If it is intended (before 1.0, ADR-0018), label the pull request api-breaking, add a CHANGELOG.md entry and re-run this job."; exit 1; }
          fi

  # install.ps1 under Windows PowerShell 5.1 and PowerShell 7: every prefix
  # (G8) and the end-to-end install, which changes the runner user's PATH
  # (restored afterwards; the runner is disposable).
  windows:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache: false

      - name: install.ps1 under PowerShell 5.1 and 7
        working-directory: go
        env:
          CGO_ENABLED: "0"
          VARLATCH_TEST_DISPOSABLE: "1"
        run: go test -count=1 -v -timeout 20m -run 'PS1' ./install/

  # The Go CLI's tests on macOS and Windows (internal docs/design/go-cli.md,
  # decisions 4 and 14): cmd/varlatch's tests, its recorded transcripts
  # replayed byte for byte included, and those of the shared libraries it is
  # built from. Linux runs the same tests in the go job. A pull request or
  # merge group runs them when it touches the CLI's code or a file its tests
  # read (the changes job's CLI_PATTERNS); the nightly run always does. On
  # Windows the recorded cases that name a path below their directory are
  # compared with the TypeScript CLI's Windows recordings (testdata/*/windows,
  # the windows-expectations workflow); the step lists every skipped test,
  # and the job summary counts them.
  go-cli-platforms:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache: false

      # As the go job's caches; the paths are where setup-go puts them on
      # each platform.
      - name: Where Go's caches are
        id: cache-dirs
        working-directory: go
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: Restore Go's caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.cache-dirs.outputs.build }}
            ${{ steps.cache-dirs.outputs.mod }}
          key: go-${{ runner.os }}-cli-${{ hashFiles('go/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-cli-${{ hashFiles('go/go.sum') }}-
            go-${{ runner.os }}-cli-

      # The libraries are the ones the CLI's build imports, so a library the
      # CLI starts to use joins the platform runs without an edit here.
      - name: Vet and test the CLI and its libraries
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: |
          libs=$(go list -deps ./cmd/varlatch/... | grep '^github.com/varlatch/varlatch/go/lib/')
          printf "The CLI's libraries:\n%s\n" "$libs"
          # shellcheck disable=SC2086 # one argument per package
          go vet ./cmd/varlatch/... $libs
          # Verbose, so every skipped test is listed with its reason (cases a
          # platform cannot hold: POSIX modes and signals, names Windows does
          # not allow); the log leaves out the lines of tests that ran and
          # passed.
          # shellcheck disable=SC2086 # one argument per package
          go test -count=1 -v -skip "$TIMING_TESTS" ./cmd/varlatch/... $libs 2>&1 | tee "$RUNNER_TEMP/go-test.log" | grep -vE '^[[:space:]]*(=== (RUN|PAUSE|CONT|NAME)|--- PASS)'

      # The timing tests the step above skipped, alone (TIMING_TESTS says
      # why); their skips join the same log for the summary below.
      - name: Timing tests, alone
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: |
          libs=$(go list -deps ./cmd/varlatch/... | grep '^github.com/varlatch/varlatch/go/lib/')
          # shellcheck disable=SC2086 # one argument per package
          go test -count=1 -v -p 1 -run "$TIMING_TESTS" ./cmd/varlatch/... $libs 2>&1 | tee -a "$RUNNER_TEMP/go-test.log" | grep -vE '^[[:space:]]*(=== (RUN|PAUSE|CONT|NAME)|--- PASS)'

      - name: Skipped tests
        if: always()
        run: |
          log="$RUNNER_TEMP/go-test.log"
          [ -f "$log" ] || exit 0
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' "$log" || true)
          echo "$skipped tests skipped on $RUNNER_OS (each listed with its reason in the step above)." | tee -a "$GITHUB_STEP_SUMMARY"
          # By test, and by area for the transcripts.
          grep -E '^[[:space:]]*--- SKIP' "$log" | sed -E 's/^[[:space:]]*--- SKIP: ([^ ]+).*/\1/' \
            | awk -F/ '{ print ($1 == "TestTranscripts" ? $1 "/" $2 : $1) }' | sort | uniq -c | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Save Go's caches
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.cache-dirs.outputs.build }}
            ${{ steps.cache-dirs.outputs.mod }}
          key: go-${{ runner.os }}-cli-${{ hashFiles('go/go.sum') }}-${{ github.sha }}

  # The go-binary x go cell (internal docs/design/go-cli.md, decisions 3 and
  # 14): the conformance suites with the Go CLI against this commit's
  # varlatchd. Every check of a feature the Go CLI does not have yet reports
  # client-lacks (scripts/conformance/client-go.json); one of those that
  # passes fails the run as a stale entry, and any other failure fails it.
  # Shard 1 also runs the TypeScript process tests that must pass against Go
  # (apps/cli/test/go-cli-files.json). Split into three shards as go-binary
  # is. A pull request or merge group runs it, as go-binary, when it touches
  # anything the cell builds or reads (the changes job's conformance output:
  # PATTERNS, CLI_PATTERNS and CONFORMANCE_PATTERNS); the nightly run always
  # does. The weekly matrix (conformance.yml) runs the Go CLI against
  # both TypeScript targets.
  go-binary-go-cli:
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    name: go-binary x go (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Public logs: every line of this job's steps is masked (scripts/ci-shell.sh).
    defaults:
      run:
        shell: bash scripts/ci-shell.sh {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache: false
      # The conformance binaries' module and build caches, shared by go-binary
      # and go-binary-go-cli (the same CGO_ENABLED=0 builds of varlatchd, and
      # the CLI); restored only, saved by go-binary-go-cli's first shard on
      # the nightly run, as the other Go jobs' caches are.
      - name: Restore Go's caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-conformance-${{ hashFiles('go/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-conformance-${{ hashFiles('go/go.sum') }}-
            go-${{ runner.os }}-conformance-
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @varlatch/protocol generate && pnpm build
      - name: Build varlatchd with the dashboard, and the Go CLI
        env:
          CGO_ENABLED: "0"
        run: |
          cd go
          go generate ./server/web
          go build -tags conformance -o "$RUNNER_TEMP/varlatchd" ./cmd/varlatchd
          go build -o "$RUNNER_TEMP/varlatch" ./cmd/varlatch
      # The process tests (decision 3): the files go-cli-files.json lists,
      # each spawning the binary VARLATCH_TEST_CLI names instead of the
      # bundle.
      - name: The TypeScript process tests against the Go CLI
        if: matrix.shard == 1
        run: |
          mapfile -t files < <(node -e 'for (const f of require("./apps/cli/test/go-cli-files.json").files) console.log(f)')
          [ "${#files[@]}" -gt 0 ] || { echo "apps/cli/test/go-cli-files.json lists no file"; exit 1; }
          VARLATCH_TEST_CLI="$RUNNER_TEMP/varlatch" pnpm --filter @varlatch/cli exec vitest run "${files[@]}"
      - name: Install Chromium
        run: scripts/ci-install-chromium.sh
      - name: Run the conformance suites with the Go CLI
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/conformance/run.mjs --target "go-binary:$RUNNER_TEMP/varlatchd" --cli "go:$RUNNER_TEMP/varlatch" --shard "$SHARD/3" --report conformance-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: conformance-report-go-binary-cli-go-shard-${{ matrix.shard }}
          path: conformance-report.json
          retention-days: 30
          if-no-files-found: warn
      - name: Save Go's caches
        if: success() && matrix.shard == 1 && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-conformance-${{ hashFiles('go/go.sum') }}-${{ github.sha }}

  # The required check (the main ruleset's merge queue): every Go job
  # succeeded or was skipped because none of its paths changed.
  go-ok:
    name: go-ok
    # On a draft it runs too, and fails: every other job is skipped then, and
    # a skipped required check would read as passed.
    # go-container runs only at night and by hand (skipped on a pull request
    # and in the merge queue, which go-ok accepts): listed so that a failed
    # nightly run's go-ok is red too, not green beside a red job.
    if: always()
    needs: [changes, go, go-race, go-platforms, go-binary, go-image, go-container, openapi, windows, go-cli-platforms, go-binary-go-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Go job passed or was skipped
        env:
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          if [ "$DRAFT" = true ]; then
            echo "::error::A draft runs no CI, so there is no verdict. Mark it ready for review (pnpm ready) to run it."
            exit 1
          fi
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            echo "::error::A Go job failed or was cancelled."
            exit 1
          fi

  # The nightly's issue (scripts/ci-nightly-report.sh): nobody is notified of
  # a scheduled run, so a red nightly could stay red unseen. While go-ok is
  # red on main's nightly, one issue, "Nightly go.yml is red", is open, with
  # each red run's link, commit and failed jobs; the next green nightly
  # closes it. Main's nightly and dispatched runs only (a branch's dispatch
  # says nothing about main), on GITHUB_TOKEN with issues: write alone.
  # The report never changes the run's result: continue-on-error, and the
  # script warns and exits 0 when GitHub's API fails.
  nightly-report:
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [go-ok]
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-nightly-report.sh
          sparse-checkout-cone-mode: false
      - name: The nightly's issue follows go-ok
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.go-ok.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: scripts/ci-nightly-report.sh
