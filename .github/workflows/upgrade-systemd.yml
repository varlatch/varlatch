name: Upgrade on systemd

# `varlatch upgrade` on a machine with real systemd, from the last published
# prerelease to this checkout and on (go/install/test-upgrade.sh, which says
# what it checks): by hand. The job's machine is its own and thrown away: it
# installs varlatchd, its user and its unit, and removes them.
# GitHub-hosted runners only: never a self-hosted varlatch-ci VM, whose systemd
# is ours.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-systemd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache: false
      - name: The releases to upgrade through
        run: |
          git fetch -q --depth 1 origin tag "v$(jq -r .previous.version go/release/release.json)"
          go/install/build-upgrade.sh "$RUNNER_TEMP/upgrade"
      - name: varlatch upgrade, on this runner's systemd
        if: runner.environment == 'github-hosted'
        run: sudo VARLATCH_TEST_DISPOSABLE_ROOT=1 go/install/test-upgrade.sh "$RUNNER_TEMP/upgrade"
