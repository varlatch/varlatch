name: CI

# Tiers: a draft pull request runs nothing. Marking it ready for review starts
# its first run (`pnpm ready` does that once `pnpm verify` passes locally), and
# from then on every push runs the fast checks (test, python-accessor,
# secret-scan, docker, e2e), with two cuts. The test job tests only the
# packages the pull request changes and every package that depends on them,
# unless it changes a file outside the workspace packages that is not
# documentation (the lockfile, the root manifests, tsconfig.base.json,
# scripts/, infra/, CI itself), which tests every package. A pull request
# that changes only documentation no check reads (*.md and docs/, but not
# CHANGELOG.md or THIRD-PARTY-NOTICES.md) skips python-accessor, docker, and
# e2e; the test job's checks and secret-scan still run. The slow suites
# (multi-arch, contributor-setup, and the recovery and install-lifecycle steps
# of backup-recovery) run on a pull request only when it touches what they
# guard. A push to main (a merge) runs the fast checks with every package's
# tests, so every merge commit has a recorded full pass. Everything runs
# nightly on main when main has new commits, on manual dispatch, and before
# every release (release.yml calls this workflow).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

# Runners: GitHub-hosted first. Each run starts with the hosted-runner probe;
# when hosted minutes have run out, GitHub refuses it and every job of the run
# goes to the self-hosted runner (label varlatch-ci) instead. The probe may
# fail without failing the run. CI_RUNNER (a repository variable) forces a
# runner label for every job. If minutes run out partway through a run, set
# CI_RUNNER and rerun the failed jobs: a rerun keeps the probe's answer, but
# every job reads CI_RUNNER again. While minutes are out, every run shows the
# probe as one failed check next to green ones: expected, and not a merge
# gate. While minutes last, the probe bills one hosted minute per run.
# Third-party actions are pinned to commits because a self-hosted runner
# executes them on its host.
# The self-hosted pool runs a few jobs at once, but its capacity is small:
# a newer push to a pull request supersedes the older run, so it cancels
# it. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ vars.CI_RUNNER || needs.changes.outputs.runner }}
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      VARLATCH_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # A pull request's tests are selected by a diff with its base. The
          # depths are strings: in an expression, a numeric 0 is falsy, so
          # `&& 0 || 1` always gave 1, and the base commit was missing.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.3.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate protocol types from OpenAPI
        run: pnpm --filter @varlatch/protocol generate

      - name: Verify generated types are committed and current
        run: git diff --exit-code packages/protocol/src/generated

      - name: Dependency audit
        run: pnpm audit --audit-level moderate

      # docker-compose.coolify-tailscale.yml is generated (ADR-0035 design
      # note); a hand edit or a stale regeneration must fail here, and Docker
      # Compose must read it exactly as it reads the -f overlay chain.
      - name: Coolify Compose file is generated and current
        run: pnpm compose:check

      # THIRD-PARTY-NOTICES.md ships in every image and release (ADR-0037
      # D1); a dependency or image change without regeneration fails here.
      - name: Third-party notices are generated and current
        run: pnpm notices:check

      # ADR-0021's split: SPDX headers, package.json fields, LICENSE files.
      - name: Every file and package matches the license map
        run: pnpm license:check

      # The release notes are the changelog section of the version being
      # released; a release without one fails at tag time, so fail here.
      - name: The changelog has a section for the current version
        run: |
          VERSION=$(node -p "require('./packages/backup/src/release.json').version")
          grep -q "^## ${VERSION} (" CHANGELOG.md || { echo "CHANGELOG.md has no section for ${VERSION}" >&2; exit 1; }

      - name: Build
        run: pnpm build

      # The documentation site is its own pnpm workspace (apps/docs), so the
      # steps above neither install, audit, nor build it. Its build fails on a
      # link to a page or heading that does not exist, so a change to docs/
      # is checked here too.
      - name: Documentation site builds, and its links resolve
        working-directory: apps/docs
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level moderate
          pnpm test
          pnpm build

      # The release workflow builds its files in the repository root; do the
      # same here, with placeholder digests, so it cannot first fail at tag time.
      - name: Release files build from the repository root
        run: |
          VERSION=$(node -p "require('./packages/backup/src/release.json').version")
          D=$(printf 'a%.0s' $(seq 64))
          node infra/release/build-release-artifacts.mjs "$VERSION" \
            --image "varlatchd=ghcr.io/ci/varlatchd:${VERSION}@sha256:${D}" \
            --image "varlatch-web=ghcr.io/ci/varlatch-web:${VERSION}@sha256:${D}" \
            --image "convex-deploy=ghcr.io/ci/varlatch-convex-deploy:${VERSION}@sha256:${D}"
          sha256sum -c SHA256SUMS

      # The release ships apps/cli/dist/varlatch.cjs as the operator CLI; a
      # dependency that stops bundling cleanly must fail here, not at tag time.
      - name: CLI bundle smoke
        run: |
          node apps/cli/dist/varlatch.cjs --version
          grep -q "varlatch admin backup" <<< "$(node apps/cli/dist/varlatch.cjs)"
          # Loads the backup + S3 modules; fails on argument validation.
          set +e; output=$(node apps/cli/dist/varlatch.cjs admin backup verify 2>&1); set -e
          grep -q -- "--bek-file" <<< "$output"
          # The MCP server ships in the same bundle (ADR-0043 Decision 9).
          node infra/release/smoke-mcp.mjs apps/cli/dist/varlatch.cjs

      - name: Typecheck
        run: pnpm typecheck

      # A pull request tests the packages it changes and every package that
      # depends on them (scripts/ci-changes.sh affected, which uses pnpm's
      # --filter "...[<base>]"). pnpm counts a changed file outside every
      # package as a change to the workspace root, which no package depends
      # on, so such a file would select no tests; the changes job answers
      # tests=all for any such file that is not documentation. Every other
      # event tests every package. Build and typecheck always cover everything.
      - name: Test
        env:
          TESTS: ${{ github.event_name == 'pull_request' && needs.changes.outputs.tests || 'all' }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$TESTS" != affected ]; then
            # Match local verification on the three-CPU self-hosted slots:
            # overlapping suites can starve multi-process CLI tests of CPU.
            # Two full runs hit their deadlines, including the 0.13 control.
            pnpm -r --workspace-concurrency=1 test --maxWorkers=2
            exit 0
          fi
          packages=$(scripts/ci-changes.sh affected "$BASE")
          if [ -z "$packages" ]; then
            echo "No package changed: no package tests to run."
            exit 0
          fi
          filters=()
          while read -r name; do filters+=(--filter "$name"); done <<< "$packages"
          pnpm --workspace-concurrency=1 "${filters[@]}" test --maxWorkers=2

  # The Typed Accessor for Python on the oldest and newest Python it
  # supports, each with the standard library only and with a pinned ada-url:
  # the two dependency modes in which a Python verdict must never accept a
  # URL the server rejects. Node runs the reference implementation for the
  # generated modules and the differential tests, so they may not be skipped.
  python-accessor:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.CI_RUNNER || needs.changes.outputs.runner }}
    env:
      VARLATCH_REQUIRE_NODE: "1"
      ADA_URL: ada-url==4.0.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the CLI and what it embeds
        run: pnpm --filter @varlatch/protocol generate && pnpm --filter "@varlatch/cli..." build
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Python 3.10 and 3.14, without and with ada-url
        working-directory: packages/accessor-python
        run: |
          for python in 3.10 3.14; do
            echo "::group::Python $python, standard library only"
            VARLATCH_EXPECT_ADA=0 uv run --no-project --python "$python" python -m unittest discover -s tests
            echo "::endgroup::"
            echo "::group::Python $python with $ADA_URL"
            VARLATCH_EXPECT_ADA=1 uv run --no-project --python "$python" --with "$ADA_URL" python -m unittest discover -s tests
            echo "::endgroup::"
          done

  # Every commit this workflow sees is scanned, not just the diff: a secret
  # in history is published with the repository (ADR-0037 D6). Values are
  # redacted from the log.
  secret-scan:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ vars.CI_RUNNER || needs.changes.outputs.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan the full history for secrets
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --log-opts=--all --redact=100 --no-banner

  docker:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.CI_RUNNER || needs.changes.outputs.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build varlatchd image
        run: docker build -f services/varlatchd/Dockerfile -t varlatchd:ci .
      - name: Image smoke — entrypoint help paths
        run: |
          set +e
          output=$(docker run --rm varlatchd:ci unknown-command 2>&1)
          status=$?
          set -e
          test "$status" -eq 1
          grep -q "Commands:" <<< "$output"
          docker run --rm --entrypoint node varlatchd:ci -e "console.log('node ok')"
      - name: Image smoke — shipped operator CLI (host backups extract it)
        run: |
          docker run --rm --entrypoint node varlatchd:ci /opt/varlatch/varlatch.cjs --version
          # The image's copy carries the MCP server too (ADR-0043 Decision 9).
          docker run --rm --entrypoint node -v "$PWD/infra/release/smoke-mcp.mjs:/tmp/smoke-mcp.mjs:ro" varlatchd:ci /tmp/smoke-mcp.mjs /opt/varlatch/varlatch.cjs
          for f in varlatch.cjs host-backup/run.sh host-backup/verify-remote.sh; do
            test "$(docker run --rm --entrypoint stat varlatchd:ci -c '%U %a' /opt/varlatch/$f)" = "root 644"
          done
      - name: Host backup scripts lint
        run: shellcheck -x infra/host-backup/*.sh

  # Release images are built for linux/amd64 and linux/arm64 (ADR-0037 D5).
  # A change that breaks either architecture fails here, not at tag time; the
  # arm64 smoke runs under emulation (the release runs a full suite on arm64
  # hardware).
  multi-arch:
    needs: changes
    if: needs.changes.outputs.multiarch == 'true'
    runs-on: ${{ vars.CI_RUNNER || needs.changes.outputs.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build every image for both architectures
        run: |
          for dockerfile in services/varlatchd/Dockerfile apps/web/Dockerfile infra/compose/convex-deploy.Dockerfile; do
            docker buildx build --platform linux/amd64,linux/arm64 -f "$dockerfile" .
          done
      - name: arm64 smoke
        run: |
          docker buildx build --platform linux/arm64 --load -t varlatchd:arm64 -f services/varlatchd/Dockerfile .
          test "$(docker image inspect varlatchd:arm64 --format '{{.Architecture}}')" = arm64
          set +e
          output=$(docker run --rm --platform linux/arm64 varlatchd:arm64 unknown-command 2>&1)
          status=$?
          set -e
          test "$status" -eq 1
          grep -q "Commands:" <<< "$output"
          docker run --rm --platform linux/arm64 --entrypoint node varlatchd:arm64 /opt/varlatch/varlatch.cjs --version

  # The contributor setup (ADR-0037 D7) is only documented if it works:
  # `pnpm dev:up` from a clean checkout, sign-in, CLI, restart, and reset.
  contributor-setup:
    needs: changes
    if: needs.changes.outputs.contributor == 'true'
    runs-on: ${{ vars.CI_RUNNER || needs.changes.outputs.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @varlatch/protocol generate && pnpm build
      - name: Install Chromium
        run: pnpm --filter @varlatch/varlatchd exec playwright install --with-deps chromium
      - name: Contributor setup end to end
        run: ./scripts/test-dev-setup.sh

  # Clean-room browser E2E: fresh canonical stack, passkey bootstrap with a
  # virtual authenticator, dashboard, and CLI browser-handoff login.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.CI_RUNNER || needs.changes.outputs.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @varlatch/protocol generate && pnpm build
      - name: Install Chromium
        run: pnpm --filter @varlatch/varlatchd exec playwright install --with-deps chromium
      - name: Run clean-room E2E suites
        run: ./scripts/ci-e2e.sh

  # Which tiers run. A draft pull request runs nothing. Any other pull request
  # runs the fast checks, except that one changing only documentation no check
  # reads skips python-accessor, docker, and e2e (code=false); its test job
  # tests the changed packages and their dependents, or every package when it
  # changes a shared file (tests=affected or all; scripts/ci-changes.sh has
  # the rules). Each slow suite runs only when the pull request touches what
  # it guards; tests (*/test/) never trigger one, and a pull request that
  # changes only documentation triggers none. A push to main runs only the
  # fast checks, in full. A scheduled run skips everything when main has no
  # commits since the last one; any other event runs everything, including a
  # release: release.yml calls this workflow on a tag push, which must not
  # count as a push to main.
  changes:
    needs: hosted-runner
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ vars.CI_RUNNER || (needs.hosted-runner.outputs.available == 'true' && 'ubuntu-latest') || 'varlatch-ci' }}
    outputs:
      runner: ${{ steps.runner.outputs.runner }}
      hosted: ${{ steps.runner.outputs.hosted }}
      run: ${{ steps.filter.outputs.run }}
      code: ${{ steps.filter.outputs.code }}
      tests: ${{ steps.filter.outputs.tests }}
      multiarch: ${{ steps.filter.outputs.multiarch }}
      contributor: ${{ steps.filter.outputs.contributor }}
      recovery: ${{ steps.filter.outputs.recovery }}
      lifecycle: ${{ steps.filter.outputs.lifecycle }}
    steps:
      - name: Runner for this run
        id: runner
        env:
          FORCED: ${{ vars.CI_RUNNER }}
          AVAILABLE: ${{ needs.hosted-runner.outputs.available }}
        run: |
          if [ -n "$FORCED" ]; then
            runner=$FORCED hosted=false why="forced by the CI_RUNNER variable"
          elif [ "$AVAILABLE" = true ]; then
            runner=ubuntu-latest hosted=true why="GitHub-hosted minutes available"
          else
            runner=varlatch-ci hosted=false why="GitHub-hosted runners refused the probe (minutes used up)"
          fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "hosted=$hosted" >> "$GITHUB_OUTPUT"
          echo "Jobs run on $runner: $why." | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Select tiers
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          tiers="multiarch contributor recovery lifecycle"
          if [ "$EVENT" = schedule ] && [ -z "$(git log -1 --since='25 hours ago' --format=%H)" ]; then
            echo "No commits on main since the last nightly run; skipping."
            for t in run code $tiers; do echo "$t=false"; done >> "$GITHUB_OUTPUT"
            echo "tests=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            echo "A push to main: the fast checks only, with every package's tests."
            printf '%s\n' run=true code=true tests=all >> "$GITHUB_OUTPUT"
            for t in $tiers; do echo "$t=false"; done >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" != pull_request ]; then
            echo "Every tier runs ($EVENT on $REF)."
            for t in run code $tiers; do echo "$t=true"; done >> "$GITHUB_OUTPUT"
            echo "tests=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Without rename detection, a moved file also counts at its old path.
          changed=$(git diff --no-renames --name-only "$BASE" HEAD)
          # code=true|false and tests=affected|all, shared with `pnpm verify`.
          selected=$(scripts/ci-changes.sh classify <<< "$changed")
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "$selected" >> "$GITHUB_OUTPUT"
          if grep -qx code=false <<< "$selected"; then
            echo "Documentation only: no slow suite runs."
            for t in $tiers; do echo "$t=false"; done >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(grep -vE '^(services/[^/]+|apps/[^/]+|packages/[^/]+|convex)/test/' <<< "$changed" || true)
          # Image build inputs and CI itself. Dependency changes only select
          # multi-arch here; the other suites see them nightly.
          shared='^\.github/workflows/ci\.yml$|^\.dockerignore$|(^|/)Dockerfile$|\.Dockerfile$'
          deps='(^|/)package\.json$|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$|^\.npmrc$|^\.pnpmfile\.cjs$'
          declare -A guards=(
            [multiarch]="$shared|$deps"
            [contributor]="$shared|^scripts/(dev|test-dev-setup)\.sh$|^infra/compose/"
            # Backup, restore and the data they carry: migrations, crypto, the
            # Convex mirror, the backup CLI.
            [recovery]="$shared|^services/varlatchd/src/(backup|db|crypto|mirror)/|^services/varlatchd/src/(cli|control-entry|config)\.ts$|^packages/backup/|^apps/cli/src/(backup|legacyBackup|maintenance)\.ts$|^convex/convex/(schema|mirror)\.ts$|^infra/|^scripts/(test-backup|fixtures/)"
            # Installing, upgrading and adopting an installation, and its ingress.
            [lifecycle]="$shared|^services/varlatchd/src/(tailnet|enroll)/|^services/varlatchd/src/(control-entry|config|netns-watchdog)\.ts$|^services/varlatchd/src/(domain/bootstrap|auth/humanauth|cli)\.ts$|^apps/cli/src/(setup|adopt|upgrade|doctor|move|moveState)\.ts$|^infra/|^scripts/(test-backup-upgrade|test-prod-shape|test-adopt|test-sidecar-restart|test-ingress|test-setup|test-move|fixtures/)"
          )
          for t in $tiers; do
            hits=$(grep -E "${guards[$t]}" <<< "$files" || true)
            if [ -n "$hits" ]; then echo "$t=true"; else echo "$t=false"; fi >> "$GITHUB_OUTPUT"
            printf '%s:\n%s\n' "$t" "${hits:-(none)}"
          done

  # Hosted runners first: this job only proves one would start. When hosted
  # minutes have run out GitHub refuses it within seconds; continue-on-error
  # keeps the run green (its result then still reads success, with no
  # output), and `changes` sends every job to the self-hosted runner.
  hosted-runner:
    name: GitHub-hosted runners available?
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    outputs:
      available: ${{ steps.probe.outputs.available }}
    steps:
      - id: probe
        run: echo "available=true" >> "$GITHUB_OUTPUT"

  # Recovery steps guard backup and restore; lifecycle steps guard installing,
  # upgrading and adopting. Each runs when its tier does.
  backup-recovery:
    needs: changes
    if: needs.changes.outputs.recovery == 'true' || needs.changes.outputs.lifecycle == 'true'
    runs-on: ${{ vars.CI_RUNNER || needs.changes.outputs.runner }}
    # The self-hosted runner is much smaller than a hosted one.
    timeout-minutes: ${{ !vars.CI_RUNNER && needs.changes.outputs.hosted == 'true' && 45 || 180 }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @varlatch/protocol generate && pnpm build
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate release images
        run: |
          node scripts/test-backup-compose.mjs
          docker build -f services/varlatchd/Dockerfile -t varlatch-backup-test:local .
          docker build -f apps/web/Dockerfile -t varlatch-backup-web-test:local .
          docker build -f infra/compose/convex-deploy.Dockerfile -t varlatch-backup-convex-deploy-test:local .
      - name: Backup and interrupted-restore recovery
        if: needs.changes.outputs.recovery == 'true'
        run: node scripts/test-backup-e2e.mjs
      - name: S3 single and multipart transfers
        if: needs.changes.outputs.recovery == 'true'
        run: node scripts/test-backup-s3.mjs
      - name: Published v0.7.0 upgrade (D11 gate, stale supervisor) and pre-upgrade archive recovery
        if: needs.changes.outputs.lifecycle == 'true'
        run: node scripts/test-backup-upgrade.mjs
      - name: Published v0.10.0 archive restores across the mapping removal (migration 21)
        if: needs.changes.outputs.recovery == 'true'
        run: node scripts/test-backup-v0100-restore.mjs
      # ADR-0035: an installation shaped like a reference production one (Coolify/
      # Tailscale file, Coolify's every-variable environment, admin key in the
      # environment, legacy JWKS URL) upgraded without adoption, then its
      # pre-upgrade archive restored on fresh hosts.
      # ...and then adopted the Coolify way (D13): adopt's printed env changes
      # applied and redeployed until it reports the installation adopted.
      - name: Prod-shaped v0.9.0 upgrade, adoption and recovery
        if: needs.changes.outputs.lifecycle == 'true'
        run: node scripts/test-prod-shape.mjs
      # ADR-0035 D13: a hand-configured plain Compose installation adopted.
      - name: varlatch adopt end to end
        if: needs.changes.outputs.lifecycle == 'true'
        run: node scripts/test-adopt.mjs
      # ADR-0014 topology: a sidecar restart must never strand varlatchd.
      - name: Tailscale sidecar restarts
        if: needs.changes.outputs.lifecycle == 'true'
        run: node scripts/test-sidecar-restart.mjs
      # ADR-0035 D6: public ingress — setup, Caddy and a real ACME exchange (Pebble).
      - name: Public ingress with an ACME certificate
        if: needs.changes.outputs.lifecycle == 'true'
        run: node scripts/test-ingress-public.mjs
      - name: Install Chromium for the setup enrollment
        if: needs.changes.outputs.lifecycle == 'true'
        run: pnpm --filter @varlatch/varlatchd exec playwright install --with-deps chromium
      # ADR-0035 D7: one command from an empty directory, resumable.
      - name: varlatch setup end to end
        if: needs.changes.outputs.lifecycle == 'true'
        run: node scripts/test-setup.mjs
      # Issue #103: moving to another public URL, the procedure rehearsed end to end.
      - name: varlatch move end to end
        if: needs.changes.outputs.lifecycle == 'true'
        run: node scripts/test-move.mjs
