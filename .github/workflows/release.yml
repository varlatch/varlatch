name: Release

# Digest-pinned release sets (ADR-0019 §26): pushing a v* tag builds and
# publishes the images and attaches the deployment unit self-hosters consume —
# varlatch-release.json (manifest), docker-compose.release.yml (upgrades, used
# by `varlatch upgrade`), varlatch-compose-<version>.tar.gz (first
# installs), varlatch-cli-<version>.cjs (operator CLI), THIRD-PARTY-NOTICES.md,
# and SHA256SUMS. Tags are for humans; digests are the canonical runtime pin.
#
# Provenance (ADR-0037 D4/D5): images are built for linux/amd64 and
# linux/arm64 with build-provenance and SBOM attestations, and each image and
# SHA256SUMS is signed keyless with Sigstore from this workflow's own OIDC
# identity; the image signatures are stored in ghcr.io/OWNER/varlatch-signatures. The release itself is only published once an end-to-end suite has
# passed on arm64. docs/operations/verify-release.md shows how to check all of
# it.
#
# Keyless signatures are recorded in Sigstore's public transparency log with
# the repository, tag, and digests they cover. A private repository's
# releases are therefore not signed unless the SIGN_PRIVATE_RELEASES
# repository variable is "true". An unsigned release's notes say so, and
# verify-release.md treats a release as unsigned only when they do.
#
# Runners: GitHub-hosted first. After validation (ci.yml, which decides for
# itself), the hosted-runner probe runs; when hosted minutes have run out,
# GitHub refuses it and the images, arm64-e2e and release jobs go to the
# self-hosted runner (label varlatch-ci), which gives every job a fresh
# container. RELEASE_RUNNER (a repository variable) forces a self-hosted
# runner label; a forced label is always treated as self-hosted (SBOMs as
# release files), so do not point it at a GitHub-hosted label.
# If minutes run out partway through, set RELEASE_RUNNER (and CI_RUNNER) and
# rerun the failed jobs: every job reads the variables again. On a
# self-hosted x64 runner the arm64 suite runs under emulation unless
# ARM64_RUNNER names an arm64 runner, and the release notes say so. BuildKit's
# SBOM scan cannot mount the image inside the self-hosted runner's sandbox
# (sysbox), so images built there carry provenance but no SBOM attestation;
# the release attaches their SBOMs as files instead, generated by syft from
# the pushed images, and the release notes say so too. Those choices follow
# where the images were actually built (the images job's `hosted` output).
# Third-party actions are pinned to commits because a self-hosted runner
# executes them on its host.
#
# Two lines (ADR-0059; internal docs/design/go-step6.md, slice 6.1a): a tag
# before 0.50.0 releases the TypeScript set above. A tag of 0.50.0 or later
# (the Go line: 0.50.0-rc.N prereleases, then 0.50.x) releases the Go
# assets instead: varlatch for Linux, macOS and Windows and varlatchd for
# Linux, each on amd64 and arm64, the installers stamped with the version,
# the systemd unit and its example configuration, all in one SHA256SUMS
# signed keyless from this workflow's identity, the one go/lib/release and
# the installers pin (release.yml at refs/tags/v<version>). The signature
# is verified by the release's own varlatch before anything is published. A
# version with a pre-release part (0.50.0-rc.1) is published as a
# prerelease.
#
# The Go line's container image (internal docs/design/go-step6.md,
# decision 9; go/image): go-image builds ghcr.io/OWNER/varlatchd for
# linux/amd64 and linux/arm64 from the very assets go-release publishes,
# pushes it under the version's tag only (never latest, nor a floating
# minor tag: an upgrade is the tag or digest the operator pins, and digests
# are the canonical pin), with build-provenance and SBOM attestations as
# the TypeScript images have them, and signs its index keyless into
# ghcr.io/OWNER/varlatch-signatures. go-image-check and go-image-arm64 run
# go/image/check-image.mjs on the pushed digest, one platform each. Only
# then does go-release publish, with varlatchd-image.txt (the tag and its
# index digest) listed in the signed SHA256SUMS and in the release notes:
# no Go release without its image.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One run per tag at a time, never cancelled: a second run for the same
# tag (a rerun) waits, and then meets the guards below (go-image refuses a
# version already released or already pushed).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SIGN: ${{ !github.event.repository.private || vars.SIGN_PRIVATE_RELEASES == 'true' }}

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read

  # Hosted runners first: this job only proves one would start. When hosted
  # minutes have run out GitHub refuses it within seconds; continue-on-error
  # keeps the release going (its result then still reads success, with no
  # output), and the jobs below run on the self-hosted runner.
  hosted-runner:
    name: GitHub-hosted runners available?
    needs: validation
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    outputs:
      available: ${{ steps.probe.outputs.available }}
    steps:
      - id: probe
        run: echo "available=true" >> "$GITHUB_OUTPUT"

  # Which line the tag releases: ts before 0.50.0, go from it on.
  line:
    needs: hosted-runner
    runs-on: ${{ vars.RELEASE_RUNNER || (needs.hosted-runner.outputs.available == 'true' && 'ubuntu-latest') || 'varlatch-ci' }}
    timeout-minutes: 5
    outputs:
      line: ${{ steps.line.outputs.line }}
      version: ${{ steps.line.outputs.version }}
      prerelease: ${{ steps.line.outputs.prerelease }}
    steps:
      - id: line
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          # go/lib/release's versionPattern exactly: no number with a leading zero.
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "not a release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [ "${BASH_REMATCH[1]}" -gt 0 ] || [ "${BASH_REMATCH[2]}" -ge 50 ]; then line=go; else line=ts; fi
          prerelease=false
          [ -z "${BASH_REMATCH[4]}" ] || prerelease=true
          printf 'line=%s\nversion=%s\nprerelease=%s\n' "$line" "$version" "$prerelease" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME releases the $line line (prerelease: $prerelease)" | tee -a "$GITHUB_STEP_SUMMARY"

  images:
    needs: [validation, hosted-runner, line]
    if: needs.line.outputs.line == 'ts'
    runs-on: ${{ vars.RELEASE_RUNNER || (needs.hosted-runner.outputs.available == 'true' && 'ubuntu-latest') || 'varlatch-ci' }}
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing
    outputs:
      hosted: ${{ steps.runner.outputs.hosted }}
      varlatchd: ${{ steps.refs.outputs.varlatchd }}
      web: ${{ steps.refs.outputs.web }}
      convex_deploy: ${{ steps.refs.outputs.convex_deploy }}
    steps:
      - name: Runner for the release
        id: runner
        env:
          FORCED: ${{ vars.RELEASE_RUNNER }}
          AVAILABLE: ${{ needs.hosted-runner.outputs.available }}
        run: |
          if [ -n "$FORCED" ]; then
            hosted=false why="self-hosted ($FORCED), forced by the RELEASE_RUNNER variable"
          elif [ "$AVAILABLE" = true ]; then
            hosted=true why="GitHub-hosted: minutes available"
          else
            hosted=false why="self-hosted (varlatch-ci): GitHub-hosted runners refused the probe (minutes used up)"
          fi
          echo "hosted=$hosted" >> "$GITHUB_OUTPUT"
          echo "Release images are built $why." | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compute image names
        id: names
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "varlatchd=ghcr.io/${OWNER}/varlatchd"
            echo "web=ghcr.io/${OWNER}/varlatch-web"
            echo "convex_deploy=ghcr.io/${OWNER}/varlatch-convex-deploy"
            echo "signatures=ghcr.io/${OWNER}/varlatch-signatures"
            echo "version=${GITHUB_REF_NAME#v}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build stages run natively; only the final stages' few RUN steps
      # execute under emulation for arm64.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Build and push varlatchd
        id: varlatchd
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: services/varlatchd/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: ${{ steps.runner.outputs.hosted == 'true' }}
          push: true
          tags: ${{ steps.names.outputs.varlatchd }}:${{ steps.names.outputs.version }}

      - name: Build and push varlatch-web
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: ${{ steps.runner.outputs.hosted == 'true' }}
          push: true
          tags: ${{ steps.names.outputs.web }}:${{ steps.names.outputs.version }}

      # Image-only installs must be able to (re)deploy the Application Plane
      # functions on upgrade — the deployer ships as part of the release set.
      - name: Build and push convex-deploy
        id: convex_deploy
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/compose/convex-deploy.Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: ${{ steps.runner.outputs.hosted == 'true' }}
          push: true
          tags: ${{ steps.names.outputs.convex_deploy }}:${{ steps.names.outputs.version }}

      # The image signatures go to their own package: cosign would otherwise
      # tag each one beside its image, and GitHub shows the newest tag of a
      # package as its latest version, with a pull command for the signature.
      # (GHCR has no OCI referrers API, so newer signature formats still add a
      # tag.) Verifying needs COSIGN_REPOSITORY set the same way.
      - name: Sign the images
        id: refs
        env:
          COSIGN_REPOSITORY: ${{ steps.names.outputs.signatures }}
        run: |
          set -euo pipefail
          version=${{ steps.names.outputs.version }}
          varlatchd="${{ steps.names.outputs.varlatchd }}:${version}@${{ steps.varlatchd.outputs.digest }}"
          web="${{ steps.names.outputs.web }}:${version}@${{ steps.web.outputs.digest }}"
          convex_deploy="${{ steps.names.outputs.convex_deploy }}:${version}@${{ steps.convex_deploy.outputs.digest }}"
          for ref in "$varlatchd" "$web" "$convex_deploy"; do
            # Sign the multi-platform index the release manifest pins.
            if [ "$SIGN" = true ]; then cosign sign --yes "${ref%%:*}@${ref##*@}"; fi
          done
          {
            echo "varlatchd=$varlatchd"
            echo "web=$web"
            echo "convex_deploy=$convex_deploy"
          } >> "$GITHUB_OUTPUT"

  # ADR-0037 D5: the release images themselves, pulled for arm64 and run on
  # arm64 hardware, pass backup, restore, and recovery before publication.
  arm64-e2e:
    needs: images
    # GitHub's hosted arm64 runner when the images were built hosted;
    # ARM64_RUNNER selects another arm64 label. On the self-hosted x64 runner
    # the same suite runs the arm64 images under emulation, which is slower,
    # and the release notes say so. Only
    # Varlatch's own images run emulated there: PostgreSQL and the Convex
    # backend (third-party, pinned by digest) run natively, because Convex's
    # function time limits do not hold under emulation on a small host.
    runs-on: ${{ vars.ARM64_RUNNER || vars.RELEASE_RUNNER || (needs.images.outputs.hosted == 'true' && 'ubuntu-24.04-arm') || 'varlatch-ci' }}
    # Public logs: every line of this job's steps is masked (scripts/ci-shell.sh).
    defaults:
      run:
        shell: bash scripts/ci-shell.sh {0}
    timeout-minutes: ${{ (vars.ARM64_RUNNER || vars.RELEASE_RUNNER || needs.images.outputs.hosted != 'true') && 240 || 45 }}
    permissions:
      contents: read
      packages: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @varlatch/protocol generate && pnpm build
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Hardware or emulation
        id: mode
        run: |
          if [ "$(uname -m)" = aarch64 ]; then
            echo "mode=hardware" >> "$GITHUB_OUTPUT"
          else
            echo "mode=emulated" >> "$GITHUB_OUTPUT"
          fi
      - name: Take the release images for arm64
        run: |
          set -euo pipefail
          # Pull the arm64 manifest by digest, so the local image is arm64
          # whatever the host architecture and image store.
          take() {
            local arm64
            arm64=$(docker buildx imagetools inspect "$1" --raw \
              | jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest')
            test -n "$arm64"
            docker pull "${1%@*}@${arm64}"
            docker tag "${1%@*}@${arm64}" "$2"
            test "$(docker image inspect "$2" --format '{{.Architecture}}')" = arm64
          }
          take "${{ needs.images.outputs.varlatchd }}" varlatch-backup-test:local
          take "${{ needs.images.outputs.web }}" varlatch-backup-web-test:local
          take "${{ needs.images.outputs.convex_deploy }}" varlatch-backup-convex-deploy-test:local
      # A runner may already run arm64 binaries through QEMU handlers the host
      # registered (an unprivileged runner cannot register them itself);
      # otherwise register them here.
      - name: arm64 emulation already available
        id: binfmt
        if: steps.mode.outputs.mode == 'emulated'
        run: |
          if [ "$(docker run --rm --entrypoint uname varlatch-backup-test:local -m 2>/dev/null)" = aarch64 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        if: steps.mode.outputs.mode == 'emulated' && steps.binfmt.outputs.ready != 'true'
        with:
          platforms: arm64
      - name: arm64 images run here
        if: steps.mode.outputs.mode == 'emulated'
        run: test "$(docker run --rm --entrypoint uname varlatch-backup-test:local -m)" = aarch64
      - name: Backup, restore, and recovery on arm64
        env:
          # Emulated, the suite's leases, CLI runs, and readiness waits take
          # several times longer.
          VARLATCH_TEST_SLOWDOWN: ${{ steps.mode.outputs.mode == 'emulated' && '6' || '' }}
        run: node scripts/test-backup-e2e.mjs

  release:
    needs: [images, arm64-e2e]
    runs-on: ${{ vars.RELEASE_RUNNER || (needs.images.outputs.hosted == 'true' && 'ubuntu-latest') || 'varlatch-ci' }}
    permissions:
      contents: write
      packages: read # SBOM files read the pushed images
      id-token: write # keyless signing of SHA256SUMS
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The operator CLI ships as a single-file bundle built from this tag.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.3.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Build workspace (produces the CLI bundle)
        run: pnpm install --frozen-lockfile && pnpm build

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Resolve postgres digest
        id: postgres
        run: |
          DIGEST=$(docker buildx imagetools inspect docker.io/library/postgres:17.6 --format '{{println .Manifest.Digest}}' | head -1)
          echo "ref=docker.io/library/postgres:17.6@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Resolve ingress overlay image digests
        id: overlays
        run: |
          # Tags come from the overlays themselves; the release pins their digests.
          CADDY=docker.io/library/$(grep -m1 -oP 'image: \Kcaddy:\S+' infra/compose/docker-compose.caddy.yml)
          TAILSCALE=docker.io/$(grep -m1 -oP 'image: \Ktailscale/tailscale:\S+' infra/compose/docker-compose.tailscale.yml)
          echo "caddy=${CADDY}@$(docker buildx imagetools inspect "$CADDY" --format '{{println .Manifest.Digest}}' | head -1)" >> "$GITHUB_OUTPUT"
          echo "tailscale=${TAILSCALE}@$(docker buildx imagetools inspect "$TAILSCALE" --format '{{println .Manifest.Digest}}' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        run: |
          node infra/release/build-release-artifacts.mjs "${GITHUB_REF_NAME#v}" \
            --caddy "${{ steps.overlays.outputs.caddy }}" \
            --tailscale "${{ steps.overlays.outputs.tailscale }}" \
            --image "varlatchd=${{ needs.images.outputs.varlatchd }}" \
            --image "varlatch-web=${{ needs.images.outputs.web }}" \
            --image "convex-deploy=${{ needs.images.outputs.convex_deploy }}" \
            --postgres "${{ steps.postgres.outputs.ref }}"

      # Images without SBOM attestations (built self-hosted) get their
      # SBOMs as release files: syft reads each pushed image straight from
      # the registry, per architecture, so nothing needs mounting.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: needs.images.outputs.hosted != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: SBOMs as release files
        if: needs.images.outputs.hosted != 'true'
        env:
          SYFT_VERSION: 1.52.0
          SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d # linux_amd64
          VARLATCHD: ${{ needs.images.outputs.varlatchd }}
          WEB: ${{ needs.images.outputs.web }}
          CONVEX_DEPLOY: ${{ needs.images.outputs.convex_deploy }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          curl -fsSLo syft.tar.gz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum --check --strict -
          tar -xzf syft.tar.gz syft && rm syft.tar.gz
          VERSION=${GITHUB_REF_NAME#v}
          for pair in "varlatchd=$VARLATCHD" "varlatch-web=$WEB" "varlatch-convex-deploy=$CONVEX_DEPLOY"; do
            for arch in amd64 arm64; do
              file="sbom-${pair%%=*}-${VERSION}-linux-${arch}.spdx.json"
              ./syft scan "registry:${pair#*=}" --platform "linux/${arch}" -o "spdx-json=${file}" -q
              test "$(jq -r '.spdxVersion' "$file")" = SPDX-2.3
              sha256sum "$file" >> SHA256SUMS
            done
          done
          rm syft

      # One signature covers every asset: SHA256SUMS lists them all.
      - name: Sign SHA256SUMS
        if: env.SIGN == 'true'
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      # The release notes are this version's CHANGELOG.md section, so what
      # changed and how to upgrade is written once and reviewed in the PR.
      # An unsigned release says so first: verify-release.md treats a release
      # as unsigned only when its notes do.
      - name: Release notes from the changelog
        env:
          ARM64_MODE: ${{ needs.arm64-e2e.outputs.mode }}
          SBOM: ${{ needs.images.outputs.hosted == 'true' }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          GUIDE="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/operations/verify-release.md"
          awk -v v="$VERSION" 'index($0, "## " v " (") == 1 { f = 1; next } f && /^## / { exit } f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $VERSION" >&2; exit 1; }
          if [ "$SIGN" = true ]; then
            COVERS="also covers signatures, provenance, and SBOMs"
          else
            COVERS="covers provenance and SBOMs, and signatures for signed releases"
          fi
          if [ "$SBOM" = true ]; then
            ATTESTATIONS="build-provenance and SBOM attestations"
          else
            ATTESTATIONS="build-provenance attestations"
          fi
          {
            echo
            echo "---"
            echo
            if [ "$SIGN" != true ]; then
              echo "**This release is not signed.** Varlatch ${VERSION} was published from a private repository that has not opted in to signing, so it has no \`SHA256SUMS.sigstore.json\` and its images have no Sigstore signatures. The signature checks in verifying a release do not apply to it. Its images do carry ${ATTESTATIONS} for linux/amd64 and linux/arm64. Check it as [unsigned releases](${GUIDE}#unsigned-releases) describes. Those checks show that the assets and images are complete, consistent, and name the expected commit and workflow run; they do not prove that the release workflow produced them."
              echo
            fi
            if [ "$ARM64_MODE" = emulated ]; then
              echo "The arm64 images passed the backup, restore, and recovery suite under emulation for this release, not on arm64 hardware."
              echo
            fi
            if [ "$SBOM" != true ]; then
              echo "The images of this release were built on a self-hosted runner, where BuildKit cannot generate SBOM attestations: they carry provenance attestations, and their SBOMs are attached as release files instead (\`sbom-IMAGE-${VERSION}-linux-ARCH.spdx.json\`, listed in \`SHA256SUMS\`)."
              echo
            fi
            echo "Digest-pinned release set for linux/amd64 and linux/arm64. Check every asset against \`SHA256SUMS\`; [verifying a release](${GUIDE}) ${COVERS}. The operator CLI, \`varlatch-cli-${VERSION}.cjs\` (Node 22+), is version-coupled to the installation: replace the host CLI before anything else. First installs: unpack \`varlatch-compose-${VERSION}.tar.gz\` and follow its README."
          } >> notes.md

      - name: Create GitHub release with the deployment unit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          SIGNATURE=()
          if [ "$SIGN" = true ]; then SIGNATURE=(SHA256SUMS.sigstore.json); fi
          shopt -s nullglob
          SBOMS=(sbom-*.spdx.json)
          gh release create "$GITHUB_REF_NAME" \
            varlatch-release.json \
            docker-compose.release.yml \
            convex-supervisor.cjs \
            docker-compose.tailscale.yml docker-compose.tailnet-https.yml tailscale-serve.json \
            docker-compose.caddy.yml Caddyfile \
            "varlatch-compose-${VERSION}.tar.gz" \
            "varlatch-cli-${VERSION}.cjs" \
            THIRD-PARTY-NOTICES.md \
            "${SBOMS[@]}" \
            SHA256SUMS "${SIGNATURE[@]}" \
            --title "Varlatch $GITHUB_REF_NAME" \
            --notes-file notes.md

  # The Go line's assets (go/release/build-assets.sh), with the dashboard
  # varlatchd embeds built from this tag, checked before anything is signed.
  go-assets:
    needs: [validation, hosted-runner, line]
    if: needs.line.outputs.line == 'go'
    runs-on: ${{ vars.RELEASE_RUNNER || (needs.hosted-runner.outputs.available == 'true' && 'ubuntu-latest') || 'varlatch-ci' }}
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      # The SHA-256 of SHA256SUMS, which lists every asset with its hash:
      # go-release checks the downloaded bytes against it before running any.
      sums: ${{ steps.build.outputs.sums }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @varlatch/protocol generate && pnpm build
      - name: The dashboard varlatchd embeds
        working-directory: go
        run: go generate ./server/web
      - name: Build and check the Go assets
        id: build
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ needs.line.outputs.version }}
        run: |
          go/release/build-assets.sh --version "$VERSION" --out "$RUNNER_TEMP/go-assets"
          go/release/check-assets.sh "$RUNNER_TEMP/go-assets" "$VERSION"
          echo "sums=$(sha256sum "$RUNNER_TEMP/go-assets/SHA256SUMS" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-assets
          path: ${{ runner.temp }}/go-assets/
          if-no-files-found: error
          # As long as the run can be re-run (30 days): a run whose image
          # was pushed and a later job failed resumes with "Re-run failed
          # jobs", which downloads this artifact again (go/image/README.md).
          retention-days: 30

  # G5 for the release being cut (internal docs/design/go-step7.md
  # decision 17, slice 7.6b): a release that keeps the migration's rollback
  # window (release.json's reversibleTo, the last TypeScript release) must
  # pass G5 whole, forward and reverse; one declared as ending the window
  # (endsRollbackWindow) passes its forward half, the reverse being what it
  # ends. A declaration with neither fails here too (releasecheck refuses
  # it before). First go/server/migration/g5's stand-ins for the TypeScript
  # side, then, by the same rule, the last TypeScript release as published,
  # its images by digest (go/test/rehearsal/published.sh).
  go-g5:
    needs: [validation, hosted-runner, line]
    if: needs.line.outputs.line == 'go'
    runs-on: ${{ vars.RELEASE_RUNNER || (needs.hosted-runner.outputs.available == 'true' && 'ubuntu-latest') || 'varlatch-ci' }}
    # G5's own -timeout is 45 minutes, the upgrade's 50 (it takes about 12);
    # the published release's run pulls about 3 GB and takes 5 minutes on the
    # workstation.
    timeout-minutes: 160
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache: false
      - name: G5, the migration's gate, for this release
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: |
          last=$(sed -n 's/^const LastTypeScriptRelease = "\(.*\)"$/\1/p' lib/release/manifest.go)
          reversible=$(jq -r '.reversibleTo // ""' release/release.json)
          ends=$(jq -r '.endsRollbackWindow // false' release/release.json)
          if [ -n "$last" ] && [ "$reversible" = "$last" ] && [ "$ends" = "false" ]; then
            echo "release.json keeps the rollback window (reversible to $last): G5 whole, forward and reverse."
            go test -count=1 -tags g5 -timeout 45m -run '^TestG5' -v ./server/migration/g5/
          elif [ -z "$reversible" ] && [ "$ends" = "true" ]; then
            echo "release.json ends the rollback window: G5's forward half."
            go test -count=1 -tags g5 -timeout 45m -run '^(TestG5|TestG5Interruptions|TestG5InterruptionsImage|TestG5InterruptionsCoolify|TestG5Kinds)$' -v ./server/migration/g5/
          else
            echo "release.json declares neither reversibleTo $last nor endsRollbackWindow (reversibleTo '$reversible', endsRollbackWindow $ends)" >&2
            exit 1
          fi
      # Every interruption of the host's upgrade and of its rollback; a pull
      # request tries a fixed part of them (internal/upgrade's sample_test.go).
      - name: The host's upgrade and rollback, interrupted everywhere
        working-directory: go
        env:
          CGO_ENABLED: "0"
          VARLATCH_UPGRADE_TESTS: all
        run: go test -count=1 -timeout 50m ./cmd/varlatch/internal/upgrade
      # The harness's S3 client (packages/backup's) and the TypeScript CLI.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - name: G5 on the last TypeScript release as published
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --filter @varlatch/backup
          half=whole
          if [ "$(jq -r '.endsRollbackWindow // false' go/release/release.json)" = true ]; then half=forward; fi
          go/test/rehearsal/published.sh "$half" "$RUNNER_TEMP/g5-published"

  # The Go line's container image (decision 9): the release's own Linux
  # binaries in go/image/Dockerfile, built by go/image/build.sh, pushed
  # under the version's tag and signed. Nothing else is tagged: no latest
  # and no floating 0.50, so a pull never moves under an operator, and a
  # prerelease never becomes what a bare name gives. It runs after G5, so
  # no tag is pushed for a release that cannot pass it.
  go-image:
    needs: [hosted-runner, line, go-assets, go-g5]
    runs-on: ${{ vars.RELEASE_RUNNER || (needs.hosted-runner.outputs.available == 'true' && 'ubuntu-latest') || 'varlatch-ci' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing of the image
    outputs:
      hosted: ${{ steps.runner.outputs.hosted }}
      # name:version@sha256:..., the index this release pins.
      ref: ${{ steps.sign.outputs.ref }}
    steps:
      - name: Runner for the image
        id: runner
        env:
          FORCED: ${{ vars.RELEASE_RUNNER }}
          AVAILABLE: ${{ needs.hosted-runner.outputs.available }}
        run: |
          if [ -n "$FORCED" ]; then
            hosted=false why="self-hosted ($FORCED), forced by the RELEASE_RUNNER variable"
          elif [ "$AVAILABLE" = true ]; then
            hosted=true why="GitHub-hosted: minutes available"
          else
            hosted=false why="self-hosted (varlatch-ci): GitHub-hosted runners refused the probe (minutes used up)"
          fi
          echo "hosted=$hosted" >> "$GITHUB_OUTPUT"
          echo "The Go image is built $why." | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-assets
          path: go-assets
      # As go-release does, before anything is built from them (this job
      # holds the registry's write token and the signing credential): the
      # artifact must be exactly what go-assets built.
      - name: The downloaded assets are the ones built
        working-directory: go-assets
        env:
          SUMS: ${{ needs.go-assets.outputs.sums }}
        run: |
          [[ "$SUMS" =~ ^[0-9a-f]{64}$ ]] || { echo "go-assets reported no SHA256SUMS hash" >&2; exit 1; }
          [ "$(sha256sum SHA256SUMS | cut -d' ' -f1)" = "$SUMS" ] || { echo "SHA256SUMS is not the one go-assets built" >&2; exit 1; }
          sha256sum --check --strict --quiet SHA256SUMS
          listed=$( (cut -d' ' -f3 SHA256SUMS; echo SHA256SUMS) | LC_ALL=C sort)
          present=$(find . -mindepth 1 -printf '%P\n' | LC_ALL=C sort)
          [ "$listed" = "$present" ] || { echo "the artifact holds other files than SHA256SUMS lists" >&2; exit 1; }
      - name: Image name
        id: names
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "varlatchd=ghcr.io/${OWNER}/varlatchd"
            echo "signatures=ghcr.io/${OWNER}/varlatch-signatures"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A version's image is pushed once. Two builds of the same assets
      # give different index digests (provenance mode=max records the run),
      # so a second push would move the tag off the digest the signed
      # record names. Before anything is built, the version must be known
      # unpublished: an explicit "not found" from the releases API for the
      # tag and from the registry for the image tag; any other answer stops.
      # A run whose go-image succeeded and a later job failed is resumed
      # with "Re-run failed jobs" (within 30 days), which keeps go-image's
      # outputs (the pushed digest) and pushes nothing; "Re-run all jobs"
      # stops here. Starting a version over, and what to do once the run
      # can no longer be re-run (the next patch version, never deleting the
      # image): go/image/README.md, "When a release run fails after
      # go-image".
      - name: Not released or pushed before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.line.outputs.version }}
          IMAGE: ${{ steps.names.outputs.varlatchd }}
        run: |
          go/image/check-unpublished.sh --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" \
            --image "$IMAGE" --version "$VERSION"
      # The image only copies the binaries; the arm64 stage's few file
      # steps run under emulation.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      # BuildKit's SBOM scan cannot mount the image inside the self-hosted
      # runner's sandbox, as for the TypeScript images: built there, the
      # image carries provenance only, and go-release attaches its SBOMs as
      # files.
      - name: Build and push the image
        env:
          VERSION: ${{ needs.line.outputs.version }}
          IMAGE: ${{ steps.names.outputs.varlatchd }}
          HOSTED: ${{ steps.runner.outputs.hosted }}
        run: |
          sbom=()
          [ "$HOSTED" != true ] || sbom=(--sbom)
          go/image/build.sh --version "$VERSION" --assets go-assets --tag "$IMAGE:$VERSION" \
            --platforms linux/amd64,linux/arm64 --push --metadata-file "$RUNNER_TEMP/image.json" "${sbom[@]}"
      # The signature goes to its own package, as the TypeScript images'
      # do (COSIGN_REPOSITORY), on the multi-platform index the release
      # records. The Go line is always signed, as its SHA256SUMS is.
      - name: Sign the image
        id: sign
        env:
          COSIGN_REPOSITORY: ${{ steps.names.outputs.signatures }}
          VERSION: ${{ needs.line.outputs.version }}
          IMAGE: ${{ steps.names.outputs.varlatchd }}
        run: |
          set -euo pipefail
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/image.json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "the build reported no index digest: $digest" >&2; exit 1; }
          # The tag pushed is that index, for both platforms.
          [ "$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{println .Manifest.Digest}}' | head -1)" = "$digest" ] \
            || { echo "$IMAGE:$VERSION is not the index just built" >&2; exit 1; }
          platforms=$(docker buildx imagetools inspect "$IMAGE@$digest" --raw \
            | jq -r '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort | join(",")')
          [ "$platforms" = amd64,arm64 ] || { echo "the index holds $platforms, not amd64,arm64" >&2; exit 1; }
          cosign sign --yes "$IMAGE@$digest"
          echo "ref=$IMAGE:$VERSION@$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed and signed $IMAGE:$VERSION@$digest" | tee -a "$GITHUB_STEP_SUMMARY"

  # go/image/check-image.mjs on the pushed image, by its digest, for
  # linux/amd64: as an operator runs it (its user and volume, keys refused
  # in the environment, the recovery gate, a backup restored). No write
  # token and no signing credential here: it runs the release's binaries.
  go-image-check:
    needs: [hosted-runner, go-image]
    runs-on: ${{ vars.RELEASE_RUNNER || (needs.go-image.outputs.hosted == 'true' && 'ubuntu-latest') || 'varlatch-ci' }}
    timeout-minutes: 20
    # Public logs: every line of this job's steps is masked (scripts/ci-shell.sh).
    defaults:
      run:
        shell: bash scripts/ci-shell.sh {0}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Take the pushed image for linux/amd64
        env:
          REF: ${{ needs.go-image.outputs.ref }}
        run: |
          set -euo pipefail
          amd64=$(docker buildx imagetools inspect "$REF" --raw \
            | jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest')
          test -n "$amd64"
          docker pull "${REF%@*}@${amd64}"
          docker tag "${REF%@*}@${amd64}" varlatchd-release:check
          test "$(docker image inspect varlatchd-release:check --format '{{.Architecture}}')" = amd64
      - name: The image as an operator runs it, on linux/amd64
        run: node go/image/check-image.mjs varlatchd-release:check

  # The same check for linux/arm64: GitHub's hosted arm64 runner when the
  # image was built hosted, or ARM64_RUNNER; otherwise the arm64 image
  # under emulation on the self-hosted x64 runner, with every wait longer,
  # and the release notes say so.
  go-image-arm64:
    needs: [hosted-runner, go-image]
    runs-on: ${{ vars.ARM64_RUNNER || vars.RELEASE_RUNNER || (needs.go-image.outputs.hosted == 'true' && 'ubuntu-24.04-arm') || 'varlatch-ci' }}
    timeout-minutes: ${{ (vars.ARM64_RUNNER || vars.RELEASE_RUNNER || needs.go-image.outputs.hosted != 'true') && 90 || 20 }}
    # Public logs: every line of this job's steps is masked (scripts/ci-shell.sh).
    defaults:
      run:
        shell: bash scripts/ci-shell.sh {0}
    permissions:
      contents: read
      packages: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Hardware or emulation
        id: mode
        run: |
          if [ "$(uname -m)" = aarch64 ]; then
            echo "mode=hardware" >> "$GITHUB_OUTPUT"
          else
            echo "mode=emulated" >> "$GITHUB_OUTPUT"
          fi
      - name: Take the pushed image for linux/arm64
        env:
          REF: ${{ needs.go-image.outputs.ref }}
        run: |
          set -euo pipefail
          arm64=$(docker buildx imagetools inspect "$REF" --raw \
            | jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest')
          test -n "$arm64"
          docker pull "${REF%@*}@${arm64}"
          docker tag "${REF%@*}@${arm64}" varlatchd-release:check
          test "$(docker image inspect varlatchd-release:check --format '{{.Architecture}}')" = arm64
      # As arm64-e2e: the host may already run arm64 binaries through QEMU
      # handlers it registered; otherwise register them here.
      - name: arm64 emulation already available
        id: binfmt
        if: steps.mode.outputs.mode == 'emulated'
        run: |
          if [ "$(docker run --rm --entrypoint /opt/varlatch/varlatchd varlatchd-release:check --version 2>/dev/null)" != "" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        if: steps.mode.outputs.mode == 'emulated' && steps.binfmt.outputs.ready != 'true'
        with:
          platforms: arm64
      - name: The image as an operator runs it, on linux/arm64
        env:
          VARLATCH_TEST_SLOWDOWN: ${{ steps.mode.outputs.mode == 'emulated' && '6' || '' }}
        run: node go/image/check-image.mjs varlatchd-release:check

  # Signs SHA256SUMS, verifies the signature with the release's own CLI as
  # the installers will, and publishes the Go release.
  go-release:
    needs: [hosted-runner, line, go-assets, go-g5, go-image, go-image-check, go-image-arm64]
    runs-on: ${{ vars.RELEASE_RUNNER || (needs.hosted-runner.outputs.available == 'true' && 'ubuntu-latest') || 'varlatch-ci' }}
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read # the image's signature and SBOMs read from the registry
      id-token: write # keyless signing of SHA256SUMS
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-assets
          path: go-assets
      # First, before any downloaded byte is made executable or run (this
      # job holds the signing credential): the artifact must be exactly what
      # go-assets built. SHA256SUMS must have the hash go-assets reported,
      # every file must match its line, and nothing else may be there.
      - name: The downloaded assets are the ones built
        working-directory: go-assets
        env:
          SUMS: ${{ needs.go-assets.outputs.sums }}
        run: |
          [[ "$SUMS" =~ ^[0-9a-f]{64}$ ]] || { echo "go-assets reported no SHA256SUMS hash" >&2; exit 1; }
          [ "$(sha256sum SHA256SUMS | cut -d' ' -f1)" = "$SUMS" ] || { echo "SHA256SUMS is not the one go-assets built" >&2; exit 1; }
          sha256sum --check --strict --quiet SHA256SUMS
          listed=$( (cut -d' ' -f3 SHA256SUMS; echo SHA256SUMS) | LC_ALL=C sort)
          present=$(find . -mindepth 1 -printf '%P\n' | LC_ALL=C sort)
          [ "$listed" = "$present" ] || { echo "the artifact holds other files than SHA256SUMS lists" >&2; exit 1; }
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image this release ships: its signature from this workflow's
      # identity for this tag, before anything names it.
      - name: The image's signature verifies
        env:
          REF: ${{ needs.go-image.outputs.ref }}
        run: |
          set -euo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          export COSIGN_REPOSITORY="ghcr.io/${OWNER}/varlatch-signatures"
          cosign verify "${REF%%:*}@${REF##*@}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "verified ${REF}"
          # The tag still names the signed index (nothing pushed it since).
          [ "$(docker buildx imagetools inspect "${REF%@*}" --format '{{println .Manifest.Digest}}' | head -1)" = "${REF##*@}" ] \
            || { echo "${REF%@*} no longer names ${REF##*@}" >&2; exit 1; }
      # The image's record, listed in SHA256SUMS before it is signed, so the
      # one signature covers it: the cutover and the docs pin the image by
      # it. An image built on a self-hosted runner has no SBOM attestation:
      # its SBOMs, per architecture, become release files, as the
      # TypeScript images' do.
      - name: The image's record
        working-directory: go-assets
        env:
          REF: ${{ needs.go-image.outputs.ref }}
          HOSTED: ${{ needs.go-image.outputs.hosted }}
          VERSION: ${{ needs.line.outputs.version }}
          SYFT_VERSION: 1.52.0
          SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d # linux_amd64
        run: |
          set -euo pipefail
          printf '%s\n' "$REF" > varlatchd-image.txt
          sha256sum varlatchd-image.txt >> SHA256SUMS
          if [ "$HOSTED" != true ]; then
            test "$(uname -m)" = x86_64
            curl -fsSLo "$RUNNER_TEMP/syft.tar.gz" "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
            echo "${SYFT_SHA256}  $RUNNER_TEMP/syft.tar.gz" | sha256sum --check --strict -
            tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP" syft
            for arch in amd64 arm64; do
              file="sbom-varlatchd-${VERSION}-linux-${arch}.spdx.json"
              "$RUNNER_TEMP/syft" scan "registry:${REF}" --platform "linux/${arch}" -o "spdx-json=${file}" -q
              sha256sum "$file" >> SHA256SUMS
            done
            rm "$RUNNER_TEMP/syft"
          fi
      - name: Check the assets again, with the image
        env:
          VERSION: ${{ needs.line.outputs.version }}
          REF: ${{ needs.go-image.outputs.ref }}
          HOSTED: ${{ needs.go-image.outputs.hosted }}
        run: |
          chmod +x go-assets/varlatch-* go-assets/varlatchd-*
          sboms=()
          [ "$HOSTED" = true ] || sboms=(--sboms)
          go/release/check-assets.sh go-assets "$VERSION" --image "$REF" "${sboms[@]}"
      # The image's attestations, as published-release.yml checks them: an
      # SLSA provenance predicate and an SPDX SBOM (attested, or the
      # release file just listed) for each platform.
      - name: The image's attestations
        env:
          VERSION: ${{ needs.line.outputs.version }}
          REF: ${{ needs.go-image.outputs.ref }}
        run: go/image/check-attestations.sh "${REF%%:*}@${REF##*@}" "$VERSION" --sbom-dir go-assets --sums go-assets/SHA256SUMS

      # The Go line is always signed: the installers refuse an unsigned
      # release, so SIGN does not apply to it.
      - name: Sign SHA256SUMS
        working-directory: go-assets
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      # The installers' own check, before anything is published: this
      # release's varlatch verifies the signature against the identity it
      # pins, and every asset against SHA256SUMS.
      - name: The release's varlatch verifies it
        working-directory: go-assets
        env:
          VERSION: ${{ needs.line.outputs.version }}
        run: |
          mapfile -t names < <(cut -d' ' -f3 SHA256SUMS)
          files=()
          for f in "${names[@]}"; do files+=(--file "$f=$f"); done
          "./varlatch-$VERSION-linux-amd64" verify-release --version "$VERSION" \
            --sums SHA256SUMS --bundle SHA256SUMS.sigstore.json "${files[@]}"

      - name: Release notes from the changelog
        env:
          VERSION: ${{ needs.line.outputs.version }}
          REF: ${{ needs.go-image.outputs.ref }}
          HOSTED: ${{ needs.go-image.outputs.hosted }}
          ARM64_MODE: ${{ needs.go-image-arm64.outputs.mode }}
        run: |
          GUIDE="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/operations/verify-release.md"
          awk -v v="$VERSION" 'index($0, "## " v " (") == 1 { f = 1; next } f && /^## / { exit } f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $VERSION" >&2; exit 1; }
          if [ "$HOSTED" = true ]; then
            ATTESTATIONS="build-provenance and SBOM attestations"
          else
            ATTESTATIONS="build-provenance attestations (built on a self-hosted runner, where BuildKit cannot generate SBOM attestations: its SBOMs are attached as release files instead, \`sbom-varlatchd-${VERSION}-linux-ARCH.spdx.json\`, listed in \`SHA256SUMS\`)"
          fi
          {
            echo
            echo "---"
            echo
            echo "The Go binaries: \`varlatch\` for Linux, macOS and Windows and \`varlatchd\` for Linux, on amd64 and arm64, with \`install.sh\` and \`install.ps1\` for this version, the \`varlatchd\` systemd unit and its example configuration. Every asset is listed in \`SHA256SUMS\`, which is signed keyless by this workflow (\`SHA256SUMS.sigstore.json\`); the installers verify it before installing anything, and [verifying a release](${GUIDE}) shows how to check it with cosign."
            echo
            echo "The container image, for linux/amd64 and linux/arm64: \`${REF}\`. Pin it by that digest. It is signed keyless by this workflow (the signature is in \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/varlatch-signatures\`) and carries ${ATTESTATIONS}. \`varlatchd-image.txt\` records the same reference and is listed in \`SHA256SUMS\`."
            if [ "$ARM64_MODE" = emulated ]; then
              echo
              echo "The arm64 image passed its checks under emulation for this release, not on arm64 hardware."
            fi
          } >> notes.md

      - name: Create the GitHub release
        working-directory: go-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.line.outputs.prerelease }}
        run: |
          mapfile -t names < <(cut -d' ' -f3 SHA256SUMS)
          flags=()
          if [ "$PRERELEASE" = true ]; then flags=(--prerelease --latest=false); fi
          gh release create "$GITHUB_REF_NAME" "${names[@]}" SHA256SUMS SHA256SUMS.sigstore.json \
            --title "Varlatch $GITHUB_REF_NAME" --notes-file ../notes.md "${flags[@]}"
