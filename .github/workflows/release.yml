name: Release

# Digest-pinned release sets (ADR-0019 §26): pushing a v* tag builds and
# publishes the images and attaches the deployment unit self-hosters consume —
# varlatch-release.json (manifest), docker-compose.release.yml (upgrades, used
# by `varlatch upgrade`), varlatch-compose-<version>.tar.gz (first
# installs), varlatch-cli-<version>.cjs (operator CLI), THIRD-PARTY-NOTICES.md,
# and SHA256SUMS. Tags are for humans; digests are the canonical runtime pin.
#
# Provenance (ADR-0037 D4/D5): images are built for linux/amd64 and
# linux/arm64 with build-provenance and SBOM attestations, and each image and
# SHA256SUMS is signed keyless with Sigstore from this workflow's own OIDC
# identity. The release itself is only published once an end-to-end suite has
# passed on arm64. docs/operations/verify-release.md shows how to check all of
# it.
#
# Keyless signatures are recorded in Sigstore's public transparency log with
# the repository, tag, and digests they cover. A private repository's
# releases are therefore not signed unless the SIGN_PRIVATE_RELEASES
# repository variable is "true". An unsigned release's notes say so, and
# verify-release.md treats a release as unsigned only when they do.
#
# Runners: GitHub-hosted first. After validation (ci.yml, which decides for
# itself), the hosted-runner probe runs; when hosted minutes have run out,
# GitHub refuses it and the images, arm64-e2e and release jobs go to the
# self-hosted runner (label varlatch-ci), which gives every job a fresh
# container. RELEASE_RUNNER (a repository variable) forces a self-hosted
# runner label; a forced label is always treated as self-hosted (SBOMs as
# release files), so do not point it at a GitHub-hosted label.
# If minutes run out partway through, set RELEASE_RUNNER (and CI_RUNNER) and
# rerun the failed jobs: every job reads the variables again. On a
# self-hosted x64 runner the arm64 suite runs under emulation unless
# ARM64_RUNNER names an arm64 runner, and the release notes say so. BuildKit's
# SBOM scan cannot mount the image inside the self-hosted runner's sandbox
# (sysbox), so images built there carry provenance but no SBOM attestation;
# the release attaches their SBOMs as files instead, generated by syft from
# the pushed images, and the release notes say so too. Those choices follow
# where the images were actually built (the images job's `hosted` output).
# Third-party actions are pinned to commits because a self-hosted runner
# executes them on its host.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  SIGN: ${{ !github.event.repository.private || vars.SIGN_PRIVATE_RELEASES == 'true' }}

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read

  # Hosted runners first: this job only proves one would start. When hosted
  # minutes have run out GitHub refuses it within seconds; continue-on-error
  # keeps the release going (its result then still reads success, with no
  # output), and the jobs below run on the self-hosted runner.
  hosted-runner:
    name: GitHub-hosted runners available?
    needs: validation
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    outputs:
      available: ${{ steps.probe.outputs.available }}
    steps:
      - id: probe
        run: echo "available=true" >> "$GITHUB_OUTPUT"

  images:
    needs: [validation, hosted-runner]
    runs-on: ${{ vars.RELEASE_RUNNER || (needs.hosted-runner.outputs.available == 'true' && 'ubuntu-latest') || 'varlatch-ci' }}
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing
    outputs:
      hosted: ${{ steps.runner.outputs.hosted }}
      varlatchd: ${{ steps.refs.outputs.varlatchd }}
      web: ${{ steps.refs.outputs.web }}
      convex_deploy: ${{ steps.refs.outputs.convex_deploy }}
    steps:
      - name: Runner for the release
        id: runner
        env:
          FORCED: ${{ vars.RELEASE_RUNNER }}
          AVAILABLE: ${{ needs.hosted-runner.outputs.available }}
        run: |
          if [ -n "$FORCED" ]; then
            hosted=false why="self-hosted ($FORCED), forced by the RELEASE_RUNNER variable"
          elif [ "$AVAILABLE" = true ]; then
            hosted=true why="GitHub-hosted: minutes available"
          else
            hosted=false why="self-hosted (varlatch-ci): GitHub-hosted runners refused the probe (minutes used up)"
          fi
          echo "hosted=$hosted" >> "$GITHUB_OUTPUT"
          echo "Release images are built $why." | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compute image names
        id: names
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "varlatchd=ghcr.io/${OWNER}/varlatchd"
            echo "web=ghcr.io/${OWNER}/varlatch-web"
            echo "convex_deploy=ghcr.io/${OWNER}/varlatch-convex-deploy"
            echo "version=${GITHUB_REF_NAME#v}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build stages run natively; only the final stages' few RUN steps
      # execute under emulation for arm64.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Build and push varlatchd
        id: varlatchd
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: services/varlatchd/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: ${{ steps.runner.outputs.hosted == 'true' }}
          push: true
          tags: ${{ steps.names.outputs.varlatchd }}:${{ steps.names.outputs.version }}

      - name: Build and push varlatch-web
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: ${{ steps.runner.outputs.hosted == 'true' }}
          push: true
          tags: ${{ steps.names.outputs.web }}:${{ steps.names.outputs.version }}

      # Image-only installs must be able to (re)deploy the Application Plane
      # functions on upgrade — the deployer ships as part of the release set.
      - name: Build and push convex-deploy
        id: convex_deploy
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/compose/convex-deploy.Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: ${{ steps.runner.outputs.hosted == 'true' }}
          push: true
          tags: ${{ steps.names.outputs.convex_deploy }}:${{ steps.names.outputs.version }}

      - name: Sign the images
        id: refs
        run: |
          set -euo pipefail
          version=${{ steps.names.outputs.version }}
          varlatchd="${{ steps.names.outputs.varlatchd }}:${version}@${{ steps.varlatchd.outputs.digest }}"
          web="${{ steps.names.outputs.web }}:${version}@${{ steps.web.outputs.digest }}"
          convex_deploy="${{ steps.names.outputs.convex_deploy }}:${version}@${{ steps.convex_deploy.outputs.digest }}"
          for ref in "$varlatchd" "$web" "$convex_deploy"; do
            # Sign the multi-platform index the release manifest pins.
            if [ "$SIGN" = true ]; then cosign sign --yes "${ref%%:*}@${ref##*@}"; fi
          done
          {
            echo "varlatchd=$varlatchd"
            echo "web=$web"
            echo "convex_deploy=$convex_deploy"
          } >> "$GITHUB_OUTPUT"

  # ADR-0037 D5: the release images themselves, pulled for arm64 and run on
  # arm64 hardware, pass backup, restore, and recovery before publication.
  arm64-e2e:
    needs: images
    # GitHub's hosted arm64 runner when the images were built hosted;
    # ARM64_RUNNER selects another arm64 label. On the self-hosted x64 runner
    # the same suite runs the arm64 images under emulation, which is slower,
    # and the release notes say so. Only
    # Varlatch's own images run emulated there: PostgreSQL and the Convex
    # backend (third-party, pinned by digest) run natively, because Convex's
    # function time limits do not hold under emulation on a small host.
    runs-on: ${{ vars.ARM64_RUNNER || vars.RELEASE_RUNNER || (needs.images.outputs.hosted == 'true' && 'ubuntu-24.04-arm') || 'varlatch-ci' }}
    # Public logs: every line of this job's steps is masked (scripts/ci-shell.sh).
    defaults:
      run:
        shell: bash scripts/ci-shell.sh {0}
    timeout-minutes: ${{ (vars.ARM64_RUNNER || vars.RELEASE_RUNNER || needs.images.outputs.hosted != 'true') && 240 || 45 }}
    permissions:
      contents: read
      packages: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @varlatch/protocol generate && pnpm build
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Hardware or emulation
        id: mode
        run: |
          if [ "$(uname -m)" = aarch64 ]; then
            echo "mode=hardware" >> "$GITHUB_OUTPUT"
          else
            echo "mode=emulated" >> "$GITHUB_OUTPUT"
          fi
      - name: Take the release images for arm64
        run: |
          set -euo pipefail
          # Pull the arm64 manifest by digest, so the local image is arm64
          # whatever the host architecture and image store.
          take() {
            local arm64
            arm64=$(docker buildx imagetools inspect "$1" --raw \
              | jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest')
            test -n "$arm64"
            docker pull "${1%@*}@${arm64}"
            docker tag "${1%@*}@${arm64}" "$2"
            test "$(docker image inspect "$2" --format '{{.Architecture}}')" = arm64
          }
          take "${{ needs.images.outputs.varlatchd }}" varlatch-backup-test:local
          take "${{ needs.images.outputs.web }}" varlatch-backup-web-test:local
          take "${{ needs.images.outputs.convex_deploy }}" varlatch-backup-convex-deploy-test:local
      # A runner may already run arm64 binaries through QEMU handlers the host
      # registered (an unprivileged runner cannot register them itself);
      # otherwise register them here.
      - name: arm64 emulation already available
        id: binfmt
        if: steps.mode.outputs.mode == 'emulated'
        run: |
          if [ "$(docker run --rm --entrypoint uname varlatch-backup-test:local -m 2>/dev/null)" = aarch64 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        if: steps.mode.outputs.mode == 'emulated' && steps.binfmt.outputs.ready != 'true'
        with:
          platforms: arm64
      - name: arm64 images run here
        if: steps.mode.outputs.mode == 'emulated'
        run: test "$(docker run --rm --entrypoint uname varlatch-backup-test:local -m)" = aarch64
      - name: Backup, restore, and recovery on arm64
        env:
          # Emulated, the suite's leases, CLI runs, and readiness waits take
          # several times longer.
          VARLATCH_TEST_SLOWDOWN: ${{ steps.mode.outputs.mode == 'emulated' && '6' || '' }}
        run: node scripts/test-backup-e2e.mjs

  release:
    needs: [images, arm64-e2e]
    runs-on: ${{ vars.RELEASE_RUNNER || (needs.images.outputs.hosted == 'true' && 'ubuntu-latest') || 'varlatch-ci' }}
    permissions:
      contents: write
      packages: read # SBOM files read the pushed images
      id-token: write # keyless signing of SHA256SUMS
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The operator CLI ships as a single-file bundle built from this tag.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.3.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Build workspace (produces the CLI bundle)
        run: pnpm install --frozen-lockfile && pnpm build

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Resolve postgres digest
        id: postgres
        run: |
          DIGEST=$(docker buildx imagetools inspect docker.io/library/postgres:17.6 --format '{{println .Manifest.Digest}}' | head -1)
          echo "ref=docker.io/library/postgres:17.6@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Resolve ingress overlay image digests
        id: overlays
        run: |
          # Tags come from the overlays themselves; the release pins their digests.
          CADDY=docker.io/library/$(grep -m1 -oP 'image: \Kcaddy:\S+' infra/compose/docker-compose.caddy.yml)
          TAILSCALE=docker.io/$(grep -m1 -oP 'image: \Ktailscale/tailscale:\S+' infra/compose/docker-compose.tailscale.yml)
          echo "caddy=${CADDY}@$(docker buildx imagetools inspect "$CADDY" --format '{{println .Manifest.Digest}}' | head -1)" >> "$GITHUB_OUTPUT"
          echo "tailscale=${TAILSCALE}@$(docker buildx imagetools inspect "$TAILSCALE" --format '{{println .Manifest.Digest}}' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        run: |
          node infra/release/build-release-artifacts.mjs "${GITHUB_REF_NAME#v}" \
            --caddy "${{ steps.overlays.outputs.caddy }}" \
            --tailscale "${{ steps.overlays.outputs.tailscale }}" \
            --image "varlatchd=${{ needs.images.outputs.varlatchd }}" \
            --image "varlatch-web=${{ needs.images.outputs.web }}" \
            --image "convex-deploy=${{ needs.images.outputs.convex_deploy }}" \
            --postgres "${{ steps.postgres.outputs.ref }}"

      # Images without SBOM attestations (built self-hosted) get their
      # SBOMs as release files: syft reads each pushed image straight from
      # the registry, per architecture, so nothing needs mounting.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: needs.images.outputs.hosted != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: SBOMs as release files
        if: needs.images.outputs.hosted != 'true'
        env:
          SYFT_VERSION: 1.52.0
          SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d # linux_amd64
          VARLATCHD: ${{ needs.images.outputs.varlatchd }}
          WEB: ${{ needs.images.outputs.web }}
          CONVEX_DEPLOY: ${{ needs.images.outputs.convex_deploy }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          curl -fsSLo syft.tar.gz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum --check --strict -
          tar -xzf syft.tar.gz syft && rm syft.tar.gz
          VERSION=${GITHUB_REF_NAME#v}
          for pair in "varlatchd=$VARLATCHD" "varlatch-web=$WEB" "varlatch-convex-deploy=$CONVEX_DEPLOY"; do
            for arch in amd64 arm64; do
              file="sbom-${pair%%=*}-${VERSION}-linux-${arch}.spdx.json"
              ./syft scan "registry:${pair#*=}" --platform "linux/${arch}" -o "spdx-json=${file}" -q
              test "$(jq -r '.spdxVersion' "$file")" = SPDX-2.3
              sha256sum "$file" >> SHA256SUMS
            done
          done
          rm syft

      # One signature covers every asset: SHA256SUMS lists them all.
      - name: Sign SHA256SUMS
        if: env.SIGN == 'true'
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      # The release notes are this version's CHANGELOG.md section, so what
      # changed and how to upgrade is written once and reviewed in the PR.
      # An unsigned release says so first: verify-release.md treats a release
      # as unsigned only when its notes do.
      - name: Release notes from the changelog
        env:
          ARM64_MODE: ${{ needs.arm64-e2e.outputs.mode }}
          SBOM: ${{ needs.images.outputs.hosted == 'true' }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          GUIDE="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/operations/verify-release.md"
          awk -v v="$VERSION" 'index($0, "## " v " (") == 1 { f = 1; next } f && /^## / { exit } f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $VERSION" >&2; exit 1; }
          if [ "$SIGN" = true ]; then
            COVERS="also covers signatures, provenance, and SBOMs"
          else
            COVERS="covers provenance and SBOMs, and signatures for signed releases"
          fi
          if [ "$SBOM" = true ]; then
            ATTESTATIONS="build-provenance and SBOM attestations"
          else
            ATTESTATIONS="build-provenance attestations"
          fi
          {
            echo
            echo "---"
            echo
            if [ "$SIGN" != true ]; then
              echo "**This release is not signed.** Varlatch ${VERSION} was published from a private repository that has not opted in to signing, so it has no \`SHA256SUMS.sigstore.json\` and its images have no Sigstore signatures. The signature checks in verifying a release do not apply to it. Its images do carry ${ATTESTATIONS} for linux/amd64 and linux/arm64. Check it as [unsigned releases](${GUIDE}#unsigned-releases) describes. Those checks show that the assets and images are complete, consistent, and name the expected commit and workflow run; they do not prove that the release workflow produced them."
              echo
            fi
            if [ "$ARM64_MODE" = emulated ]; then
              echo "The arm64 images passed the backup, restore, and recovery suite under emulation for this release, not on arm64 hardware."
              echo
            fi
            if [ "$SBOM" != true ]; then
              echo "The images of this release were built on a self-hosted runner, where BuildKit cannot generate SBOM attestations: they carry provenance attestations, and their SBOMs are attached as release files instead (\`sbom-IMAGE-${VERSION}-linux-ARCH.spdx.json\`, listed in \`SHA256SUMS\`)."
              echo
            fi
            echo "Digest-pinned release set for linux/amd64 and linux/arm64. Check every asset against \`SHA256SUMS\`; [verifying a release](${GUIDE}) ${COVERS}. The operator CLI, \`varlatch-cli-${VERSION}.cjs\` (Node 22+), is version-coupled to the installation: replace the host CLI before anything else. First installs: unpack \`varlatch-compose-${VERSION}.tar.gz\` and follow its README."
          } >> notes.md

      - name: Create GitHub release with the deployment unit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          SIGNATURE=()
          if [ "$SIGN" = true ]; then SIGNATURE=(SHA256SUMS.sigstore.json); fi
          shopt -s nullglob
          SBOMS=(sbom-*.spdx.json)
          gh release create "$GITHUB_REF_NAME" \
            varlatch-release.json \
            docker-compose.release.yml \
            convex-supervisor.cjs \
            docker-compose.tailscale.yml docker-compose.tailnet-https.yml tailscale-serve.json \
            docker-compose.caddy.yml Caddyfile \
            "varlatch-compose-${VERSION}.tar.gz" \
            "varlatch-cli-${VERSION}.cjs" \
            THIRD-PARTY-NOTICES.md \
            "${SBOMS[@]}" \
            SHA256SUMS "${SIGNATURE[@]}" \
            --title "Varlatch $GITHUB_REF_NAME" \
            --notes-file notes.md
