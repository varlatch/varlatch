name: Secret audit

# Every branch and tag on the repository, scanned for secrets each night with
# its whole history (ADR-0037 D6: a secret in history is published with the
# repository). ci.yml's secret-scan covers the commit under test (a pull
# request's merge, a push to main, a release tag) but not a branch pushed
# without a pull request, a draft or conflicting pull request, or a tag
# outside release.yml's filter; this does. Each ref is read with its own
# .gitleaks.toml, so a branch's synthetic fixtures are judged by the
# allowlist that branch carries, as its own pull request judges them.
#
# It blocks nothing: a finding fails this workflow's run (which GitHub
# reports to the repository's owner) and names the ref. Values are redacted
# from the log.

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Fetch every branch and tag
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*' && git fetch --tags --force origin
      - name: Scan each ref with its own config
        run: |
          image=ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          docker pull -q "$image" >/dev/null
          failed=()
          while read -r ref; do
            cfg="$RUNNER_TEMP/gitleaks.toml"
            if git show "$ref:.gitleaks.toml" > "$cfg" 2>/dev/null; then
              config=(--config /cfg/gitleaks.toml)
            else
              config=()
            fi
            echo "::group::$ref"
            if ! docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP:/cfg:ro" \
              -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
              "$image" git /repo "${config[@]}" --log-opts="$ref" --redact=100 --no-banner; then
              failed+=("$ref")
            fi
            echo "::endgroup::"
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin refs/tags | grep -v '^refs/remotes/origin/HEAD$')
          if [ ${#failed[@]} -gt 0 ]; then
            printf '::error::Secrets found in the history of %s\n' "${failed[@]}"
            exit 1
          fi
