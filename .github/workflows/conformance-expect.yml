name: Conformance expectations

# The conformance harness's expected failures only shrink by default
# (scripts/conformance/README.md): a pull request that adds an entry to
# scripts/conformance/expect/*.json, removes a target's file, or deletes or
# renames the checker or a file it reads fails here unless it carries the
# conformance-regression label. Adding or removing the label runs the check
# again.
#
# Trust model. This runs on pull_request_target, so the workflow definition
# and every line of code that runs come from the base branch, never from the
# pull request: a pull request cannot replace this check with a no-op, nor
# change the checker that judges it. In return the job must never run the
# pull request's code, and does not:
#
#   - it checks out the BASE commit and runs only scripts/conformance/
#     expect-check.mjs and its imports from there (no install, no build);
#   - it fetches the pull request's head (refs/pull/<n>/head) as git objects
#     only; the checker reads the head's expect/*.json, inventory.json and
#     clients.json with `git show` and parses them as JSON. Nothing from the
#     head is checked out, installed, imported or executed;
#   - the token is read-only (contents: read), it is not persisted in the
#     checkout, and no secret is used;
#   - the label comes from the event's payload.
#
# A missing checker on the base fails the job: the workflow exists only on a
# base that also has the checker. A push to main validates the files it lands
# with the pushed commit's own checker. Hosted runners only.
on:
  pull_request_target:
    # ready_for_review: a draft runs nothing (as in CI), so the check runs
    # when the pull request is marked ready.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths:
      - "scripts/conformance/**"
      - ".github/workflows/conformance-expect.yml"
  push:
    branches: [main]
    paths:
      - "scripts/conformance/**"
      - ".github/workflows/conformance-expect.yml"

permissions:
  contents: read

# Per pull request: under pull_request_target github.ref is the base branch,
# which every pull request shares.
concurrency:
  group: conformance-expect-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  expectations:
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The code that runs: the base commit of the pull request, or the pushed commit on main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          # The merge base of the base and head commits must be present.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      # The pull request's commits, as objects only (a fork's too): nothing is checked out.
      - name: Fetch the pull request's head as data
        if: github.event_name == 'pull_request_target'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pull/head"
      - name: Expected failures only shrink unless labeled
        if: github.event_name == 'pull_request_target'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'conformance-regression') }}
        run: |
          if [ ! -f scripts/conformance/expect-check.mjs ]; then
            echo "::error::the base commit has no scripts/conformance/expect-check.mjs: nothing trusted can judge this pull request"
            exit 1
          fi
          flags=()
          if [ "$LABELED" = true ]; then flags+=(--labeled); fi
          node scripts/conformance/expect-check.mjs --base "$BASE" --head "$HEAD" "${flags[@]}"
      - name: The expected failures on main are valid
        if: github.event_name == 'push'
        run: node scripts/conformance/expect-check.mjs --validate-only --head "$GITHUB_SHA"
