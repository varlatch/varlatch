name: Conformance expectations

# The conformance harness's expected failures only shrink by default
# (scripts/conformance/README.md): a pull request that adds an entry to
# scripts/conformance/expect/*.json fails here unless it carries the
# conformance-regression label. Adding or removing the label runs the check
# again. Like CI, a draft pull request runs nothing. Hosted runners only.
#
# The checker is trusted code: on a pull request it runs from the base
# commit, never from the pull request, so a pull request cannot change the
# checker and add entries in one go. The pull request's head is fetched as
# git objects only, and the checker reads its expect/*.json, inventory.json
# and clients.json with `git show` and parses them as JSON; nothing from the
# head is executed. (This workflow file itself comes from the pull request,
# as for every pull_request workflow, so a change to it is reviewed as code.
# pull_request_target is not used: it would run with write access next to
# the pull request's files.) A push to main validates the files it lands.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths:
      - "scripts/conformance/expect/**"
      - "scripts/conformance/inventory.json"
      - "scripts/conformance/clients.json"
      - "scripts/conformance/lib/expect.mjs"
      - "scripts/conformance/lib/inventory.mjs"
      - "scripts/conformance/expect-check.mjs"
      - ".github/workflows/conformance-expect.yml"
  push:
    branches: [main]
    paths:
      - "scripts/conformance/expect/**"
      - "scripts/conformance/inventory.json"
      - "scripts/conformance/clients.json"
      - "scripts/conformance/lib/expect.mjs"
      - "scripts/conformance/lib/inventory.mjs"
      - "scripts/conformance/expect-check.mjs"
      - ".github/workflows/conformance-expect.yml"

permissions:
  contents: read

concurrency:
  group: conformance-expect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expectations:
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The code that runs: the pull request's base commit, or the pushed commit on main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          # The merge base of the base and head commits must be present.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      # The pull request's commits, as objects only (a fork's too): nothing is checked out.
      - name: Fetch the pull request's head as data
        if: github.event_name == 'pull_request'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pull/head"
      - name: Expected failures only shrink unless labeled
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'conformance-regression') }}
        run: |
          if [ ! -f scripts/conformance/expect-check.mjs ]; then
            # Only the pull request that introduces the checker: its base has
            # no checker to trust, and no expectations to add to.
            echo "::notice::the base commit has no expectations checker yet; nothing to compare"
            exit 0
          fi
          flags=()
          if [ "$LABELED" = true ]; then flags+=(--labeled); fi
          node scripts/conformance/expect-check.mjs --base "$BASE" --head "$HEAD" "${flags[@]}"
      - name: The expected failures on main are valid
        if: github.event_name == 'push'
        run: node scripts/conformance/expect-check.mjs --validate-only --head "$GITHUB_SHA"
