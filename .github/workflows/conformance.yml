name: Conformance

# The conformance matrix (ADR-0059 step 2; scripts/conformance/README.md):
# each target against each CLI, every cell its own job with its own
# disposable stack on its own free ports.
#
#   targets  ts-source (this checkout, built) and ts-release:0.22.0 (the
#            signed release, verified and pulled by digest), each with every
#            CLI; go-binary (the Go varlatchd, built here with its
#            dashboard) with the CLI built from source, its missing
#            operations declared in scripts/conformance/expect/go-binary.json
#            (ADR-0059 step 3)
#   CLIs     source (this checkout), 0.21.0 and 0.22.0 (pinned in
#            scripts/conformance/clients.json, verified before use)
#
# The source images are built once, in the images job, and handed to the
# ts-source cells as an artifact. Each cell uploads its conformance report.
# A known failure is listed in scripts/conformance/expect/<target>.json with
# its reason; anything else that fails, fails the cell. Weekly, and on
# manual dispatch (GitHub accepts a dispatch only once this file is on the
# default branch; it can then run on any branch that has it). Hosted runners
# only; no secret beyond the read-only job token.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Public logs: every line of this job's steps is masked (scripts/ci-shell.sh).
    defaults:
      run:
        shell: bash scripts/ci-shell.sh {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - name: Build the source images once, labeled with this commit
        run: node scripts/conformance/source-images.mjs ci --save "$RUNNER_TEMP/source-images.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-images
          path: ${{ runner.temp }}/source-images.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  cell:
    needs: images
    name: ${{ matrix.target }} x CLI ${{ matrix.cli }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target: [ts-source, "ts-release:0.22.0"]
        cli: [source, "0.21.0", "0.22.0"]
        include:
          - target: go-binary
            cli: source
    # Public logs: every line of this job's steps is masked (scripts/ci-shell.sh).
    defaults:
      run:
        shell: bash scripts/ci-shell.sh {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @varlatch/protocol generate && pnpm build
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.target == 'go-binary'
        with:
          go-version: 1.27.4
          cache: false
      # The dashboard first (go generate ./server/web, with the Node and pnpm
      # set up above), then varlatchd, which embeds it.
      - name: Build varlatchd
        if: matrix.target == 'go-binary'
        env:
          CGO_ENABLED: "0"
        run: |
          cd go
          go generate ./server/web
          go build -o "$RUNNER_TEMP/varlatchd" ./cmd/varlatchd
      - name: Install Chromium
        run: pnpm --filter @varlatch/varlatchd exec playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.target == 'ts-source'
        with:
          name: source-images
          path: ${{ runner.temp }}/images
      - name: Load the source images
        if: matrix.target == 'ts-source'
        run: gunzip -c "$RUNNER_TEMP/images/source-images.tar.gz" | docker load
      - name: Report name
        id: name
        env:
          TARGET: ${{ matrix.target }}
          CLI: ${{ matrix.cli }}
        run: echo "artifact=conformance-report-${TARGET//:/-}-cli-${CLI}" >> "$GITHUB_OUTPUT"
      - name: Run the conformance suites
        env:
          TARGET: ${{ matrix.target }}
          CLI: ${{ matrix.cli }}
          CONFORMANCE_SOURCE_IMAGES: ${{ matrix.target == 'ts-source' && 'ci' || '' }}
        run: |
          if [ "$TARGET" = go-binary ]; then TARGET="go-binary:$RUNNER_TEMP/varlatchd"; fi
          node scripts/conformance/run.mjs --target "$TARGET" --cli "$CLI" --report conformance-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: conformance-report.json
          retention-days: 30
          if-no-files-found: warn
