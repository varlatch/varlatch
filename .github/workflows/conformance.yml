name: Conformance

# The conformance matrix (ADR-0059 step 2; scripts/conformance/README.md):
# each target against each CLI, every cell its own job with its own
# disposable stack on its own free ports.
#
#   targets  ts-source (this checkout, built) and ts-release:0.22.0 (the
#            signed release, verified and pulled by digest), each with every
#            CLI; go-binary (the Go varlatchd, built here with its
#            dashboard) with the CLI built from source, its missing
#            operations declared in scripts/conformance/expect/go-binary.json
#            (ADR-0059 step 3)
#   CLIs     source (this checkout), 0.21.0 and 0.22.0 (pinned in
#            scripts/conformance/clients.json, verified before use); go (the
#            Go CLI, built here) against both TypeScript targets, its
#            missing features declared in scripts/conformance/client-go.json
#            (internal docs/design/go-cli.md, decision 3). go.yml runs
#            go-binary x go.
#
# The source images are built once, in the images job, and handed to the
# ts-source cells as an artifact. Each cell uploads its conformance report.
# A known failure is listed in scripts/conformance/expect/<target>.json with
# its reason; anything else that fails, fails the cell. Weekly, and on
# manual dispatch (GitHub accepts a dispatch only once this file is on the
# default branch; it can then run on any branch that has it). A dispatch
# runs every cell, or the one its `cell` input names: a Go CLI slice links a
# dispatched `ts-release:0.22.0 x go` run (gh workflow run conformance.yml
# --ref <branch> -f "cell=ts-release:0.22.0 x go"). Hosted runners only; no
# secret beyond the read-only job token.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      cell:
        description: The cell to run (target x CLI), or all
        type: choice
        default: all
        options:
          - all
          - ts-source x source
          - ts-source x 0.21.0
          - ts-source x 0.22.0
          - ts-source x go
          - ts-release:0.22.0 x source
          - ts-release:0.22.0 x 0.21.0
          - ts-release:0.22.0 x 0.22.0
          - ts-release:0.22.0 x go
          - go-binary x source

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The cells of this run: every one, or the one a dispatch names.
  cells:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.cells.outputs.matrix }}
      images: ${{ steps.cells.outputs.images }}
    steps:
      - name: Choose the cells
        id: cells
        env:
          CELL: ${{ inputs.cell || 'all' }}
        run: |
          all=$(jq -cn '
            [(["ts-source", "ts-release:0.22.0"][] as $t | ["source", "0.21.0", "0.22.0", "go"][] | {target: $t, cli: .}),
             {target: "go-binary", cli: "source"}]')
          if [ "$CELL" = all ]; then
            cells=$all
          else
            cells=$(jq -c --arg cell "$CELL" '[.[] | select("\(.target) x \(.cli)" == $cell)]' <<< "$all")
          fi
          [ "$cells" != "[]" ] || { echo "::error::No cell is named $CELL."; exit 1; }
          jq -r '.[] | "\(.target) x CLI \(.cli)"' <<< "$cells"
          echo "matrix={\"include\":$cells}" >> "$GITHUB_OUTPUT"
          echo "images=$(jq 'any(.[]; .target == "ts-source")' <<< "$cells")" >> "$GITHUB_OUTPUT"

  images:
    needs: cells
    if: needs.cells.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Public logs: every line of this job's steps is masked (scripts/ci-shell.sh).
    defaults:
      run:
        shell: bash scripts/ci-shell.sh {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - name: Build the source images once, labeled with this commit
        run: node scripts/conformance/source-images.mjs ci --save "$RUNNER_TEMP/source-images.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-images
          path: ${{ runner.temp }}/source-images.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  cell:
    needs: [cells, images]
    # images is skipped when no ts-source cell runs.
    if: always() && needs.cells.result == 'success' && (needs.images.result == 'success' || needs.images.result == 'skipped')
    name: ${{ matrix.target }} x CLI ${{ matrix.cli }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.cells.outputs.matrix) }}
    # Public logs: every line of this job's steps is masked (scripts/ci-shell.sh).
    defaults:
      run:
        shell: bash scripts/ci-shell.sh {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @varlatch/protocol generate && pnpm build
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.target == 'go-binary' || matrix.cli == 'go'
        with:
          go-version: 1.27.4
          cache: false
      # The dashboard first (go generate ./server/web, with the Node and pnpm
      # set up above), then varlatchd, which embeds it.
      - name: Build varlatchd
        if: matrix.target == 'go-binary'
        env:
          CGO_ENABLED: "0"
        run: |
          cd go
          go generate ./server/web
          go build -tags conformance -o "$RUNNER_TEMP/varlatchd" ./cmd/varlatchd
      - name: Build the Go CLI
        if: matrix.cli == 'go'
        env:
          CGO_ENABLED: "0"
        run: |
          cd go
          go build -o "$RUNNER_TEMP/varlatch" ./cmd/varlatch
      - name: Install Chromium
        run: scripts/ci-install-chromium.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.target == 'ts-source'
        with:
          name: source-images
          path: ${{ runner.temp }}/images
      - name: Load the source images
        if: matrix.target == 'ts-source'
        run: gunzip -c "$RUNNER_TEMP/images/source-images.tar.gz" | docker load
      - name: Report name
        id: name
        env:
          TARGET: ${{ matrix.target }}
          CLI: ${{ matrix.cli }}
        run: echo "artifact=conformance-report-${TARGET//:/-}-cli-${CLI}" >> "$GITHUB_OUTPUT"
      - name: Run the conformance suites
        env:
          TARGET: ${{ matrix.target }}
          CLI: ${{ matrix.cli }}
          CONFORMANCE_SOURCE_IMAGES: ${{ matrix.target == 'ts-source' && 'ci' || '' }}
        run: |
          if [ "$TARGET" = go-binary ]; then TARGET="go-binary:$RUNNER_TEMP/varlatchd"; fi
          if [ "$CLI" = go ]; then CLI="go:$RUNNER_TEMP/varlatch"; fi
          node scripts/conformance/run.mjs --target "$TARGET" --cli "$CLI" --report conformance-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: conformance-report.json
          retention-days: 30
          if-no-files-found: warn
