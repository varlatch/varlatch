# Gitleaks configuration for the full-history secret scan (.github/workflows).
# Extends the default rules; the allowlist below covers synthetic test data only.

[extend]
useDefault = true

[allowlist]
description = "Synthetic cross-language envelope fixtures: keys and tokens are random values generated by tsfixtures.mjs, and its PEM is a truncated header, not a key"
paths = [
  '''^go/lib/envelope/testdata/(ts-v[0-9.]+|go-sealed)\.json$''',
  '''^go/lib/envelope/testdata/tsfixtures\.mjs$''',
]
